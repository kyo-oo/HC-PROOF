name: GST Hodge - Unified Primitive Wave Rank Compiler

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTHodgeGSTUnifiedPrimitiveWaveRank.lean'
      - '.github/workflows/gst-hodge-unified-primitive-wave-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-hodge-unified-primitive-wave-rank
  cancel-in-progress: false

jobs:
  verify:
    name: Lean verify full wave native rank and primitive Hodge reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-unified-primitive-wave-rank
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-unified-primitive-wave-rank
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Compile full GST primitive-wave rank theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTUnifiedPrimitiveWaveRankLib GSTHodgeGSTUnifiedPrimitiveWaveRank
          if timeout 9900 lake build GSTHodgeGSTUnifiedPrimitiveWaveRank > gst-unified-primitive-wave-rank.log 2>&1; then
            echo "LEAN PASSED: GSTHodgeGSTUnifiedPrimitiveWaveRank"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-unified-primitive-wave-rank.log | tail -n 100 || true
            tail -n 80 gst-unified-primitive-wave-rank.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-unified-primitive-wave-rank.log; then
            echo "Unexpected sorry axiom"
            exit 1
          fi
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-unified-primitive-wave-rank
          path: gst-unified-primitive-wave-rank.log
          if-no-files-found: warn
