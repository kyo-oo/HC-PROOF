name: Mathbox N Ample Shift Integral Realization
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - GSTNAmpleShiftIntegralRealization.lean
      - .github/workflows/gst-n-ample-shift-integral-realization.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-n-ample-shift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify exact integer shifted calibrated N-channel sequence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTNAmpleShift"
          roots = ["GSTNIntegralCalibrationGap", "GSTNAmpleShiftIntegralRealization"]
          EOF
          if lake build GSTNAmpleShift > gst-n-ample-shift.log 2>&1; then
            echo "LEAN PASSED: finite N-channel shifted integral zero-defect sequence, not all-X Hodge"
          else
            grep -nE 'error:|sorryAx|✖' gst-n-ample-shift.log | tail -n 160 || true
            tail -n 130 gst-n-ample-shift.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-n-ample-shift.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-n-ample-shift-lean-log
          path: gst-n-ample-shift.log
          if-no-files-found: warn
