name: GST Primitive Blowup Gram Unimodularity
on:
  push:
    branches: [research/gpt6-gst-blowup-transfer-20261015]
    paths:
      - GSTBlowupGramUnimodularity.lean
      - .github/workflows/gst-blowup-gram-unimodularity.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-blowup-gram-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-gram
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Compile exact three-cycle Gram identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTBlowupGram"
          roots = ["GSTBlowupGramUnimodularity"]
          EOF
          if lake build GSTBlowupGram > gst-gram.log 2>&1; then
            echo "LEAN PASSED: symbolic rational Gram inverse"
          else
            grep -nE 'error:|sorryAx|✖' gst-gram.log | tail -n 100 || true
            tail -n 90 gst-gram.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-gram.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-noncellular-gram-unimodularity-log
          path: gst-gram.log
          if-no-files-found: warn
