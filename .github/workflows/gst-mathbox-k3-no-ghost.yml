name: Mathbox K3 Complete GST No Ghost
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTK3ScalarEndGhostExtinction.lean
      - .github/workflows/gst-mathbox-k3-no-ghost.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-k3-noghost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Compile real GST omniversal ghost extinction for K3 family
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTK3NoGhost"
          roots = [
            "GSTK3DiagonalPrimitive",
            "GSTK3DiagonalActualStage2G",
            "GSTK3TranscendentalHodgeCompleteness",
            "GSTClassicalHodgeOmniversalSeparatorGhostCrown",
            "GSTK3ScalarEndGhostExtinction"
          ]
          EOF
          if lake build GSTK3NoGhost > k3-noghost.log 2>&1; then
            echo 'LEAN PASSED: true GST omniversal no-ghost on scalar-End K3 selfproduct'
          else
            grep -nE 'error:|sorryAx|✖' k3-noghost.log | tail -n 160 || true
            tail -n 140 k3-noghost.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" k3-noghost.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-mathbox-k3-noghost-log
          path: k3-noghost.log
          if-no-files-found: warn
