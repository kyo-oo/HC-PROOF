name: Stage 2 Geometric Realization Gate

on:
  push:
    branches:
      - main
    paths:
      - 'GSTGeometricRealizationStage2.lean'
      - 'GSTGeometricRealizationStage2B.lean'
      - 'GSTGeometricRealizationStage2C.lean'
      - 'GSTGeometricRealizationStage2D.lean'
      - 'GSTProjectiveOverC.lean'
      - 'GSTGeometricRealizationStage2E.lean'
      - 'GSTGeometricRealizationStage2F.lean'
      - 'GSTGeometricRealizationStage2G.lean'
      - '.github/workflows/stage2-realization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-realization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage2-realization:
    name: Stage 2 realization (0 errors, 0 proof escapes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' GSTGeometricRealizationStage2.lean GSTGeometricRealizationStage2B.lean GSTGeometricRealizationStage2C.lean GSTGeometricRealizationStage2D.lean GSTProjectiveOverC.lean GSTGeometricRealizationStage2E.lean GSTGeometricRealizationStage2F.lean GSTGeometricRealizationStage2G.lean; then
            echo STAGE2_FORBIDDEN_PROOF_ESCAPE=1
            exit 1
          fi
          echo STAGE2_PROOF_ESCAPE_CHECK=PASS

      - name: Compile Stage 2 realization
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTGeometricRealizationStage2 \
            GSTGeometricRealizationStage2B \
            GSTGeometricRealizationStage2C \
            GSTGeometricRealizationStage2D \
            GSTProjectiveOverC \
            GSTGeometricRealizationStage2E \
            GSTGeometricRealizationStage2F \
            GSTGeometricRealizationStage2G 2>&1 | tee stage2-realization.log
          echo STAGE2_REALIZATION_BUILD_GREEN=1

      - name: Verify no sorryAx in capstone
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sorryAx' stage2-realization.log; then
            echo STAGE2_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo STAGE2_AXIOM_AUDIT=PASS

      - name: Upload Stage 2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-realization-diagnostics
          path: stage2-realization.log
          if-no-files-found: ignore
