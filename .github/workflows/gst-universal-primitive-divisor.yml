name: GST Universal Primitive Divisor Construction
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTUniversalPrimitiveDivisorConstruction.lean'
      - '.github/workflows/gst-universal-primitive-divisor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-primitive-divisor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore incremental dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-primitive-divisor
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify exact primitive-divisor constructor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTUniversalPrimitiveDivisors"
          roots = ["GSTUniversalPrimitiveDivisorConstruction"]
          EOF
          if lake build GSTUniversalPrimitiveDivisors > primitive-divisor-lean.log 2>&1; then
            echo "LEAN PASSED: exact native primitive divisor cycle from rational Hodge(1,1) and true degree"
          else
            grep -nE 'error:|sorryAx|✖' primitive-divisor-lean.log | tail -n 130 || true
            tail -n 85 primitive-divisor-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" primitive-divisor-lean.log; then
            exit 1
          fi
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-universal-primitive-divisor-log
          path: primitive-divisor-lean.log
          if-no-files-found: warn
