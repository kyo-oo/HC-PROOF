name: Mathbox K3 Diagonal Primitive Geometric Correspondence
on:
  push:
    branches:
      - research/mathbox-k3-diagonal-primitive-20261015
    paths:
      - GSTK3DiagonalPrimitive.lean
      - .github/workflows/gst-mathbox-k3-diagonal-primitive.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-k3-primitive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-k3
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel check primitive diagonal and transcendental detector
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTK3Primitive"
          roots = ["GSTK3DiagonalPrimitive"]
          EOF
          if lake build GSTK3Primitive > k3-primitive-lean.log 2>&1; then
            echo 'LEAN PASSED: K3 diagonal non-divisor primitive'
          else
            grep -nE 'error:|sorryAx|✖' k3-primitive-lean.log | tail -n 100 || true
            tail -n 130 k3-primitive-lean.log
            exit 1
          fi
          if grep -E 'declaration uses .sorry.|sorryAx' k3-primitive-lean.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-mathbox-k3-primitive-lean-log
          path: k3-primitive-lean.log
          if-no-files-found: warn
