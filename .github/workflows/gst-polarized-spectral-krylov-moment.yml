name: GST Polarized Spectral Krylov Moment
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTClassicalHodgeGeometricKrylovMomentDeterminant.lean'
      - '.github/workflows/gst-polarized-spectral-krylov-moment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-polarized-spectral-krylov-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-deep-spectral-krylov
          restore-keys: |
            hc-lean-incremental-Linux-deep-spectral-krylov
            hc-lean-incremental-${{ runner.os }}-
      - name: Compile full-rank polarized spectral Krylov geometry
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTSpectralKrylovMoment GSTClassicalHodgeGeometricKrylovMomentDeterminant
          set +e
          timeout 9000 lake build GSTSpectralKrylovMoment > gst-spectral-krylov.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "LEAN PASSED: actual rational spectral moment determinant and geometry"
          elif [ "$RC" -eq 124 ]; then
            echo "SLICE WINDOW EXHAUSTED (150 min of deep-chain building banked by the always-save step; modules built this attempt: $(grep -c 'Built ' gst-spectral-krylov.log || true)) — re-dispatch to resume from the banked cache"
            exit 1
          else
            grep -nE 'error:|sorryAx|✖' gst-spectral-krylov.log | tail -n 100 || true
            tail -n 90 gst-spectral-krylov.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-spectral-krylov.log; then exit 1; fi
      - name: Save Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-deep-spectral-krylov-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-spectral-krylov-lean
          path: gst-spectral-krylov.log
          if-no-files-found: warn
