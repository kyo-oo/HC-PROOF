name: GST Native Algebraic Sheet Realization
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTClassicalHodgeGlobalSheetSaturation.lean'
      - '.github/workflows/gst-native-algebraic-sheet-realization.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-native-algebraic-sheet-realization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore Lean dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-native-sheet
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel-check all-X native Chow image and GST sheet-realization obstruction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTNativeAlgebraicSheetRealization GSTClassicalHodgeGlobalSheetSaturation
          if lake build GSTNativeAlgebraicSheetRealization > native-algebraic-sheet.log 2>&1; then
            echo "LEAN PASSED: actual original-X native Chow address-image bridge"
          else
            grep -nE 'error:|sorryAx|✖' native-algebraic-sheet.log | tail -n 130 || true
            tail -n 90 native-algebraic-sheet.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" native-algebraic-sheet.log; then exit 1; fi
      - name: Upload proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-algebraic-sheet-lean-log
          path: native-algebraic-sheet.log
          if-no-files-found: warn
