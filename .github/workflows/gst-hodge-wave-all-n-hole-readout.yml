name: GST Hodge - All N-Hole Wave Geometric Quotient

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTHodgeWaveAllNHoleReadout.lean'
      - 'GSTHodgeWaveAllNGeometricLanding.lean'
      - '.github/workflows/gst-hodge-wave-all-n-hole-readout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-hodge-wave-all-n-hole-readout
  cancel-in-progress: false

jobs:
  verify:
    name: Lean kernel check all-N GST wave/CM source quotient
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-wave-all-n-readout
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-wave-all-n-readout
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Kernel compile all-N wave eigen-readout
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTWaveAllNReadoutLib GSTHodgeWaveAllNHoleReadout
          if timeout 9900 lake build GSTHodgeWaveAllNHoleReadout > gst-wave-all-n.log 2>&1; then
            echo "LEAN PASSED: GSTHodgeWaveAllNHoleReadout"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-wave-all-n.log | tail -n 120 || true
            tail -n 85 gst-wave-all-n.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-wave-all-n.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Kernel compile native geometric landing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f GSTHodgeWaveAllNGeometricLanding.lean ]; then
            echo "Geometric landing not added yet"
            exit 0
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTWaveAllNGeomLib GSTHodgeWaveAllNGeometricLanding
          if timeout 9900 lake build GSTHodgeWaveAllNGeometricLanding > gst-wave-native-all-n.log 2>&1; then
            echo "LEAN PASSED: GSTHodgeWaveAllNGeometricLanding"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-wave-native-all-n.log | tail -n 120 || true
            tail -n 85 gst-wave-native-all-n.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-wave-native-all-n.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-wave-all-n-native-lean
          path: |
            gst-wave-all-n.log
            gst-wave-native-all-n.log
          if-no-files-found: warn
