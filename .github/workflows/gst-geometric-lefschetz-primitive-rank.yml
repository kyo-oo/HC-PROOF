name: GST Geometric Lefschetz Primitive Rank
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTClassicalHodgeRankFreeLefschetzPoincareGeneration.lean'
      - '.github/workflows/gst-geometric-lefschetz-primitive-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-geometric-primitive-rank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore dependency build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-geom-lp
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel compile actual geometric LP no-rotation theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTGeometricLPPrimitiveRank GSTClassicalHodgeRankFreeLefschetzPoincareGeneration
          if lake build GSTGeometricLPPrimitiveRank > geometric-lp.log 2>&1; then
            echo "LEAN PASSED: genuine Lefschetz word no-rotation and finite-combination source-line theorem"
          else
            grep -nE 'error:|sorryAx|✖' geometric-lp.log | tail -n 140 || true
            tail -n 100 geometric-lp.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" geometric-lp.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-geometric-lp-primitive-rank-log
          path: geometric-lp.log
          if-no-files-found: warn
