name: Mathbox GST Universal External Product Surgery
on:
  push:
    branches: [mathbox/residual-zero-direct-audit-20261015]
    paths:
      - GSTUniversalExternalProductCurrentSurgery.lean
      - .github/workflows/gst-universal-external-current-surgery.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-universal-external-surgery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify exact primitive defect survives all-X product surgery
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTUniversalExternalCurrentSurgery"
          roots = ["GSTNPrimitiveGeometricSurgery",
                   "GSTUniversalExternalProductCurrentSurgery"]
          EOF
          if lake build GSTUniversalExternalCurrentSurgery > gst-external-surgery.log 2>&1; then
            echo "LEAN PASSED: functorial product-surgery defect arithmetic and integral homology signature"
          else
            grep -nE 'error:|sorryAx|✖' gst-external-surgery.log | tail -n 120 || true
            tail -n 130 gst-external-surgery.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-external-surgery.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-external-surgery-proof-log
          path: gst-external-surgery.log
          if-no-files-found: warn
