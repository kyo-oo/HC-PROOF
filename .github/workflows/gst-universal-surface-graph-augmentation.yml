name: GST Universal Surface Graph Primitive Augmentation
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - GSTUniversalSurfaceGraphAugmentation.lean
      - scripts/gst_lean_dependency_roots.py
      - .github/workflows/gst-universal-surface-graph-augmentation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-surface-graph-augmentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-surface-orbit
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel prove every augmentation-zero graph cycle primitive
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTUniversalSurfaceGraphGate GSTUniversalSurfaceGraphAugmentation
          if lake build GSTUniversalSurfaceGraphGate > surface-graph-lean.log 2>&1; then
            echo "LEAN PASSED: uniform finite graph-orbit augmentation produces genuine native primitive cycles"
          else
            grep -nE 'error:|sorryAx|✖' surface-graph-lean.log | tail -n 110 || true
            tail -n 80 surface-graph-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" surface-graph-lean.log; then
            exit 1
          fi
      - name: Cache compiled GST geometry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-surface-orbit
      - name: Save exact kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-surface-graph-augmentation-lean
          path: surface-graph-lean.log
          if-no-files-found: warn
