name: Mathbox Primitive Hyperplane Relative Geometry
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - GSTPrimitiveMiddleHyperplaneRelative.lean
      - .github/workflows/gst-primitive-hyperplane-relative.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathbox-hodge-hyperplane-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - name: Archive exact tracked GST and HC source tree for complete Mathbox reading
        if: always()
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf hc-mathbox-source-revision.tgz
      - name: Upload complete checked-out source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-mathbox-complete-source-tree
          path: hc-mathbox-source-revision.tgz
          if-no-files-found: error
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify primitive hyperplane and relative cohomology proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTHodgePrimitiveHyperplane"
          roots = ["GSTPrimitiveMiddleHyperplaneRelative"]
          EOF
          if lake build GSTHodgePrimitiveHyperplane > gst-hodge-hyperplane.log 2>&1; then
            echo "LEAN PASSED: primitive restriction zero and relative carrier"
          else
            grep -nE 'error:|sorryAx|✖' gst-hodge-hyperplane.log | tail -n 150 || true
            tail -n 150 gst-hodge-hyperplane.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-hodge-hyperplane.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-hodge-primitive-relative-lean-log
          path: gst-hodge-hyperplane.log
          if-no-files-found: warn
