name: Astra Repair Wave 83

on:
  push:
    branches: [gst-cosmology-strengthening]
    paths:
      - '.github/workflows/astra-repair-wave83.yml'

jobs:
  repair:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gst-cosmology-strengthening
          fetch-depth: 0

      - name: Patch four live Lean failures
        run: python3 scripts/astra_repair_wave83.py

      - name: Commit direct source repairs and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/astra-repair-wave83.yml
          rm scripts/astra_repair_wave83.py
          rm -f AstraGateTrigger.lean
          git config user.name kyo-oo
          git config user.email kyo-oo@users.noreply.github.com
          git add -A
          git commit -m 'Repair gate 83 cosmology compile failures'
          git push origin HEAD:gst-cosmology-strengthening
