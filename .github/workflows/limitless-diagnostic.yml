name: Limitless Burst Diagnostic

on:
  push:
    branches:
      - sol/limitless-cosmology-bursts
    paths:
      - '.github/workflows/limitless-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/limitless-cosmology-bursts
          fetch-depth: 1

      - name: Replay current limitless burst
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('.github/workflows/limitless-proof-repair.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, '.github/workflows/limitless-proof-repair.yml:inline-python', 'exec'))
          PY

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Compile and capture exact failure
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            GSTTransferBridgeV2 \
            GSTGeometricRealizationStage2E \
            GSTGeometricRealizationStage2F \
            GSTGeometricRealizationStage2G \
            HCProof 2>&1 | tee /tmp/limitless-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostic log on failure
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 500 /tmp/limitless-build.log > .github/limitless-last-build.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/limitless-last-build.log
          git commit -m "Record limitless burst compiler failure"
          git push origin HEAD:sol/limitless-cosmology-bursts

      - name: Mark diagnostic success
        if: steps.compile.outputs.status == '0'
        run: echo "LIMITLESS BURST COMPILES GREEN"
