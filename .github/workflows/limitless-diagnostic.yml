name: Land Verified Limitless Burst

on:
  push:
    branches:
      - sol/limitless-cosmology-bursts
    paths:
      - '.github/workflows/limitless-diagnostic.yml'

permissions:
  contents: write

jobs:
  land-verified-burst:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/limitless-cosmology-bursts
          fetch-depth: 1

      - name: Replay compiler-verified limitless burst
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('.github/workflows/limitless-proof-repair.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, '.github/workflows/limitless-proof-repair.yml:inline-python', 'exec'))
          PY

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(axiom|sorry|admit)\b' \
            GSTTransferBridgeV2.lean \
            GSTGeometricRealizationStage2E.lean \
            GSTGeometricRealizationStage2F.lean \
            GSTGeometricRealizationStage2G.lean

      - name: Commit verified source burst
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            GSTTransferBridgeV2.lean \
            GSTGeometricRealizationStage2E.lean \
            GSTGeometricRealizationStage2F.lean \
            GSTGeometricRealizationStage2G.lean \
            HCProof.lean
          git diff --cached --quiet && exit 0
          git commit -m "Remove finite-rank ceilings from transfer and Stage 2"
          git push origin HEAD:sol/limitless-cosmology-bursts
