name: GST Geometric Commutator Rank Gain
# Reverify all native geometric imports against the registered Lake project roots.

on:
  push:
    branches:
      - research/gpt6-gst-native-rank-one-realization-20261014
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - 'GSTClassicalHodgeActualCommutatorRankGain.lean'
      - 'GSTMathboxIndependentGeometricCoordinate.lean'
      - '.github/workflows/gst-geometric-commutator-rank-gain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-commutator-rank-gain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rank-gain:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-rank-gain
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            hc-lean-incremental-${{ runner.os }}-
      - name: Verify native commutator independence theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake build GSTClassicalHodgeActualCommutatorRankGain GSTMathboxIndependentGeometricCoordinate > commutator-rank-lean.log 2>&1; then
            echo 'LEAN PASSED: actual geometric commutator rank gain'
          else
            echo 'LEAN FAILED: actual geometric commutator rank gain'
            grep -nE 'error:|sorryAx|✖' commutator-rank-lean.log | tail -n 120 || true
            tail -n 50 commutator-rank-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" commutator-rank-lean.log; then
            echo 'Trust audit failed'
            exit 1
          fi
      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-rank-gain
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-geometric-commutator-rank-lean-log
          path: commutator-rank-lean.log
          if-no-files-found: warn
