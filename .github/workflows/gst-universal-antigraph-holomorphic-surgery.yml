name: Mathbox GST Universal Primitive Antigraph Surgery
on:
  push:
    branches: [mathbox/residual-zero-direct-audit-20261015]
    paths:
      - GSTUniversalAntigraphDiagonalSurgery.lean
      - .github/workflows/gst-universal-antigraph-holomorphic-surgery.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-universal-anti-holomorphic-surgery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel check all-n primitive integer positive cycle surgery
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTUniversalAntigraphSurgery"
          roots = ["GSTUniversalSelfProductPrimitive",
                   "GSTUniversalAntigraphDiagonalSurgery"]
          EOF
          if lake build GSTUniversalAntigraphSurgery > gst-antigraph-surgery.log 2>&1; then
            echo "LEAN PASSED: exact integral anti-graph diagonal relation for all n on P^n x P^n"
          else
            grep -nE 'error:|sorryAx|✖' gst-antigraph-surgery.log | tail -n 120 || true
            tail -n 130 gst-antigraph-surgery.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-antigraph-surgery.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-antigraph-holomorphic-surgery-log
          path: gst-antigraph-surgery.log
          if-no-files-found: warn
