name: GST All-Codimension Finite-Degree Geometric Descent
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - GSTFiniteDominantAllCodimensionDescent.lean
      - scripts/gst_lean_dependency_roots.py
      - .github/workflows/gst-finite-dominant-all-codim.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-finite-degree-all-codim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-finite-all-codim
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Prove all-codimension geometric transfer
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTFiniteDominantAllCodimGate GSTFiniteDominantAllCodimensionDescent
          if lake build GSTFiniteDominantAllCodimGate > finite-degree-lean.log 2>&1; then
            echo "LEAN PASSED: finite-degree native geometric descent and all-codim Hodge transfer"
          else
            grep -nE 'error:|sorryAx|✖' finite-degree-lean.log | tail -n 100 || true
            tail -n 80 finite-degree-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" finite-degree-lean.log; then
            exit 1
          fi
      - name: Cache compiled GST modules
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-finite-all-codim
      - name: Save proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-finite-all-codim-lean
          path: finite-degree-lean.log
          if-no-files-found: warn
