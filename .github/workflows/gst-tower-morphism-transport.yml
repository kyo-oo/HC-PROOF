name: GST Tower Morphism Transport
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTTowerMorphismTransport.lean'
      - 'GSTCarrierAlgebraFlatComplex.lean'
      - 'GSTInfiniteTowerCurvatureCascade.lean'
      - 'GSTFoldTowerSquare.lean'
      - 'GSTFoldFourthOrderMemoryTower.lean'
      - 'GSTFoldChainThirdOrderMemory.lean'
      - 'GSTFoldMemoryTower.lean'
      - 'GSTAllDegreeCurvatureMemory.lean'
      - '.github/workflows/gst-tower-morphism-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-tower-morphism-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        id: lean-install
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-verify the tower morphisms and the transport laws
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTTowerMorphismTransportLib GSTTowerMorphismTransport
          if lake build GSTTowerMorphismTransport > tower-morphism-transport.log 2>&1; then
            echo "PASS GSTTowerMorphismTransport"
          else
            grep -nE 'error:' tower-morphism-transport.log | tail -n 120 || true
            tail -n 80 tower-morphism-transport.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" tower-morphism-transport.log; then
            exit 1
          fi
          echo "LEAN GREEN: the Round 59 tower morphisms and transport laws kernel-verified, zero sorry"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-tower-morphism-transport-log
          path: tower-morphism-transport.log
          if-no-files-found: warn
