name: GST Finite Line Primitive X Source

on:
  push:
    branches:
      - main
      - research/gpt6-gst-hypothesis-part1-chow-square-20261110
    paths:
      - 'GSTFiniteLinePrimitiveXSource.lean'
      - 'GSTFiniteLinePointsGateDischarge.lean'
      - 'GSTFiniteLinePointsGateCore.lean'
      - 'GSTFiniteLineUnconditionalSource.lean'
      - 'GSTFiniteLineHonestHodgeData.lean'
      - 'GSTFiniteLineGeneralMLaw.lean'
      - 'GSTFiniteLinePointAlgebra.lean'
      - 'GSTFiniteLineAnalytification.lean'
      - 'GSTFiniteLineCycleCorrespondence.lean'
      - 'GSTFiniteLineWorldDischarge.lean'
      - 'GSTFiniteLineCycleCorrespondenceBasic.lean'
      - 'GSTFiniteLineCycleCorrespondenceAction.lean'
      - 'GSTFiniteLineCycleCorrespondenceOperators.lean'
      - 'GSTFiniteLinePointsGateCoreBasic.lean'
      - 'GSTFiniteLinePointsGateCoreTransport.lean'
      - 'GSTFiniteLinePointsGateDischargeBridges.lean'
      - 'GSTFiniteLinePointsGateDischargeInverseA.lean'
      - 'GSTFiniteLinePointsGateDischargeInverseB.lean'
      - 'GSTFiniteLinePrimitiveXSourceFamilies.lean'
      - '.github/workflows/gst-finite-line-primitive-x-source.yml'
      - 'lakefile.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-finite-line-primitive-x-source
  cancel-in-progress: false

jobs:
  verify:
    name: "Kernel check the universal primitive-X source package (the source-basis: independence, span, compiler, the forall-M master)"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-finite-line-closed-immersion
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            ELAN_TAG="v4.2.4"
            ELAN_ASSET="elan-x86_64-unknown-linux-gnu.tar.gz"
            ELAN_TMP="$(mktemp -d)"
            ELAN_SRC=""
            for url in \
              "https://github.com/leanprover/elan/releases/download/${ELAN_TAG}/${ELAN_ASSET}" \
              "https://github.com/leanprover/elan/releases/latest/download/${ELAN_ASSET}"; do
              for attempt in 1 2 3; do
                echo "elan fetch: attempt ${attempt}/3 via ${url}"
                if curl -sSfL --connect-timeout 30 -o "${ELAN_TMP}/${ELAN_ASSET}" "$url"; then
                  ELAN_SRC="$url"
                  break 2
                fi
                echo "elan fetch failed via ${url}; sleeping 10s before retry" >&2
                sleep 10
              done
            done
            if [ -z "$ELAN_SRC" ]; then
              echo "FATAL: elan installer download failed on every mirror and attempt" >&2
              exit 1
            fi
            echo "elan installer fetched from ${ELAN_SRC}"
            tar -xzf "${ELAN_TMP}/${ELAN_ASSET}" -C "${ELAN_TMP}"
            chmod u+x "${ELAN_TMP}/elan-init"
            "${ELAN_TMP}/elan-init" -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-general-M-law
          restore-keys: |
            hc-lean-incremental-Linux-finite-line-
      - name: Compile the universal primitive-X source package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 1260 lake build GSTFiniteLinePrimitiveXSource 2>&1 | tee gst-finite-line-primitive-x-source.log; then
            echo "LEAN PASSED: Kernel check the universal primitive-X source package (the source-basis: independence, span, compiler, the forall-M master)"
          else
            pkill -KILL -x lean 2>/dev/null || true
            sleep 1
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-finite-line-primitive-x-source.log | tail -n 100 || true
            tail -n 75 gst-finite-line-primitive-x-source.log || true
            if grep -qE 'error:|sorryAx|unknown constant|unknown identifier' gst-finite-line-primitive-x-source.log; then
              exit 1
            fi
            echo "BUILD TIMEOUT (the cache-bank cycle: partial progress saved below; re-dispatch to continue)"
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-finite-line-primitive-x-source.log; then
            echo "Unexpected axiom or sorry found" && exit 1
          fi
      - name: Save reusable compiled GST dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-primitive-x-source-${{ github.run_id }}
      - name: Upload exact Lean compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-finite-line-primitive-x-source-lean
          path: gst-finite-line-primitive-x-source.log
          if-no-files-found: warn
