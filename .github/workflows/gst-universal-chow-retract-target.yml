name: GST Actual Universal Target Chow Retract
on:
  push:
    branches:
      - research/mathbox-k3-diagonal-primitive-20261015
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - GSTUniversalChowRetractToTarget.lean
      - .github/workflows/gst-universal-chow-retract-target.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-universal-chow-target-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel verify all-X geometric Chow correspondence descent
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTAllTargetChowRetract"
          roots = ["GSTUniversalChowRetractToTarget"]
          EOF
          if lake build GSTAllTargetChowRetract > gst-chow-target.log 2>&1; then
            echo 'LEAN PASSED: true target X Chow correspondence descent'
          else
            grep -nE 'error:|sorryAx|✖' gst-chow-target.log | tail -n 130 || true
            tail -n 125 gst-chow-target.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-chow-target.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-universal-target-chow-retract-log
          path: gst-chow-target.log
          if-no-files-found: warn
