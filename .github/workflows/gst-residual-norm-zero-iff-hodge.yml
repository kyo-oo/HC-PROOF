name: Mathbox Exact Residual Zero Hodge Equivalence
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - GSTResidualNormZeroExactHodgeEquivalence.lean
      - .github/workflows/gst-residual-norm-zero-iff-hodge.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-residual-hodge-equivalence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel verify exact requested residual-zero iff primitive Hodge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTResidualNormExact"
          roots = [
            "GSTUniversalHodgeResidualProjection",
            "GSTPolarizedHodgeResidualEnergy",
            "GSTPrimitiveAlgebraicMotiveProjector",
            "GSTResidualZeroLogicalCountermodel",
            "GSTResidualNormZeroExactHodgeEquivalence"
          ]
          EOF
          if lake build GSTResidualNormExact > gst-zero-norm-exact.log 2>&1; then
            echo "LEAN PASSED: exact all-zero norm iff primitive rational Hodge, without asserting goal"
          else
            grep -nE 'error:|sorryAx|✖' gst-zero-norm-exact.log | tail -n 140 || true
            tail -n 140 gst-zero-norm-exact.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-zero-norm-exact.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-zero-norm-iff-hodge-lean-log
          path: gst-zero-norm-exact.log
          if-no-files-found: warn
