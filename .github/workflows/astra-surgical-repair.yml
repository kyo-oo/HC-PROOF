name: Astra One Shot Source Repair

on:
  push:
    branches: [gst-cosmology-strengthening]
    paths:
      - '.github/workflows/astra-surgical-repair.yml'

jobs:
  repair:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gst-cosmology-strengthening
          fetch-depth: 0

      - name: Patch original Lean sources
        run: python3 scripts/astra_surgical_repair.py

      - name: Commit direct repairs and remove temporary surgery files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/astra-surgical-repair.yml
          rm scripts/astra_surgical_repair.py
          git config user.name kyo-oo
          git config user.email kyo-oo@users.noreply.github.com
          git add -A
          git commit -m 'Repair mixed-ledger concatenation and Omega observer interval'
          git push origin HEAD:gst-cosmology-strengthening
