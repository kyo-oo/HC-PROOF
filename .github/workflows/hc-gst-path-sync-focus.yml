name: HC GST Path Synchronization Focus

on:
  push:
    branches:
      - clean/upgraded-advanced-only-20261009
    paths:
      - 'GSTClassicalHodgeGeneralSpaceSynchronization.lean'
      - '.github/workflows/hc-gst-path-sync-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hc-gst-path-sync-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-path-synchronization:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile genuine General Space synchronization module
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClassicalHodgeGeneralSpaceSynchronization 2>&1 | tee gst-path-sync.log
      - name: Upload native synchronization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-path-sync-focused-diagnostics
          path: gst-path-sync.log
          if-no-files-found: warn
