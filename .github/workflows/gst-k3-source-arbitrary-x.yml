name: GST K3 Native Source to Arbitrary X
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTK3GeometricSourceToArbitraryX.lean
      - .github/workflows/gst-k3-source-arbitrary-x.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-k3-target-x-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel verify K3 algebraic source descent to true target X
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTK3SourceTargetX"
          roots = [
            "GSTK3DiagonalPrimitive",
            "GSTK3DiagonalActualStage2G",
            "GSTK3TranscendentalHodgeCompleteness",
            "GSTUniversalChowRetractToTarget",
            "GSTK3GeometricSourceToArbitraryX"
          ]
          EOF
          if lake build GSTK3SourceTargetX > gst-k3-to-x.log 2>&1; then
            echo "LEAN PASSED: actual K3 algebraic-cycle source yields target X rational Hodge cycles through geometric retract"
          else
            grep -nE 'error:|sorryAx|✖' gst-k3-to-x.log | tail -n 160 || true
            tail -n 145 gst-k3-to-x.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-k3-to-x.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-k3-source-to-target-x-log
          path: gst-k3-to-x.log
          if-no-files-found: warn
