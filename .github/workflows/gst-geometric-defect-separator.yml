name: GST Geometric Defect Separator Proof

on:
  push:
    branches:
      - research/gpt6-gst-native-rank-one-realization-20261014
    paths:
      - 'GSTClassicalHodgeGeometricDefectSeparator.lean'
      - 'GSTClassicalHodgeExactGeometricRankDefect.lean'
      - 'lakefile.toml'
      - '.github/workflows/gst-geometric-defect-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-geometric-defect-separator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-defect-separation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-defect-separator
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel compile exact rational geometric defect separators
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake build GSTClassicalHodgeGeometricDefectSeparator > defect-separator-lean.log 2>&1; then
            echo 'LEAN PASSED: geometric missing-direction separation'
          else
            echo 'LEAN FAILED: geometric missing-direction separation'
            grep -nE 'error:|sorryAx|✖' defect-separator-lean.log | tail -n 120 || true
            tail -n 50 defect-separator-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" defect-separator-lean.log; then
            echo 'Lean trust audit failure'
            exit 1
          fi
      - name: Save GST dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-defect-separator
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-geometric-defect-separator-lean-log
          path: defect-separator-lean.log
          if-no-files-found: warn
