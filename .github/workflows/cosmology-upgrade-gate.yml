name: HC Cosmology Upgrade Gate

on:
  push:
    branches:
      - main
      - gst-cosmology-strengthening
    paths:
      - '**/*.lean'
      - 'lakefile.toml'
      - '.github/workflows/cosmology-upgrade-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hc-cosmology-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cosmology-upgrade:
    name: Cosmology upgrade (0 errors, 0 proof escapes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/cache/restore@v4
        id: lean-cache
        with:
          path: |
            ~/.elan
            .lake
          key: hc-cosmology-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            hc-cosmology-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            CardinalWorlds.lean
            CardinalWorldsPrefixClassifier.lean
            CardinalWorldsV2.lean
            GST2DMixedEmergenceUpgrade.lean
            GSTAnalyticAbsorption.lean
            GSTAnalyticAbsorptionV2.lean
            GSTCanonicalCarryDynamics.lean
            GSTCanonicalSevenAxisBridge.lean
            GSTCanonicalTailLTE.lean
            GSTCanonicalTailStateIso.lean
            GSTClayOfficial.lean
            GSTClayOfficialV2.lean
            GSTDimensionFreeHodgeDiagonal.lean
            GSTExactWorldOperatorPresentation.lean
            GSTFinalPrefixOneStep6Infinite.lean
            GSTFinalPurePowerResidueTransplant.lean
            GSTFourPowerAffineBadState.lean
            GSTFourPowerAffineChannelAutomaton.lean
            GSTFourPowerAffineClassifierBridge.lean
            GSTFourPowerAffineExponentPeel.lean
            GSTFourPowerAffineOrbit.lean
            GSTFourPowerAffinePeelClassifier.lean
            GSTFourPowerAffineTwoTritClassifier.lean
            GSTFourPowerDirectAdditionCarry.lean
            GSTFourPowerDirectChat2Application.lean
            GSTFourPowerDirectCreationMaster.lean
            GSTFourPowerDirectExistence.lean
            GSTFourPowerDirectExistenceFromHappy.lean
            GSTFourPowerDirectExistenceNoAxiom.lean
            GSTFourPowerDirectExistenceProviderPipeline.lean
            GSTFourPowerDirectFailedRelocationState.lean
            GSTFourPowerDirectHappyBridge.lean
            GSTFourPowerDirectNo22.lean
            GSTFourPowerDirectResidue.lean
            GSTFourPowerDirectResidue27.lean
            GSTFourPowerDirectResidue81.lean
            GSTFourPowerExactExponentPeriod.lean
            GSTFourPowerExponentTritObstruction.lean
            GSTFourPowerHappyProvider.lean
            GSTFourPowerNo22Magnitude.lean
            GSTFourPowerOntologicalAdapter.lean
            GSTFourPowerThirdWave.lean
            GSTGhostRayExclusion.lean
            GSTGeometricRealizationStage2G.lean
            GSTGlobalPureHodgeCosmology.lean
            GSTGradedWorldAlgebra.lean
            GSTGraphV2CanonicalDescentOntology.lean
            GSTGraphV2CanonicalEscape.lean
            GSTGraphV2CanonicalInfiniteCycle.lean
            GSTGraphV2CanonicalNWave.lean
            GSTGraphV2CanonicalPhaseSteering.lean
            GSTGraphV2CanonicalPhaseWaveProbe.lean
            GSTGraphV2CanonicalRenormalization.lean
            GSTGraphV2CanonicalSheetTranslation.lean
            GSTGraphV2CanonicalSignedPrefixBridge.lean
            GSTGraphV2CanonicalTerminalExtinctionProbe.lean
            GSTGraphV2CanonicalTransparentBridgeProbe.lean
            GSTGraphV2CoupledUFlux.lean
            GSTGraphV2CoupledUPhysicalBridge.lean
            GSTGraphV2FourPowerResidueObstruction.lean
            GSTGraphV2HandwrittenExponentialCascade.lean
            GSTGraphV2HandwrittenExponentialLTE.lean
            GSTGraphV2HandwrittenOmegaUBlock.lean
            GSTGraphV2InfiniteControl.lean
            GSTGraphV2NonEuclidean.lean
            GSTGraphV2NonEuclideanLaws.lean
            GSTGraphV2NonlocalCascade.lean
            GSTGraphV2OmegaWaveLaw.lean
            GSTGraphV2PerfectPowerAncestry.lean
            GSTGraphV2PhysicalSignedKernelTelescopeScratch.lean
            GSTGraphV2Production.lean
            GSTGraphV2ProductionLaws.lean
            GSTGraphV2ScaleEquivariance.lean
            GSTGraphV2SeededPrefix.lean
            GSTGraphV2SixAdicOntologicalGeometryLaws.lean
            GSTGraphV2SixAdicUnitIsometry.lean
            GSTGraphV2TransparentWidthThree.lean
            GSTHodgeAssault.lean
            GSTHodgeAssaultV2.lean
            GSTInfiniteBadTransport.lean
            GSTInfiniteCollision.lean
            GSTInfiniteCoupledLedger.lean
            GSTInfiniteFourPowerNavigation.lean
            GSTInfiniteGateTransport.lean
            GSTInfiniteWorldClassification.lean
            GSTInfiniteWorldRenormalization.lean
            GSTLefschetzCrown.lean
            GSTLefschetzCrownV2.lean
            GSTMultiAxisCohomology.lean
            GSTMultiAxisCosmology.lean
            GSTMultiAxisGradedDynamics.lean
            GSTPerfectPowerTailNavigation.lean
            GSTPrefixOneOntologicalEscape.lean
            GSTPrefixOneSeedCore.lean
            GSTRadixWorldDynamics.lean
            GSTSeedOneShift.lean
            GSTTactic.lean
            GSTTailFFourthDimension.lean
            GSTTailFInfiniteRead.lean
            GSTTailFOneLane.lean
            GSTTailFProof.lean
            GSTTheAct.lean
            GSTTheActConstruction.lean
            GSTTransferBridge.lean
            GSTTransferBridgeV2.lean
            GSTTruncatedWorldCohomologyRing.lean
            GSTUniversalAddressBridge.lean
            GSTUniversalLefschetzCosmology.lean
            GSTUniversalLefschetzDynamics.lean
            GSTUniversalLefschetzPathFormula.lean
            GSTV2InfiniteCore.lean
            GSTWorldCosmology.lean
            GSTWorldCrownBridge.lean
            GSTWorldPoincareDuality.lean
            GSTWorldRecoordinationGroupoid.lean
            GSTWorldtraceArithmetic.lean
            GSTWorldtraceMahlerRelativePrecision.lean
            HodgeDeRhamBridge.lean
            HodgeDeRhamBridgeV2.lean
            InformationBadTraceScratch.lean
            InformationDescentScratch.lean
            InformationGeometryScratch.lean
            InformationRegenerationScratch.lean
            InformationStateScratch.lean
            OriginTransducerScratch.lean
            waves/CardinalWorldsPostulateLaw.lean
            waves/CardinalWorldsPostulateLawV2.lean
            waves/GSTNCohomology.lean
            waves/GSTNCohomologyV2.lean
            waves/GSTVortexSingularity.lean
            waves/GSTVortexSingularityV2.lean
            waves/GSTWaveCohomology.lean
            waves/GSTWaveCohomologyV2.lean
          )
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "${files[@]}"; then
            echo HC_UPGRADE_FORBIDDEN_PROOF_ESCAPE=1
            exit 1
          fi
          echo HC_UPGRADE_PROOF_ESCAPE_CHECK=PASS

      - name: Compile upgraded cosmology
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            CardinalWorlds \
            CardinalWorldsPrefixClassifier \
            CardinalWorldsV2 \
            GSTAnalyticAbsorption \
            GSTAnalyticAbsorptionV2 \
            GSTCanonicalCarryDynamics \
            GSTCanonicalSevenAxisBridge \
            GSTCanonicalTailLTE \
            GSTCanonicalTailStateIso \
            GSTClayOfficial \
            GSTClayOfficialV2 \
            GSTDimensionFreeHodgeDiagonal \
            GSTExactWorldOperatorPresentation \
            GSTFinalPrefixOneStep6Infinite \
            GSTFinalPurePowerResidueTransplant \
            GSTFourPowerAffineBadState \
            GSTFourPowerAffineChannelAutomaton \
            GSTFourPowerAffineClassifierBridge \
            GSTFourPowerAffineExponentPeel \
            GSTFourPowerAffineOrbit \
            GSTFourPowerAffinePeelClassifier \
            GSTFourPowerAffineTwoTritClassifier \
            GSTFourPowerDirectAdditionCarry \
            GSTFourPowerDirectChat2Application \
            GSTFourPowerDirectCreationMaster \
            GSTFourPowerDirectExistence \
            GSTFourPowerDirectExistenceFromHappy \
            GSTFourPowerDirectExistenceNoAxiom \
            GSTFourPowerDirectExistenceProviderPipeline \
            GSTFourPowerDirectFailedRelocationState \
            GSTFourPowerDirectHappyBridge \
            GSTFourPowerDirectNo22 \
            GSTFourPowerDirectResidue \
            GSTFourPowerDirectResidue27 \
            GSTFourPowerDirectResidue81 \
            GSTFourPowerExactExponentPeriod \
            GSTFourPowerExponentTritObstruction \
            GSTFourPowerHappyProvider \
            GSTFourPowerNo22Magnitude \
            GSTFourPowerOntologicalAdapter \
            GSTFourPowerThirdWave \
            GSTGhostRayExclusion \
            GSTGeometricRealizationStage2G \
            GSTGlobalPureHodgeCosmology \
            GSTGradedWorldAlgebra \
            GSTGraphV2CanonicalDescentOntology \
            GSTGraphV2CanonicalEscape \
            GSTGraphV2CanonicalInfiniteCycle \
            GSTGraphV2CanonicalNWave \
            GSTGraphV2CanonicalPhaseSteering \
            GSTGraphV2CanonicalPhaseWaveProbe \
            GSTGraphV2CanonicalRenormalization \
            GSTGraphV2CanonicalSheetTranslation \
            GSTGraphV2CanonicalSignedPrefixBridge \
            GSTGraphV2CanonicalTerminalExtinctionProbe \
            GSTGraphV2CanonicalTransparentBridgeProbe \
            GSTGraphV2CoupledUFlux \
            GSTGraphV2CoupledUPhysicalBridge \
            GSTGraphV2FourPowerResidueObstruction \
            GSTGraphV2HandwrittenExponentialCascade \
            GSTGraphV2HandwrittenExponentialLTE \
            GSTGraphV2HandwrittenOmegaUBlock \
            GSTGraphV2InfiniteControl \
            GSTGraphV2NonEuclidean \
            GSTGraphV2NonEuclideanLaws \
            GSTGraphV2NonlocalCascade \
            GSTGraphV2OmegaWaveLaw \
            GSTGraphV2PerfectPowerAncestry \
            GSTGraphV2PhysicalSignedKernelTelescopeScratch \
            GSTGraphV2Production \
            GSTGraphV2ProductionLaws \
            GSTGraphV2ScaleEquivariance \
            GSTGraphV2SeededPrefix \
            GSTGraphV2SixAdicOntologicalGeometryLaws \
            GSTGraphV2SixAdicUnitIsometry \
            GSTGraphV2TransparentWidthThree \
            GSTHodgeAssault \
            GSTHodgeAssaultV2 \
            GSTInfiniteBadTransport \
            GSTInfiniteCollision \
            GSTInfiniteCoupledLedger \
            GSTInfiniteFourPowerNavigation \
            GSTInfiniteGateTransport \
            GSTInfiniteWorldClassification \
            GSTInfiniteWorldRenormalization \
            GSTLefschetzCrown \
            GSTLefschetzCrownV2 \
            GSTMultiAxisCohomology \
            GSTMultiAxisCosmology \
            GSTMultiAxisGradedDynamics \
            GSTPerfectPowerTailNavigation \
            GSTPrefixOneOntologicalEscape \
            GSTPrefixOneSeedCore \
            GSTRadixWorldDynamics \
            GSTSeedOneShift \
            GSTTactic \
            GSTTailFFourthDimension \
            GSTTailFInfiniteRead \
            GSTTailFOneLane \
            GSTTailFProof \
            GSTTheAct \
            GSTTheActConstruction \
            GSTTransferBridge \
            GSTTransferBridgeV2 \
            GSTTruncatedWorldCohomologyRing \
            GSTUniversalAddressBridge \
            GSTUniversalLefschetzCosmology \
            GSTUniversalLefschetzDynamics \
            GSTUniversalLefschetzPathFormula \
            GSTV2InfiniteCore \
            GSTWorldCrownBridge \
            GSTWorldPoincareDuality \
            GSTWorldRecoordinationGroupoid \
            GSTWorldtraceArithmetic \
            GSTWorldtraceMahlerRelativePrecision \
            HodgeDeRhamBridge \
            HodgeDeRhamBridgeV2 \
            InformationBadTraceScratch \
            InformationDescentScratch \
            InformationGeometryScratch \
            InformationRegenerationScratch \
            InformationStateScratch \
            OriginTransducerScratch \
            waves.CardinalWorldsPostulateLaw \
            waves.CardinalWorldsPostulateLawV2 \
            waves.GSTNCohomology \
            waves.GSTNCohomologyV2 \
            waves.GSTVortexSingularity \
            waves.GSTVortexSingularityV2 \
            waves.GSTWaveCohomology \
            waves.GSTWaveCohomologyV2 2>&1 | tee cosmology-upgrade.log
          echo HC_UPGRADE_BUILD_GREEN=1

      - name: Verify no sorryAx in upgraded crowns
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sorryAx' cosmology-upgrade.log; then
            echo HC_UPGRADE_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo HC_UPGRADE_AXIOM_AUDIT=PASS

      - name: Audit every public strengthening declaration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTCosmologyStrengtheningAudit.lean 2>&1 | tee cosmology-strengthening-axioms.log
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          text = Path('cosmology-strengthening-axioms.log').read_text()
          receipts = re.findall(r"depends on axioms:\s*\[([^]]*)\]", text)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          assert receipts, 'No axiom receipts were produced'
          for receipt in receipts:
              names = {x.strip() for x in receipt.split(',') if x.strip()}
              assert names <= allowed, f'Unexpected axioms: {names - allowed}'
          assert 'sorryAx' not in text
          print(f'HC_STRENGTHENING_PUBLIC_AXIOM_AUDIT=PASS ({len(receipts)} nonempty receipts)')
          PYCODE

      - name: Compile full HCProof integration
        shell: bash
        run: |
          set -euo pipefail
          lake build HCProof 2>&1 | tee cosmology-hcproof-integration.log
          echo HC_STRENGTHENING_HCPROOF_INTEGRATION=PASS

      - name: Upload upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-cosmology-upgrade-diagnostics
          path: |
            cosmology-upgrade.log
            cosmology-strengthening-axioms.log
            cosmology-hcproof-integration.log
          if-no-files-found: ignore

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
