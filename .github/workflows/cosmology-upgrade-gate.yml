name: HC Cosmology Upgrade Gate

on:
  push:
    branches:
      - main
      - gst-cosmology-strengthening
    paths:
      - 'GSTRadixWorldDynamics.lean'
      - 'GSTGradedWorldAlgebra.lean'
      - 'GSTWorldRecoordinationGroupoid.lean'
      - 'GSTUniversalLefschetzDynamics.lean'
      - 'GSTUniversalLefschetzCosmology.lean'
      - 'GSTTruncatedWorldCohomologyRing.lean'
      - 'GSTWorldPoincareDuality.lean'
      - 'CardinalWorldsPrefixClassifier.lean'
      - 'GSTWorldCosmology.lean'
      - 'GSTWorldCrownBridge.lean'
      - 'GST2DMixedEmergenceUpgrade.lean'
      - 'GSTGraphV2ScaleEquivariance.lean'
      - 'GSTCoherentCosmology.lean'
      - 'GSTInfiniteWorldClassification.lean'
      - 'GSTInfiniteWorldRenormalization.lean'
      - 'GSTMultiAxisCohomology.lean'
      - 'GSTExactWorldOperatorPresentation.lean'
      - 'GSTMultiAxisCosmology.lean'
      - 'GSTMultiAxisGradedDynamics.lean'
      - 'CardinalWorldsV2.lean'
      - 'waves/CardinalWorldsPostulateLawV2.lean'
      - 'waves/GSTWaveCohomologyV2.lean'
      - 'waves/GSTNCohomologyV2.lean'
      - 'waves/GSTVortexSingularityV2.lean'
      - 'HodgeDeRhamBridgeV2.lean'
      - 'GSTAnalyticAbsorptionV2.lean'
      - 'GSTLefschetzCrownV2.lean'
      - 'GSTHodgeAssaultV2.lean'
      - 'GSTClayOfficialV2.lean'
      - 'GSTTransferBridgeV2.lean'
      - '.github/workflows/cosmology-upgrade-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hc-cosmology-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cosmology-upgrade:
    name: Cosmology upgrade (0 errors, 0 proof escapes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/cache/restore@v4
        id: lean-cache
        with:
          path: |
            ~/.elan
            .lake
          key: hc-cosmology-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            hc-cosmology-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            GSTRadixWorldDynamics.lean
            GSTGradedWorldAlgebra.lean
            GSTWorldRecoordinationGroupoid.lean
            GSTUniversalLefschetzDynamics.lean
            GSTUniversalLefschetzCosmology.lean
            GSTTruncatedWorldCohomologyRing.lean
            GSTWorldPoincareDuality.lean
            CardinalWorldsPrefixClassifier.lean
            GSTWorldCosmology.lean
            GSTWorldCrownBridge.lean
            GST2DMixedEmergenceUpgrade.lean
            GSTGraphV2ScaleEquivariance.lean
            GSTInfiniteWorldClassification.lean
            GSTInfiniteWorldRenormalization.lean
            GSTMultiAxisCohomology.lean
            GSTExactWorldOperatorPresentation.lean
            GSTMultiAxisCosmology.lean
            GSTMultiAxisGradedDynamics.lean
            CardinalWorldsV2.lean
            waves/CardinalWorldsPostulateLawV2.lean
            waves/GSTWaveCohomologyV2.lean
            waves/GSTNCohomologyV2.lean
            waves/GSTVortexSingularityV2.lean
            HodgeDeRhamBridgeV2.lean
            GSTAnalyticAbsorptionV2.lean
            GSTLefschetzCrownV2.lean
            GSTHodgeAssaultV2.lean
            GSTClayOfficialV2.lean
            GSTTransferBridgeV2.lean
          )
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "${files[@]}"; then
            echo HC_UPGRADE_FORBIDDEN_PROOF_ESCAPE=1
            exit 1
          fi
          echo HC_UPGRADE_PROOF_ESCAPE_CHECK=PASS

      - name: Compile upgraded cosmology
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            GSTRadixWorldDynamics \
            GSTGradedWorldAlgebra \
            GSTWorldRecoordinationGroupoid \
            GSTUniversalLefschetzDynamics \
            GSTUniversalLefschetzCosmology \
            GSTTruncatedWorldCohomologyRing \
            GSTWorldPoincareDuality \
            CardinalWorldsPrefixClassifier \
            GSTWorldCrownBridge \
            GSTGraphV2ScaleEquivariance \
            GSTInfiniteWorldClassification \
            GSTInfiniteWorldRenormalization \
            GSTMultiAxisCohomology \
            GSTExactWorldOperatorPresentation \
            GSTMultiAxisCosmology \
            GSTMultiAxisGradedDynamics \
            CardinalWorldsV2 \
            waves.CardinalWorldsPostulateLawV2 \
            waves.GSTWaveCohomologyV2 \
            waves.GSTNCohomologyV2 \
            waves.GSTVortexSingularityV2 \
            HodgeDeRhamBridgeV2 \
            GSTAnalyticAbsorptionV2 \
            GSTLefschetzCrownV2 \
            GSTHodgeAssaultV2 \
            GSTClayOfficialV2 \
            GSTTransferBridgeV2 2>&1 | tee cosmology-upgrade.log
          echo HC_UPGRADE_BUILD_GREEN=1

      - name: Verify no sorryAx in upgraded crowns
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sorryAx' cosmology-upgrade.log; then
            echo HC_UPGRADE_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo HC_UPGRADE_AXIOM_AUDIT=PASS

      - name: Audit every public strengthening declaration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTCosmologyStrengtheningAudit.lean 2>&1 | tee cosmology-strengthening-axioms.log
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          text = Path('cosmology-strengthening-axioms.log').read_text()
          receipts = re.findall(r"depends on axioms:\s*\[([^]]*)\]", text)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          assert receipts, 'No axiom receipts were produced'
          for receipt in receipts:
              names = {x.strip() for x in receipt.split(',') if x.strip()}
              assert names <= allowed, f'Unexpected axioms: {names - allowed}'
          assert 'sorryAx' not in text
          print(f'HC_STRENGTHENING_PUBLIC_AXIOM_AUDIT=PASS ({len(receipts)} nonempty receipts)')
          PYCODE

      - name: Upload upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-cosmology-upgrade-diagnostics
          path: |
            cosmology-upgrade.log
            cosmology-strengthening-axioms.log
          if-no-files-found: ignore

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
