name: GST Divisor Word Native Algebraic Realization
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTDivisorWordRealization.lean'
      - '.github/workflows/gst-divisor-word-realization.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-divisor-word-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled Mathlib cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-divisor-word
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify native divisor-word cycle-class formula
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTDivisorWord"
          roots = ["GSTDivisorWordRealization"]
          EOF
          if lake build GSTDivisorWord > divisor-word-lean.log 2>&1; then
            echo "LEAN PASSED: divisor-generated rational Hodge cohomology admits explicit actual native cycles"
          else
            grep -nE 'error:|sorryAx|✖' divisor-word-lean.log | tail -n 130 || true
            tail -n 95 divisor-word-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" divisor-word-lean.log; then
            exit 1
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-divisor-word-native-realization-lean-log
          path: divisor-word-lean.log
          if-no-files-found: warn
