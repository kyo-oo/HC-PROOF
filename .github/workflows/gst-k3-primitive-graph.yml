name: GST K3 Primitive Graph Geometry
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - GSTK3GraphPrimitiveRank.lean
      - scripts/gst_lean_dependency_roots.py
      - .github/workflows/gst-k3-primitive-graph.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-k3-primitive-graph-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-k3-graph
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Verify quartic K3 primitive graph cycle independence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTK3GraphPrimitiveGate GSTK3GraphPrimitiveRank
          if lake build GSTK3GraphPrimitiveGate > k3-graph-lean.log 2>&1; then
            echo "LEAN PASSED: quartic-K3 rational rotation and primitive native graph independence"
          else
            grep -nE 'error:|sorryAx|✖' k3-graph-lean.log | tail -n 120 || true
            tail -n 100 k3-graph-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" k3-graph-lean.log; then
            exit 1
          fi
      - name: Save reusable compiled GST dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-k3-graph
      - name: Upload Lean proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-k3-primitive-graph-lean
          path: k3-graph-lean.log
          if-no-files-found: warn
