name: GST Actual Stage2G Hodge Gram Rank Landing
on:
  push:
    branches: [research/gpt6-gst-blowup-transfer-20261015]
    paths:
      - GSTBlowupRankActualHodgeLanding.lean
      - .github/workflows/gst-blowup-actual-hodge-rank.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-blowup-hodge-rank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-hodge-rank
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Compile exact Stage-2G rank-to-native-cycle theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTBlowupHodgeRank"
          roots = ["GSTBlowupHodgeTransfer", "GSTBlowupSchemeNativeBridge", "GSTBlowupThreeCycleIntersectionRank", "GSTBlowupRankActualHodgeLanding"]
          EOF
          if lake build GSTBlowupHodgeRank > gst-actual-hodge-rank.log 2>&1; then
            echo "LEAN PASSED: Stage-2G Hodge cycle by exact geometric rank"
          else
            grep -nE 'error:|sorryAx|✖' gst-actual-hodge-rank.log | tail -n 150 || true
            tail -n 120 gst-actual-hodge-rank.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-actual-hodge-rank.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-actual-hodge-rank-lean-log
          path: gst-actual-hodge-rank.log
          if-no-files-found: warn
