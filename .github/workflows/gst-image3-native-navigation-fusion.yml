name: GST Image 3 native navigation / CM / N-cohomology / Hodge-star integration

on:
  push:
    branches:
      - research/gpt6-native-image3-navigation-cm-star-ncoho-20261111
    paths:
      - 'GSTPerfectPowerTailNavigation.lean'
      - 'GSTGraphV2CMWaveFusion.lean'
      - 'waves/GSTNCohomologyV3.lean'
      - 'GSTSquarePureHodgeDuality.lean'
      - 'GSTImageThreeNativeFCompiler.lean'
      - 'GSTImageThreeCardinalWorldBirth.lean'
      - '.github/workflows/gst-image3-native-navigation-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-image3-navigation
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Prepare pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Compile ALL original modified GST subsystems and the native integrated F
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTImageThreeNativeLib GSTImageThreeCardinalWorldBirth
          if timeout 6800 lake build GSTImageThreeCardinalWorldBirth > gst-image3-native.log 2>&1; then
            echo "LEAN PASSED: image3 source-integrated native GST F + arbitrary-arity original cosmos births"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-image3-native.log | tail -n 100 || true
            tail -n 120 gst-image3-native.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-image3-native.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Preserve Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-image3-native-navigation-lean
          path: gst-image3-native.log
          if-no-files-found: warn
