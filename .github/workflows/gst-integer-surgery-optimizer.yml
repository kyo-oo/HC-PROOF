name: Mathbox Exact Integer Geometric Surgery Optimizer
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - research/computations/gst_integer_boundary_surgery.py
      - .github/workflows/gst-integer-surgery-optimizer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic integer lattice checker
        run: python -m pip install sympy==1.14.0
      - name: Exhaustive integer homology and calibration certificates
        run: python research/computations/gst_integer_boundary_surgery.py
