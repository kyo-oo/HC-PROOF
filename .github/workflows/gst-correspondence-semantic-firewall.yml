name: GST Correspondence Semantic Firewall
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTClassicalHodgeCorrespondenceSemanticFirewall.lean'
      - '.github/workflows/gst-correspondence-semantic-firewall.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-correspondence-semantic-firewall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-semantic-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-semantic-firewall
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Compile exact semantic ambiguity theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          # Standalone root registration in this CI checkout avoids changing
          # the long-running public Hodge root verification mid-run.
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "MathboxSemanticFirewall"
          roots = ["GSTClassicalHodgeCorrespondenceSemanticFirewall"]
          EOF
          if lake build MathboxSemanticFirewall > semantic-firewall-lean.log 2>&1; then
            echo 'LEAN PASSED: realized-cohomology semantic ambiguity'
          else
            grep -nE 'error:|sorryAx|✖' semantic-firewall-lean.log | tail -n 120 || true
            tail -n 90 semantic-firewall-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" semantic-firewall-lean.log; then
            echo 'Trust audit failed'
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-correspondence-semantic-firewall-lean-log
          path: semantic-firewall-lean.log
          if-no-files-found: warn
