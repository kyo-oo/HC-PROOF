name: GST Graph V2 - CM Wave Fusion

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTGraphV2CMWaveFusion.lean'
      - 'GSTGraphV2WaveNShapeCompiler.lean'
      - '.github/workflows/gst-graph-v2-cm-wave-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-graph-v2-cm-wave-fusion
  cancel-in-progress: false

jobs:
  verify:
    name: Kernel-check wave I/II, phase pairing and CM curvature
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-cm-wave-fusion
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-gst-cm-wave-fusion
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Kernel compile GST wave CM fusion
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTCMWaveFusionLib GSTGraphV2CMWaveFusion
          if timeout 9900 lake build GSTGraphV2CMWaveFusion > gst-cm-wave-fusion.log 2>&1; then
            echo "LEAN PASSED: GSTGraphV2CMWaveFusion"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-cm-wave-fusion.log | tail -n 100 || true
            tail -n 75 gst-cm-wave-fusion.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-cm-wave-fusion.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Kernel compile all-N wave spectral-channel compiler
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTWaveNShapeCompilerLib GSTGraphV2WaveNShapeCompiler
          if timeout 9900 lake build GSTGraphV2WaveNShapeCompiler > gst-wave-n-shape.log 2>&1; then
            echo "LEAN PASSED: GSTGraphV2WaveNShapeCompiler"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-wave-n-shape.log | tail -n 100 || true
            tail -n 75 gst-wave-n-shape.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-wave-n-shape.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-graph-v2-cm-wave-fusion-lean
          path: |
            gst-cm-wave-fusion.log
            gst-wave-n-shape.log
          if-no-files-found: warn
