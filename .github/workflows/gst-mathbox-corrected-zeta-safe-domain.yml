name: GST Mathbox Corrected Zeta Safe Domain
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTMathboxCorrectedZetaSafeDomain.lean'
      - '.github/workflows/gst-mathbox-corrected-zeta-safe-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-zeta-safe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore incremental build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-zeta-safe
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Prove corrected zeta domain positivity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "MathboxZetaSafeDomain"
          roots = [
            "GSTMathboxCorrectedZetaGeometry",
            "GSTMathboxCorrectedZetaSafeDomain"
          ]
          EOF
          if lake build MathboxZetaSafeDomain > zeta-safe-lean.log 2>&1; then
            echo 'LEAN PASSED: non-singular corrected zeta domain x>y²>=1'
          else
            grep -nE 'error:|sorryAx|✖' zeta-safe-lean.log | tail -n 130 || true
            tail -n 95 zeta-safe-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" zeta-safe-lean.log; then
            echo 'Trust audit failure'
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-zeta-safe-lean-log
          path: zeta-safe-lean.log
          if-no-files-found: warn
