name: GST Exact Geometric Rank Defect

on:
  push:
    branches:
      - research/gpt6-gst-native-rank-one-realization-20261014
    paths:
      - 'GSTClassicalHodgeExactGeometricRankDefect.lean'
      - '.github/workflows/gst-exact-geometric-rank-defect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-exact-geometric-rank-defect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometric-defect:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-geometric-defect
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel prove actual geometric frame equivalence and defect formula
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "GSTExactGeometricDefectVerification"
          roots = ["GSTClassicalHodgeExactGeometricRankDefect"]
          EOF
          if lake build GSTExactGeometricDefectVerification > defect-lean.log 2>&1; then
            echo 'LEAN PASSED: exact geometric point rank and quotient defect'
          else
            echo 'LEAN FAILED: exact geometric point rank and quotient defect'
            grep -nE 'error:|sorryAx|✖' defect-lean.log | tail -n 100 || true
            tail -n 60 defect-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" defect-lean.log; then
            echo 'Trust audit failure'
            exit 1
          fi
      - name: Save compiled proof cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-geometric-defect
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-exact-geometric-rank-defect-lean-log
          path: defect-lean.log
          if-no-files-found: warn
