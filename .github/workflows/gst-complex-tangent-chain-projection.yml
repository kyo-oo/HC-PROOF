name: Mathbox GST Complex Tangent Chain Projection Audit
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - GSTComplexTangentProjectionChainObstruction.lean
      - .github/workflows/gst-complex-tangent-chain-projection.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-complex-tangent-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Compile exact chain projection obstruction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake env lean GSTComplexTangentProjectionChainObstruction.lean > gst-complex-projection.log 2>&1; then
            echo "LEAN PASSED: J projection fails chain-closure; rational Fourier check"
          else
            grep -nE 'error:|sorryAx|✖' gst-complex-projection.log | tail -n 130 || true
            tail -n 100 gst-complex-projection.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-complex-projection.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-complex-tangent-projection-proof-log
          path: gst-complex-projection.log
          if-no-files-found: warn
