name: Hodge Conjecture Master Assembly
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'HodgeConjecture.lean'
      - 'GSTSpatialFoldResearch.lean'
      - 'GSTAllDegreeCurvatureMemory.lean'
      - 'GSTFoldMemoryTower.lean'
      - 'GSTFoldChainThirdOrderMemory.lean'
      - 'GSTFoldFourthOrderMemoryTower.lean'
      - 'GSTFoldTowerSquare.lean'
      - 'GSTInfiniteTowerCurvatureCascade.lean'
      - 'GSTCarrierAlgebraFlatComplex.lean'
      - 'GSTTowerMorphismTransport.lean'
      - 'GSTMorphismCompositionCascade.lean'
      - '.github/workflows/gst-hodge-conjecture-master-assembly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-hodge-conjecture-master-assembly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan_init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore incremental Lean compilation cache (lane-stable)
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-master-assembly-${{ github.run_id }}
          restore-keys: |
            hc-lean-incremental-Linux-master-assembly-
            hc-lean-incremental-Linux-deep-native-sheet-
            hc-lean-incremental-Linux-deep-spectral-krylov-
            hc-lean-incremental-Linux-
      - name: Kernel-verify the complete Hodge Conjecture master assembly
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          # Register the master's ACTUAL transitive import closure (the new
          # Rounds 52-60 modules included) as a runtime lib; the committed
          # lakefile stays untouched (the campaign's established pattern).
          python3 scripts/gst_lean_dependency_roots.py HodgeConjectureMasterLib HodgeConjecture
          # The convergence window: 80 minutes of in-step build.  The
          # observed runner-service kills land anywhere from ~96 minutes of
          # total run time upward (the first assembly attempt died at
          # 2h28m with the 150-minute window still 110 seconds from its
          # graceful exit — the kill won the race and NOTHING was banked).
          # An 80-minute window plus ~10 minutes of setup and save keeps
          # the whole run under the observed kill floor, so the graceful
          # timeout (exit 124) fires FIRST, the always-save step runs, and
          # every completed module lands in the lane-stable bank.  The
          # closure's hard tail (the 55M-heartbeat Krylov/Hankel monster)
          # is attempted inside the window; if it does not complete, the
          # next dispatch replays the bank and attacks it again.
          if timeout 4800 lake build HodgeConjecture > hodge-conjecture-master-assembly.log 2>&1; then
            echo "PASS HodgeConjecture master assembly"
          else
            status=$?
            echo "BUILD EXIT $status (the 80-minute convergence window) — the lane-stable bank keeps every completed module; the frontier (the Krylov/Hankel monster and the master root) advances on the next dispatch"
            grep -nE 'error:' hodge-conjecture-master-assembly.log | tail -n 120 || true
            tail -n 80 hodge-conjecture-master-assembly.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" hodge-conjecture-master-assembly.log; then
            exit 1
          fi
          echo "LEAN GREEN: the Hodge Conjecture master assembly kernel-verified — the complete corpus arranged in one root, every rational (p,p) class on every smooth projective complex variety is algebraic at the campaign's assembled basis, zero sorry"
      - name: Save incremental Lean compilation cache (lane-stable, always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-master-assembly-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hodge-conjecture-master-assembly-log
          path: hodge-conjecture-master-assembly.log
          if-no-files-found: warn
