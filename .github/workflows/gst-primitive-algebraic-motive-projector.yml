name: Mathbox Primitive Algebraic Motive Gram Projector
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTPrimitiveAlgebraicMotiveProjector.lean
      - .github/workflows/gst-primitive-algebraic-motive-projector.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-motive-gram-projector-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify full rational Hodge algebraic and complement projectors
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTPrimitiveMotiveProjector"
          roots = [
            "GSTUniversalHodgeResidualProjection",
            "GSTPrimitiveAlgebraicMotiveProjector"
          ]
          EOF
          if lake build GSTPrimitiveMotiveProjector > gst-motive-projection.log 2>&1; then
            echo "LEAN PASSED: arbitrary rank orthogonal primitive Hodge complement projector"
          else
            grep -nE 'error:|sorryAx|✖' gst-motive-projection.log | tail -n 130 || true
            tail -n 150 gst-motive-projection.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-motive-projection.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-motive-gram-projector-lean
          path: gst-motive-projection.log
          if-no-files-found: warn
