name: GST All-Dimension Projective Middle Primitive
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - 'GSTAllDimensionProjectivePrimitiveCycles.lean'
      - '.github/workflows/gst-all-dimension-projective-primitive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-all-dimension-projective-primitive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-all-dimension-primitive
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify all-dimensional middle primitive coefficient theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTAllDimensionPrimitive"
          roots = ["GSTAllDimensionProjectivePrimitiveCycles"]
          EOF
          if lake build GSTAllDimensionPrimitive > all-dimension-primitive.log 2>&1; then
            echo "LEAN PASSED: alternating exact middle primitive kernel for every m"
          else
            grep -nE 'error:|sorryAx|✖' all-dimension-primitive.log | tail -n 120 || true
            tail -n 100 all-dimension-primitive.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" all-dimension-primitive.log; then
            exit 1
          fi
      - name: Upload Lean verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-all-dimension-projective-primitive-log
          path: all-dimension-primitive.log
          if-no-files-found: warn
