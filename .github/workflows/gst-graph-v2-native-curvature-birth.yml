name: GST Graph V2 - Native Geometric Curvature Birth

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTGraphV2NativeCurvatureBirth.lean'
      - '.github/workflows/gst-graph-v2-native-curvature-birth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-graph-v2-native-curvature-birth
  cancel-in-progress: false

jobs:
  verify:
    name: Lean kernel check original-X curvature cycle and mixing criterion
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-native-cm-curvature
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-native-cm-curvature
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Kernel compile native geometric curvature cycle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTNativeCMCurvatureBirthLib GSTGraphV2NativeCurvatureBirth
          if timeout 9900 lake build GSTGraphV2NativeCurvatureBirth > gst-native-curvature.log 2>&1; then
            echo "LEAN PASSED: GSTGraphV2NativeCurvatureBirth"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-native-curvature.log | tail -n 100 || true
            tail -n 75 gst-native-curvature.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-native-curvature.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-graph-native-curvature-birth-lean
          path: gst-native-curvature.log
          if-no-files-found: warn
