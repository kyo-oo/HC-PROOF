name: Sol Cosmology Targeted Gate

on:
  push:
    branches:
      - sol/cosmology-next
    paths:
      - 'GSTUniversalLefschetzPathFormula.lean'
      - 'GSTUniversalLefschetzDynamics.lean'
      - 'GSTUniversalLefschetzCosmology.lean'
      - 'GSTTruncatedWorldCohomologyRing.lean'
      - 'GSTWorldPoincareDuality.lean'
      - 'GSTUniversalAddressBridge.lean'
      - '.github/workflows/sol-cosmology-targeted.yml'

permissions:
  contents: read

concurrency:
  group: sol-cosmology-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Sol targeted cosmology
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            GSTWorldPoincareDuality.lean
            GSTUniversalAddressBridge.lean
            GSTUniversalLefschetzDynamics.lean
            GSTUniversalLefschetzCosmology.lean
            GSTTruncatedWorldCohomologyRing.lean
            GSTUniversalLefschetzPathFormula.lean
          )
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "${files[@]}"; then
            echo SOL_FORBIDDEN_PROOF_ESCAPE=1
            exit 1
          fi
          echo SOL_PROOF_ESCAPE_CHECK=PASS

      - name: Compile path calculus target
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTUniversalLefschetzPathFormula 2>&1 | tee sol-targeted.log
          echo SOL_TARGET_BUILD_GREEN=1

      - name: Verify no sorryAx
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sorryAx' sol-targeted.log; then
            echo SOL_SORRYAX_AUDIT=FAIL
            exit 1
          fi
          echo SOL_SORRYAX_AUDIT=PASS
