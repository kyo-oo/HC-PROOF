name: GST lower-half native Hodge Lefschetz transfer

on:
  push:
    branches:
      - research/gpt6-gst-hilbert-component-source-birth-20261110
    paths:
      - 'GSTCardinalLowHalfLefschetzTransfer.lean'
      - '.github/workflows/gst-cardinal-low-half-lefschetz-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-half-hodge
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-check lower-half original-X transfer
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTCardinalHalfLefschetzLib GSTCardinalLowHalfLefschetzTransfer
          if timeout 6500 lake build GSTCardinalLowHalfLefschetzTransfer > gst-half-hodge.log 2>&1; then
            echo "LEAN PASSED: GSTCardinalLowHalfLefschetzTransfer"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-half-hodge.log | tail -n 90 || true
            tail -n 100 gst-half-hodge.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-half-hodge.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-half-hodge-lean
          path: gst-half-hodge.log
          if-no-files-found: warn
