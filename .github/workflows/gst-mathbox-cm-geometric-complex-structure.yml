name: GST Mathbox CM Complex Structure Rank Gain
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTMathboxCMGeometricComplexStructure.lean'
      - '.github/workflows/gst-mathbox-cm-geometric-complex-structure.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-cm-complex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore cached dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-cm-J
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Verify CM quadratic geometric rank theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "MathboxCMComplexStructure"
          roots = ["GSTMathboxCMGeometricComplexStructure"]
          EOF
          if lake build MathboxCMComplexStructure > cm-J-lean.log 2>&1; then
            echo "LEAN PASSED: J-square geometric rank-gain"
          else
            grep -nE 'error:|sorryAx|✖' cm-J-lean.log | tail -n 100 || true
            tail -n 95 cm-J-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" cm-J-lean.log; then
            echo "Lean trust audit failed"
            exit 1
          fi
      - name: Upload Lean build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathbox-CM-quadratic-lean
          path: cm-J-lean.log
          if-no-files-found: warn
