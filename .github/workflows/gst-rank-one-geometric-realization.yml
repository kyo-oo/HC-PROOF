name: GST Native Rank-One Hodge Realization

on:
  push:
    branches:
      - research/gpt6-gst-native-rank-one-realization-20261014
    paths:
      - 'GSTClassicalHodgeSpineRankOneGeometricRealization.lean'
      - 'GSTClassicalHodgeLimitlessSpinePropagation.lean'
      - 'lakefile.toml'
      - '.github/workflows/gst-rank-one-geometric-realization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-rank-one-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-rank-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore GST dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-rank-one
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Kernel compile the actual native rank-one realization
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake build GSTClassicalHodgeSpineRankOneGeometricRealization > rank-one-lean.log 2>&1; then
            echo 'LEAN PASSED: native rank-one GST Hodge realization'
          else
            echo 'LEAN FAILED: native rank-one GST Hodge realization'
            grep -nE 'error:|sorryAx|✖' rank-one-lean.log | tail -n 100 || true
            tail -n 50 rank-one-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" rank-one-lean.log; then
            echo 'Lean trust audit failure'
            exit 1
          fi
      - name: Save GST dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-rank-one
      - name: Upload native rank-one compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-rank-one-native-lean-log
          path: rank-one-lean.log
          if-no-files-found: warn
