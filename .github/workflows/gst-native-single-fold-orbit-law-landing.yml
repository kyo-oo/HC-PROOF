name: GST Native Single-Fold Orbit Law Landing

on:
  push:
    branches:
      - main
      - research/gpt6-gst-hypothesis-part1-chow-square-20261110
    paths:
      - 'GSTNativeSingleFoldOrbitLawLanding.lean'
      - 'GSTHodgeSingleHypothesisConditional.lean'
      - 'GSTHypothesisSpanningProof.lean'
      - 'GSTHypothesisSpanningCompilerFace.lean'
      - 'GSTHypothesisComplete.lean'
      - 'GSTHypothesisPart1ChowAlgebraTransfer.lean'
      - 'GSTOriginalXWaveChowMatrixCompiler.lean'
      - 'GSTOriginalXAllWeightsLefschetzResidual.lean'
      - 'GSTOriginalXDivisorCurveCyclicChowFold.lean'
      - '.github/workflows/gst-native-single-fold-orbit-law-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-native-single-fold-orbit-law-landing
  cancel-in-progress: false

jobs:
  verify:
    name: Kernel check the native single-fold orbit law landing
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-native-orbit-law-landing
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2 || curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-native-orbit-law-landing
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Compile native GST single-fold orbit law landing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTNativeOrbitLawLandingLib GSTNativeSingleFoldOrbitLawLanding
          if timeout 16800 lake build GSTNativeSingleFoldOrbitLawLanding > gst-native-orbit-law-landing.log 2>&1; then
            echo "LEAN PASSED: GSTNativeSingleFoldOrbitLawLanding"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-native-orbit-law-landing.log | tail -n 100 || true
            tail -n 75 gst-native-orbit-law-landing.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-native-orbit-law-landing.log; then
            echo "Unexpected axiom or sorry found" && exit 1
          fi
      - name: Upload exact Lean compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-native-orbit-law-landing-lean
          path: gst-native-orbit-law-landing.log
          if-no-files-found: warn
