name: GST Canonical Native Point Cycle Bridge
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTCanonicalPointGeometryStage2G.lean'
      - 'GSTFermatCanonicalPointRankBridge.lean'
      - '.github/workflows/gst-canonical-point-cycle-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-canonical-point-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore Mathlib compiled dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-canonical-points
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify native-to-canonical geometric point bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTCanonicalPointBridge"
          roots = [
            "GSTCanonicalPointGeometryStage2G",
            "GSTFermatCanonicalPointRankBridge"
          ]
          EOF
          if lake build GSTCanonicalPointBridge > point-bridge-lean.log 2>&1; then
            echo "LEAN PASSED: exact all-codimension point-generated maps and genuine native Fermat rank"
          else
            grep -nE 'error:|sorryAx|✖' point-bridge-lean.log | tail -n 140 || true
            tail -n 95 point-bridge-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" point-bridge-lean.log; then
            exit 1
          fi
      - name: Upload kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-canonical-point-bridge-lean-log
          path: point-bridge-lean.log
          if-no-files-found: warn
