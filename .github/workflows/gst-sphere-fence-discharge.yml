name: GST Sphere Fence Discharge

on:
  push:
    branches:
      - main
      - research/gpt6-gst-hypothesis-part1-chow-square-20261110
    paths:
      - 'GSTFiniteLineFenceDischarge.lean'
      - 'GSTSphereTetrahedronCycle.lean'
      - 'GSTSphereNonzeroClass.lean'
      - 'GSTSphereRouteCorrection.lean'
      - 'GSTSphereFundamentalCycle.lean'
      - 'GSTFiniteLinePrimitiveXSource.lean'
      - 'GSTSingularCohomologyMaps.lean'
      - '.github/workflows/gst-sphere-fence-discharge.yml'
      - 'lakefile.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-sphere-fence-discharge
  cancel-in-progress: false

jobs:
  verify:
    name: "Kernel check the wave-10 fence-discharge cascade (the tetrahedron machine, the separator shape, the exists-flip)"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-finite-line-closed-immersion
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            ELAN_TAG="v4.2.4"
            ELAN_ASSET="elan-x86_64-unknown-linux-gnu.tar.gz"
            ELAN_TMP="$(mktemp -d)"
            ELAN_SRC=""
            for url in \
              "https://github.com/leanprover/elan/releases/download/${ELAN_TAG}/${ELAN_ASSET}" \
              "https://github.com/leanprover/elan/releases/latest/download/${ELAN_ASSET}"; do
              for attempt in 1 2 3; do
                echo "elan fetch: attempt ${attempt}/3 via ${url}"
                if curl -sSfL --connect-timeout 30 -o "${ELAN_TMP}/${ELAN_ASSET}" "$url"; then
                  ELAN_SRC="$url"
                  break 2
                fi
                echo "elan fetch failed via ${url}; sleeping 10s before retry" 2>&1 || true
                sleep 10
              done
            done
            if [ -z "$ELAN_SRC" ]; then
              echo "FATAL: elan installer download failed on every mirror and attempt" 2>&1 || true
              exit 1
            fi
            echo "elan installer fetched from ${ELAN_SRC}"
            tar -xzf "${ELAN_TMP}/${ELAN_ASSET}" -C "${ELAN_TMP}"
            chmod u+x "${ELAN_TMP}/elan-init"
            "${ELAN_TMP}/elan-init" -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-general-M-law
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: "Ladder 1/3: GSTSphereTetrahedronCycle (the projected boundary cycle)"
        id: p1
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build GSTSphereTetrahedronCycleLib > gst-sphere-fence-discharge.log 2>&1; then
            echo "TETRAHEDRON GREEN"
          else
            rc=$?
            echo "::error::TETRAHEDRON RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" gst-sphere-fence-discharge.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 2/3: GSTSphereNonzeroClass (the separator shape)"
        id: p2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build GSTSphereNonzeroClassLib >> gst-sphere-fence-discharge.log 2>&1; then
            echo "SEPARATOR GREEN"
          else
            rc=$?
            echo "::error::SEPARATOR RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" gst-sphere-fence-discharge.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 3/3: GSTFiniteLineFenceDischarge (the exists-flip master)"
        id: p3
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build GSTFiniteLineFenceDischargeLib >> gst-sphere-fence-discharge.log 2>&1; then
            echo "FENCE-DISCHARGE GREEN"
            echo "--- the sorryAx audit ---"
            if grep -nE "error:|sorryAx|declaration uses 'sorry'" gst-sphere-fence-discharge.log; then
              echo "::error::SORRY DETECTED"
              exit 1
            fi
          else
            rc=$?
            echo "::error::FENCE-DISCHARGE RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" gst-sphere-fence-discharge.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 4/4: GSTSphereRouteCorrection (the route-correction certificate)"
        id: p4
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build GSTSphereRouteCorrectionLib >> gst-sphere-fence-discharge.log 2>&1; then
            echo "ROUTE-CORRECTION GREEN"
            echo "--- the sorryAx audit ---"
            if grep -nE "error:|sorryAx|declaration uses 'sorry'" gst-sphere-fence-discharge.log; then
              echo "::error::SORRY DETECTED"
              exit 1
            fi
          else
            rc=$?
            echo "::error::ROUTE-CORRECTION RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" gst-sphere-fence-discharge.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 5/5: GSTSphereFundamentalCycle (the center-radial fundamental cycle)"
        id: p5
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build GSTSphereFundamentalCycleLib >> gst-sphere-fence-discharge.log 2>&1; then
            echo "FUNDAMENTAL-CYCLE GREEN"
            echo "--- the sorryAx audit ---"
            if grep -nE "error:|sorryAx|declaration uses 'sorry'" gst-sphere-fence-discharge.log; then
              echo "::error::SORRY DETECTED"
              exit 1
            fi
          else
            rc=$?
            echo "::error::FUNDAMENTAL-CYCLE RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" gst-sphere-fence-discharge.log | tail -n 25 || true
            exit 1
          fi
      - name: Bank the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-sphere-fence-discharge-${{ github.run_id }}
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-sphere-fence-discharge-log
          path: gst-sphere-fence-discharge.log
          if-no-files-found: ignore
