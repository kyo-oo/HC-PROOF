name: GST Fold Chain Third Order Memory
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTFoldChainThirdOrderMemory.lean'
      - 'GSTFoldMemoryTower.lean'
      - 'GSTAllDegreeCurvatureMemory.lean'
      - '.github/workflows/gst-fold-chain-third-order-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-fold-chain-third-order-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        id: lean-install
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-verify the third-order memory tower and arbitrary-length fold chain
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTFoldChainThirdOrderMemoryLib GSTFoldChainThirdOrderMemory
          if lake build GSTFoldChainThirdOrderMemory > fold-chain-third-order.log 2>&1; then
            echo "PASS GSTFoldChainThirdOrderMemory"
          else
            grep -nE 'error:' fold-chain-third-order.log | tail -n 120 || true
            tail -n 80 fold-chain-third-order.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" fold-chain-third-order.log; then
            exit 1
          fi
          echo "LEAN GREEN: the Round 54 third-order memory tower and arbitrary-length fold chain kernel-verified, zero sorry"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-fold-chain-third-order-memory-log
          path: fold-chain-third-order.log
          if-no-files-found: warn
