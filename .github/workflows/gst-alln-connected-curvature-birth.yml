name: GST all-N connected curvature source birth

on:
  push:
    branches:
      - research/gpt6-gst-wave-curvature-spectral-birth-20261110
    paths:
      - 'GSTAllNConnectedCurvatureBirth.lean'
      - 'GSTAllNConnectedCurvatureGeometricClosure.lean'
      - '.github/workflows/gst-alln-connected-curvature-birth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-alln-connected-curvature-birth
  cancel-in-progress: false

jobs:
  verify:
    name: Kernel verification of GST connected wave-curvature source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-connected-curvature
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-connected-curvature
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Kernel compile GST connected curvature module
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTConnectedCurvatureBirthLib GSTAllNConnectedCurvatureBirth
          if timeout 9900 lake build GSTAllNConnectedCurvatureGeometricClosure > gst-connected-curvature.log 2>&1; then
            echo "LEAN PASSED: GSTAllNConnectedCurvatureGeometricClosure"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-connected-curvature.log | tail -n 100 || true
            tail -n 95 gst-connected-curvature.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-connected-curvature.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-alln-connected-curvature-lean
          path: gst-connected-curvature.log
          if-no-files-found: warn
