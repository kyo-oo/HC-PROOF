name: GST Carrier Algebra Flat Complex
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTCarrierAlgebraFlatComplex.lean'
      - 'GSTInfiniteTowerCurvatureCascade.lean'
      - 'GSTFoldTowerSquare.lean'
      - 'GSTFoldFourthOrderMemoryTower.lean'
      - 'GSTFoldChainThirdOrderMemory.lean'
      - 'GSTFoldMemoryTower.lean'
      - 'GSTAllDegreeCurvatureMemory.lean'
      - '.github/workflows/gst-carrier-algebra-flat-complex.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-carrier-algebra-flat-complex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        id: lean-install
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-verify the carrier algebra and the flat complex
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTCarrierAlgebraFlatComplexLib GSTCarrierAlgebraFlatComplex
          if lake build GSTCarrierAlgebraFlatComplex > carrier-algebra-flat-complex.log 2>&1; then
            echo "PASS GSTCarrierAlgebraFlatComplex"
          else
            grep -nE 'error:' carrier-algebra-flat-complex.log | tail -n 120 || true
            tail -n 80 carrier-algebra-flat-complex.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" carrier-algebra-flat-complex.log; then
            exit 1
          fi
          echo "LEAN GREEN: the Round 58 carrier algebra and flat complex kernel-verified, zero sorry"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-carrier-algebra-flat-complex-log
          path: carrier-algebra-flat-complex.log
          if-no-files-found: warn
