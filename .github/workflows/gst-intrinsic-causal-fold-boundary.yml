name: GST Intrinsic Causal Fold Boundaries
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTGraphV2UnboundedHigherCausality.lean'
      - '.github/workflows/gst-intrinsic-causal-fold-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-intrinsic-causal-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel verify causal chain boundary for arbitrary natural dimension
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTIntrinsicCausalFoldBoundary"
          roots = ["GSTGraphV2UnboundedHigherCausality"]
          EOF
          if lake build GSTIntrinsicCausalFoldBoundary > gst-causal-fold-boundary.log 2>&1; then
            echo "LEAN PASSED: signed double boundary zero in every GST higher causal degree"
          else
            grep -nE 'error:|sorryAx|✖' gst-causal-fold-boundary.log | tail -n 140 || true
            tail -n 120 gst-causal-fold-boundary.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-causal-fold-boundary.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-intrinsic-causal-fold-boundary-log
          path: gst-causal-fold-boundary.log
          if-no-files-found: warn
