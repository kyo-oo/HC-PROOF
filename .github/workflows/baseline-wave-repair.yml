name: Baseline Wave Repair

on:
  push:
    branches:
      - sol/limitless-universe-repo-upgrade
    paths:
      - '.github/workflows/baseline-wave-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/limitless-universe-repo-upgrade
          fetch-depth: 1
      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Apply single diagnosed repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('waves/GSTWaveCohomology.lean')
          s = p.read_text()
          old = '      simp [Nat.add_assoc]\n'
          new = '      rw [add_assoc]\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one diagnosed occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- waves/GSTWaveCohomology.lean
      - name: Compile repaired Wave I
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean waves/GSTWaveCohomology.lean
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' waves/GSTWaveCohomology.lean; then
            exit 1
          fi
      - name: Commit compiler-verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-sol'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add waves/GSTWaveCohomology.lean
          git commit -m 'fix: repair integer wave cocycle associativity'
          git push origin HEAD:sol/limitless-universe-repo-upgrade
