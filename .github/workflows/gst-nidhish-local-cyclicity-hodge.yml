name: GST Nidhish Local Cyclicity All-Weight Hodge
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTNidhishLocalCyclicityHodge.lean'
      - '.github/workflows/gst-nidhish-local-cyclicity-hodge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-nidhish-local-cyclicity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-local-cyclic-hodge
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify local cyclicity all-weight Hodge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "NidhishLocalCyclicityHodge"
          roots = [
            "GSTNidhishGeometricOrbitSynthesis",
            "GSTNidhishUniversalOrbitClosureLaw",
            "GSTNidhishLocalCyclicityHodge"
          ]
          EOF
          if lake build NidhishLocalCyclicityHodge > local-cyclic-hodge-lean.log 2>&1; then
            echo "LEAN PASSED: all-weight Hodge under local geometric native cyclicity"
          else
            grep -nE 'error:|sorryAx|✖' local-cyclic-hodge-lean.log | tail -n 140 || true
            tail -n 95 local-cyclic-hodge-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" local-cyclic-hodge-lean.log; then
            echo "Trust audit failed"
            exit 1
          fi
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nidhish-local-cyclic-hodge-kernel-log
          path: local-cyclic-hodge-lean.log
          if-no-files-found: warn
