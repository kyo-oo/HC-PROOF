name: GST cardinal-indexed native Hodge fields

on:
  push:
    branches:
      - research/gpt6-gst-cardinal-topology-transfinite-fold-20261110
    paths:
      - 'GSTCardinalIndexedNativeHodge.lean'
      - '.github/workflows/gst-cardinal-indexed-native-hodge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-cardinal
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Restore Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Compile cardinal-indexed original GST geometry
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTCardinalIndexedLib GSTCardinalIndexedNativeHodge
          if timeout 6500 lake build GSTCardinalIndexedNativeHodge > gst-cardinal-lean.log 2>&1; then
            echo "LEAN PASSED: GSTCardinalIndexedNativeHodge"
          else
            grep -nE 'error:|sorryAx|unknown identifier|failed to synthesize|unsolved goals' gst-cardinal-lean.log | tail -n 90 || true
            tail -n 90 gst-cardinal-lean.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-cardinal-lean.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-cardinal-native-hodge-lean
          path: gst-cardinal-lean.log
          if-no-files-found: warn
