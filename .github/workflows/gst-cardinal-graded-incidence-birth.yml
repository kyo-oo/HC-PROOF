name: GST all-cardinal graded Hilbert incidence birth

on:
  push:
    branches:
      - research/gpt6-gst-hilbert-component-source-birth-20261110
    paths:
      - 'GSTCardinalGradedIncidenceBirth.lean'
      - '.github/workflows/gst-cardinal-graded-incidence-birth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-graded-incidence
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel check graded incidence birth
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTGradedIncidenceLib GSTCardinalGradedIncidenceBirth
          if timeout 6500 lake build GSTCardinalGradedIncidenceBirth > gst-graded-incidence.log 2>&1; then
            echo "LEAN PASSED: GSTCardinalGradedIncidenceBirth"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-graded-incidence.log | tail -n 90 || true
            tail -n 100 gst-graded-incidence.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-graded-incidence.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-cardinal-graded-incidence
          path: gst-graded-incidence.log
          if-no-files-found: warn
