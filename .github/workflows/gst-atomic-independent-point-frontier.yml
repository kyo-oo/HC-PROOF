name: GST Independent Point Geometric Frontier

on:
  push:
    branches:
      - research/gpt6-gst-native-rank-one-realization-20261014
    paths:
      - 'GSTClassicalHodgeAtomicIndependentPointFrontier.lean'
      - 'GSTClassicalHodgeNativeChargeOrthogonalization.lean'
      - '.github/workflows/gst-atomic-independent-point-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-atomic-point-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-point:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-atomic-frontier
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            hc-lean-incremental-${{ runner.os }}-
      - name: Compile atomic independent point frontier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake build GSTClassicalHodgeAtomicIndependentPointFrontier > atomic-frontier-lean.log 2>&1; then
            echo 'LEAN PASSED: rank-two Hodge iff independent genuine point'
          else
            echo 'LEAN FAILED: atomic independent point frontier'
            grep -nE 'error:|sorryAx|✖' atomic-frontier-lean.log | tail -n 120 || true
            tail -n 55 atomic-frontier-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" atomic-frontier-lean.log; then
            echo 'Kernel trust audit failed'
            exit 1
          fi
      - name: Save compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-atomic-frontier
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-atomic-independent-point-frontier-log
          path: atomic-frontier-lean.log
          if-no-files-found: warn
