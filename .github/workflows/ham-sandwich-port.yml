name: Ham Sandwich Port

on:
  push:
    branches:
      - main
      - research/gpt6-gst-hypothesis-part1-chow-square-20261110
    paths:
      - 'HamSandwich/**'
      - 'lakefile.toml'
      - '.github/workflows/ham-sandwich-port.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ham-sandwich-port
  cancel-in-progress: false

jobs:
  verify:
    name: "Kernel check the wave-13 HamSandwich port (subdivision, small chains, Mayer-Vietoris, the sphere tower)"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-finite-line-closed-immersion
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            ELAN_TAG="v4.2.4"
            ELAN_ASSET="elan-x86_64-unknown-linux-gnu.tar.gz"
            ELAN_TMP="$(mktemp -d)"
            ELAN_SRC=""
            for url in \
              "https://github.com/leanprover/elan/releases/download/${ELAN_TAG}/${ELAN_ASSET}" \
              "https://github.com/leanprover/elan/releases/latest/download/${ELAN_ASSET}"; do
              for attempt in 1 2 3; do
                echo "elan fetch: attempt ${attempt}/3 via ${url}"
                if curl -sSfL --connect-timeout 30 -o "${ELAN_TMP}/${ELAN_ASSET}" "$url"; then
                  ELAN_SRC="$url"
                  break 2
                fi
                echo "elan fetch failed via ${url}; sleeping 10s before retry" 2>&1 || true
                sleep 10
              done
            done
            if [ -z "$ELAN_SRC" ]; then
              echo "FATAL: elan installer download failed on every mirror and attempt" 2>&1 || true
              exit 1
            fi
            echo "elan installer fetched from ${ELAN_SRC}"
            tar -xzf "${ELAN_TMP}/${ELAN_ASSET}" -C "${ELAN_TMP}"
            chmod u+x "${ELAN_TMP}/elan-init"
            "${ELAN_TMP}/elan-init" -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-sphere-fence-discharge
          restore-keys: |
            hc-lean-incremental-Linux-finite-line-general-M-law
            hc-lean-incremental-Linux-
      - name: "Ladder 1/5: the barycentric subdivision machine (operator, boundary cancellation, chain homotopy, iteration, diameter)"
        id: p1
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build HamSandwich.SphereOddDegree.AlgebraicTopology.BarycentricSubdivisionIter HamSandwich.SphereOddDegree.AlgebraicTopology.BarycentricSubdivisionDiameter > ham-sandwich-port.log 2>&1; then
            echo "SUBDIVISION GREEN"
          else
            rc=$?
            echo "::error::SUBDIVISION RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" ham-sandwich-port.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 2/5: the small-chains quasi-isomorphism (covers, Lebesgue numbers, subordination)"
        id: p2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build HamSandwich.SphereOddDegree.AlgebraicTopology.SmallChainsQuasiIso >> ham-sandwich-port.log 2>&1; then
            echo "SMALL-CHAINS GREEN"
          else
            rc=$?
            echo "::error::SMALL-CHAINS RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" ham-sandwich-port.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 3/5: the Mayer-Vietoris sequence (the SES and the step iso)"
        id: p3
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build HamSandwich.SphereOddDegree.AlgebraicTopology.MayerVietoris >> ham-sandwich-port.log 2>&1; then
            echo "MAYER-VIETORIS GREEN"
          else
            rc=$?
            echo "::error::MAYER-VIETORIS RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" ham-sandwich-port.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 4/5: the sphere suspension tower (the S1 base, the MV step, the unconditional iso)"
        id: p4
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build HamSandwich.SphereOddDegree.AlgebraicTopology.SphereOrientationPosFromMV >> ham-sandwich-port.log 2>&1; then
            echo "SPHERE-TOWER GREEN"
            echo "--- the sorryAx audit ---"
            if grep -nE "error:|sorryAx|declaration uses 'sorry'" ham-sandwich-port.log; then
              echo "::error::SORRY DETECTED"
              exit 1
            fi
          else
            rc=$?
            echo "::error::SPHERE-TOWER RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" ham-sandwich-port.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 5/6: the axiom audit (the expected three axioms, zero sorryAx)"
        id: p5
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 3600 lake build HamSandwich.H2SphereAudit >> ham-sandwich-port.log 2>&1; then
            echo "AXIOM-AUDIT GREEN"
            echo "--- the axioms of the vendored machine ---"
            grep -n "axioms" ham-sandwich-port.log | tail -n 5 || true
            if grep -nE "error:|sorryAx|declaration uses 'sorry'" ham-sandwich-port.log; then
              echo "::error::SORRY DETECTED"
              exit 1
            fi
          else
            rc=$?
            echo "::error::AXIOM-AUDIT RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" ham-sandwich-port.log | tail -n 25 || true
            exit 1
          fi
      - name: "Ladder 6/6: the Q-endpoint (the rational suspension tower, the corpus-spelling nontriviality)"
        id: p6
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 7200 lake build HamSandwich.H2SphereQ >> ham-sandwich-port.log 2>&1; then
            echo "Q-ENDPOINT GREEN"
            echo "--- the sorryAx audit ---"
            if grep -nE "error:|sorryAx|declaration uses 'sorry'" ham-sandwich-port.log; then
              echo "::error::SORRY DETECTED"
              exit 1
            fi
            echo "--- the axioms of the Q-endpoint ---"
            grep -n "axioms" ham-sandwich-port.log | tail -n 10 || true
          else
            rc=$?
            echo "::error::Q-ENDPOINT RED (exit $rc)"
            echo "--- the Lean error tail ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" ham-sandwich-port.log | tail -n 25 || true
            exit 1
          fi
      - name: Bank the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-ham-sandwich-port-${{ github.run_id }}
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ham-sandwich-port-log
          path: ham-sandwich-port.log
          if-no-files-found: ignore
