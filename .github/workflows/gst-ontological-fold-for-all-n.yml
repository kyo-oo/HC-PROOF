name: GST Ontological Fold For All N Certificate

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTGraphV2OntologicalFoldForAllN.lean'
      - '.github/workflows/gst-ontological-fold-for-all-n.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-ontological-fold-for-all-n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        id: lean-install
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Save cached Lean toolchain
        if: steps.lean-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.run_id }}
      - name: Kernel verify ontological fold for-all-N certificate
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTGraphV2OntologicalFoldForAllN"
          roots = ["GSTGraphV2OntologicalFoldForAllN"]
          EOF
          if lake build GSTGraphV2OntologicalFoldForAllN > ontological-fold-for-all-n.log 2>&1; then
            echo "LEAN PASSED: P2 seed witness purity identity + scale 2, rank-2 parity obstruction, scale-group closure laws, principality m* (least positive scale divides all), the P2 full determination m* = 2, and the for-all-N packaging (universal bit implies landing for every input) kernel-verified"
          else
            grep -nE 'error:|sorryAx|✖' ontological-fold-for-all-n.log | tail -n 140 || true
            tail -n 120 ontological-fold-for-all-n.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" ontological-fold-for-all-n.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-ontological-fold-for-all-n-certificate-log
          path: ontological-fold-for-all-n.log
          if-no-files-found: warn
