name: GST CM Quadratic Native Rank Forcing
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTCMNumberManipulationTrace.lean'
      - 'GSTCMQuadraticNativeRankForcing.lean'
      - '.github/workflows/gst-cm-quadratic-native-rank-forcing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-cm-quadratic-rank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore incremental Lake cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-cm-quadratic-rank
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify CM quadratic geometrically realized rank-two forcing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTCMQuadraticRank"
          roots = [
            "GSTCMNumberManipulationTrace",
            "GSTCMQuadraticNativeRankForcing"
          ]
          EOF
          if lake build GSTCMQuadraticRank > cm-quadratic-rank-lean.log 2>&1; then
            echo "LEAN PASSED: imaginary CM quadratic polynomial forces independent actual native Hodge direction"
          else
            grep -nE 'error:|sorryAx|✖' cm-quadratic-rank-lean.log | tail -n 120 || true
            tail -n 90 cm-quadratic-rank-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" cm-quadratic-rank-lean.log; then
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-quadratic-rank-kernel-log
          path: cm-quadratic-rank-lean.log
          if-no-files-found: warn
