name: GST Actual Primitive Transverse Cycle Construction
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
      - mathbox/residual-zero-direct-audit-20261015
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTPrimitiveTransverseCycleExtraction.lean'
      - '.github/workflows/gst-primitive-transverse-cycle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-primitive-transverse-cycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore built dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-primitive-transverse
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel-check nonzero native primitive cycle construction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTPrimitiveTransverseCycle"
          roots = [
            "GSTUniversalLefschetzCurveCycles",
            "GSTClassicalHodgeGeometricMatrixRankLanding",
            "GSTUniversalPrimitiveDivisorConstruction",
            "GSTUniversalCodimensionTwoPrimitiveExtraction",
            "GSTPrimitiveTransverseCycleExtraction"
          ]
          EOF
          if lake build GSTPrimitiveTransverseCycle > primitive-transverse-cycle.log 2>&1; then
            echo "LEAN PASSED: actual transverse native cycle produces nonzero primitive algebraic cycle"
          else
            grep -nE 'error:|sorryAx|✖' primitive-transverse-cycle.log | tail -n 130 || true
            tail -n 100 primitive-transverse-cycle.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" primitive-transverse-cycle.log; then
            echo "Unexpected Lean proof trust dependency"
            exit 1
          fi
      - name: Upload Lean diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-primitive-transverse-cycle-log
          path: primitive-transverse-cycle.log
          if-no-files-found: warn
