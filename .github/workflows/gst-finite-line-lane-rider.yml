name: GST Finite Line Lane Rider (the lottery persistence)

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ride:
    name: "Re-dispatch the four lottery lanes (the ratchet keeps riding)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ride the four lanes (skip any already running or queued)
        shell: bash
        run: |
          set -euo pipefail
          REPO="kyo-oo/HC-PROOF"
          REF="research/gpt6-gst-hypothesis-part1-chow-square-20261110"
          for WF in \
            gst-finite-line-cycle-correspondence \
            gst-finite-line-points-gate-discharge \
            gst-finite-line-primitive-x-source \
            gst-finite-line-unconditional-source; do
            STATE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.LANE_RIDER_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WF}.yml/runs?per_page=1" \
              | jq -r '.workflow_runs[0].status // "none"')
            if [ "$STATE" = "in_progress" ] || [ "$STATE" = "queued" ] || [ "$STATE" = "waiting" ] || [ "$STATE" = "pending" ]; then
              echo "${WF}: already ${STATE} — skip"
              continue
            fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ secrets.LANE_RIDER_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WF}.yml/dispatches" \
              -d "{\"ref\":\"${REF}\"}")
            echo "${WF}: dispatch -> HTTP ${CODE}"
          done
