name: GST Image 3 genuine original-X native Chow F landing

on:
  push:
    branches:
      - research/gpt6-native-image3-navigation-cm-star-ncoho-20261111
    paths:
      - 'GSTImageThreeOriginalXNativeLanding.lean'
      - 'GSTPerfectPowerTailNavigation.lean'
      - '.github/workflows/gst-image3-original-x-native-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-image3-originalx
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Prepare Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-check genuine original-X navigation/CM F landing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTImage3OriginalXLib GSTImageThreeOriginalXNativeLanding
          if timeout 6700 lake build GSTImageThreeOriginalXNativeLanding > gst-image3-geometry.log 2>&1; then
            echo "LEAN PASSED: GSTImageThreeOriginalXNativeLanding"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-image3-geometry.log | tail -n 100 || true
            tail -n 120 gst-image3-geometry.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-image3-geometry.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Preserve Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-image3-originalx-lean
          path: gst-image3-geometry.log
          if-no-files-found: warn
