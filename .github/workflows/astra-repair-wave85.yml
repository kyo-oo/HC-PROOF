name: Astra Repair Wave 85

on:
  push:
    branches: [gst-cosmology-strengthening]
    paths:
      - '.github/workflows/astra-repair-wave85.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gst-cosmology-strengthening
          fetch-depth: 0
      - name: Apply remaining Lean repairs
        run: python3 scripts/astra_repair_wave85.py
      - name: Commit source repairs and remove temporary repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/astra-repair-wave85.yml
          rm scripts/astra_repair_wave85.py
          git config user.name kyo-oo
          git config user.email kyo-oo@users.noreply.github.com
          git add -A
          git commit -m 'Repair run 85 residual cosmology failures'
          git push origin HEAD:gst-cosmology-strengthening
