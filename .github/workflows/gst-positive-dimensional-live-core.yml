name: GST Positive-Dimensional Live-Core Kit

on:
  push:
    branches:
      - main
      - research/gpt6-gst-hypothesis-part1-chow-square-20261110
    paths:
      - 'GSTPositiveDimensionalLiveCoreKit.lean'
      - '.github/workflows/gst-positive-dimensional-live-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-positive-dimensional-live-core
  cancel-in-progress: false

jobs:
  verify:
    name: Kernel check the positive-dimensional live-core kit
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-finite-point-native-world
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            ELAN_TAG="v4.2.4"
            ELAN_ASSET="elan-x86_64-unknown-linux-gnu.tar.gz"
            ELAN_TMP="$(mktemp -d)"
            ELAN_SRC=""
            for url in \
              "https://github.com/leanprover/elan/releases/download/${ELAN_TAG}/${ELAN_ASSET}" \
              "https://github.com/leanprover/elan/releases/latest/download/${ELAN_ASSET}"; do
              for attempt in 1 2 3; do
                echo "elan fetch: attempt ${attempt}/3 via ${url}"
                if curl -sSfL --connect-timeout 30 -o "${ELAN_TMP}/${ELAN_ASSET}" "$url"; then
                  ELAN_SRC="$url"
                  break 2
                fi
                echo "elan fetch failed via ${url}; sleeping 10s before retry" >&2
                sleep 10
              done
            done
            if [ -z "$ELAN_SRC" ]; then
              echo "FATAL: elan installer download failed on every mirror and attempt" >&2
              exit 1
            fi
            echo "elan installer fetched from ${ELAN_SRC}"
            tar -xzf "${ELAN_TMP}/${ELAN_ASSET}" -C "${ELAN_TMP}"
            chmod u+x "${ELAN_TMP}/elan-init"
            "${ELAN_TMP}/elan-init" -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-positive-dimensional-live-core
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Compile the positive-dimensional live-core kit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTPositiveDimensionalLiveCoreLib GSTPositiveDimensionalLiveCoreKit
          if timeout 16800 lake build GSTPositiveDimensionalLiveCoreKit > gst-positive-dimensional-live-core.log 2>&1; then
            echo "LEAN PASSED: GSTPositiveDimensionalLiveCoreKit"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-positive-dimensional-live-core.log | tail -n 100 || true
            tail -n 75 gst-positive-dimensional-live-core.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-positive-dimensional-live-core.log; then
            echo "Unexpected axiom or sorry found" && exit 1
          fi
      - name: Upload exact Lean compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-positive-dimensional-live-core-lean
          path: gst-positive-dimensional-live-core.log
          if-no-files-found: warn
