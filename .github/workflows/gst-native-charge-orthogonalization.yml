name: GST Native Charge Orthogonalization Proof

on:
  push:
    branches:
      - research/gpt6-gst-native-rank-one-realization-20261014
    paths:
      - 'GSTClassicalHodgeNativeChargeOrthogonalization.lean'
      - 'GSTClassicalHodgeActualCommutatorRankGain.lean'
      - 'lakefile.toml'
      - '.github/workflows/gst-native-charge-orthogonalization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-charge-orthogonalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charge-orthogonalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-native-charge
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            hc-lean-incremental-${{ runner.os }}-
      - name: Compile geometric charge orthogonalization
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake build GSTClassicalHodgeNativeChargeOrthogonalization > charge-lean.log 2>&1; then
            echo 'LEAN PASSED: native charge orthogonalization and rank-two conclusion'
          else
            echo 'LEAN FAILED: native charge orthogonalization'
            grep -nE 'error:|sorryAx|✖' charge-lean.log | tail -n 100 || true
            tail -n 50 charge-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" charge-lean.log; then
            echo 'Lean trust audit failure'
            exit 1
          fi
      - name: Save GST dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-native-charge
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-native-charge-orthogonalization-log
          path: charge-lean.log
          if-no-files-found: warn
