name: GST Hodge - One Fold Hypothesis Conditional Proof

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTHodgeSingleHypothesisConditional.lean'
      - '.github/workflows/gst-hodge-single-hypothesis-conditional.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-hodge-one-fold-hypothesis
  cancel-in-progress: false

jobs:
  verify:
    name: Kernel check one native fold conditional theorem
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-one-fold-unseen
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-one-fold-unseen
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Compile single-hypothesis GST conditional crown
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTHodgeOneFoldConditional GSTHodgeSingleHypothesisConditional
          if timeout 9900 lake build GSTHodgeSingleHypothesisConditional > gst-one-fold-conditional.log 2>&1; then
            echo "LEAN PASSED: GSTHodgeSingleHypothesisConditional"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-one-fold-conditional.log | tail -n 100 || true
            tail -n 75 gst-one-fold-conditional.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-one-fold-conditional.log; then
            echo "Unexpected axiom or sorry found" && exit 1
          fi
      - name: Upload exact Lean compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-one-fold-conditional-lean
          path: gst-one-fold-conditional.log
          if-no-files-found: warn
