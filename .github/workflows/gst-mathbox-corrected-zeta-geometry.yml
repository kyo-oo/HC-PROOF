name: GST Mathbox Corrected Zeta Geometry
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTMathboxCorrectedZetaGeometry.lean'
      - '.github/workflows/gst-mathbox-corrected-zeta-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-corrected-zeta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-indexed-zeta
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Lean kernel check corrected equation three
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "MathboxCorrectedZeta"
          roots = ["GSTMathboxCorrectedZetaGeometry"]
          EOF
          if lake build MathboxCorrectedZeta > corrected-zeta-lean.log 2>&1; then
            echo "LEAN PASSED: corrected index-dependent zeta geometry"
          else
            grep -nE 'error:|sorryAx|✖' corrected-zeta-lean.log | tail -n 120 || true
            tail -n 100 corrected-zeta-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" corrected-zeta-lean.log; then
            echo "Trust audit failure"
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-corrected-zeta-lean
          path: corrected-zeta-lean.log
          if-no-files-found: warn
