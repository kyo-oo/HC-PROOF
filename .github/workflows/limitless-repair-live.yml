name: Limitless Compile Check

on:
  push:
    branches:
      - "sol/limitless-cosmology-bursts"
    paths:
      - ".github/workflows/limitless-repair-live.yml"
      - "scripts/limitless_repair.py"
      - "GSTCoherentCosmology.lean"
      - "GSTGradedWorldAlgebra.lean"
      - "GSTGraphV2CanonicalPhaseSteering.lean"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check committed source
        run: |
          set -euo pipefail
          git diff --check
          if grep -nE '\bsorry\b|sorryAx' GSTGradedWorldAlgebra.lean GSTGraphV2CanonicalPhaseSteering.lean GSTCoherentCosmology.lean; then exit 1; fi
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile repairs
        run: |
          set -o pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTGradedWorldAlgebra GSTGraphV2CanonicalPhaseSteering GSTCoherentCosmology 2>&1 | tee repair-build.log
      - name: Upload repair build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-repair-build-log
          path: repair-build.log
          if-no-files-found: ignore
