name: Limitless Universalization Burst

on:
  push:
    branches:
      - sol/limitless-cosmology-bursts
    paths:
      - '.github/workflows/limitless-proof-repair.yml'

permissions:
  contents: write

jobs:
  universalize-and-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/limitless-cosmology-bursts
          fetch-depth: 1

      - name: Apply limitless transfer and Stage-2 burst
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"block not unique in {path}")
              p.write_text(text.replace(old, new))

          def insert_before(path, marker, block, sentinel):
              p = Path(path)
              text = p.read_text()
              if sentinel in text:
                  raise SystemExit(f"sentinel already present in {path}: {sentinel}")
              if marker not in text:
                  raise SystemExit(f"marker not found in {path}: {marker}")
              p.write_text(text.replace(marker, block + "\n" + marker, 1))

          transfer = base64.b64decode("").decode()
          stage2e = base64.b64decode("").decode()
          stage2f = base64.b64decode("").decode()
          stage2g = base64.b64decode("").decode()

          replace_once('GSTTransferBridgeV2.lean','import GSTClayOfficialV2\n','import GSTClayOfficialV2\nimport GSTUniversalAddressBridge\nimport GSTDimensionFreeHodgeDiagonal\n')
          insert_before('GSTTransferBridgeV2.lean','#check addr_zero',transfer,'theorem transfer_v2_limitless_crown')
          insert_before('GSTGeometricRealizationStage2E.lean','#check RationalVectorSpace',stage2e,'structure Stage2ECompactRealization')
          insert_before('GSTGeometricRealizationStage2F.lean','#check ComplexPoint',stage2f,'abbrev Stage2FCompactRealization')
          insert_before('GSTGeometricRealizationStage2G.lean','#check Complexification',stage2g,'abbrev Stage2GCompactRealization')
          replace_once('HCProof.lean','#check GSTTransferBridgeV2.transfer_v2_crown\n','#check GSTTransferBridgeV2.transfer_v2_crown\n#check GSTTransferBridgeV2.transfer_v2_limitless_crown\n')
          replace_once('HCProof.lean','#check GSTGeometricRealizationStage2E.Stage2ERealizationObligation\n','#check GSTGeometricRealizationStage2E.Stage2ERealizationObligation\n#check GSTGeometricRealizationStage2E.Stage2ECompactRealization\n#check GSTGeometricRealizationStage2E.classical_hodge_of_stage2e_compact_family\n#check GSTGeometricRealizationStage2E.Stage2ECompactRealizationObligation\n')
          replace_once('HCProof.lean','#check GSTGeometricRealizationStage2F.Stage2FRealizationObligation\n','#check GSTGeometricRealizationStage2F.Stage2FRealizationObligation\n#check GSTGeometricRealizationStage2F.Stage2FCompactRealization\n#check GSTGeometricRealizationStage2F.betti_hodge_of_stage2f_compact_family\n#check GSTGeometricRealizationStage2F.Stage2FCompactRealizationObligation\n')
          replace_once('HCProof.lean','#check GSTGeometricRealizationStage2G.bigraded_betti_hodge_of_stage2g_family\n','#check GSTGeometricRealizationStage2G.bigraded_betti_hodge_of_stage2g_family\n#check GSTGeometricRealizationStage2G.Stage2GCompactRealization\n#check GSTGeometricRealizationStage2G.bigraded_betti_hodge_of_stage2g_compact_family\n#check GSTGeometricRealizationStage2G.Stage2GCompactRealizationObligation\n')
          PY

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Reject proof escapes in universalization burst
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' \
            GSTTransferBridgeV2.lean \
            GSTGeometricRealizationStage2E.lean \
            GSTGeometricRealizationStage2F.lean \
            GSTGeometricRealizationStage2G.lean; then
            exit 1
          fi

      - name: Compile full universalization burst
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            GSTTransferBridgeV2 \
            GSTGeometricRealizationStage2E \
            GSTGeometricRealizationStage2F \
            GSTGeometricRealizationStage2G \
            HCProof

      - name: Commit green universalization burst
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GSTTransferBridgeV2.lean GSTGeometricRealizationStage2E.lean GSTGeometricRealizationStage2F.lean GSTGeometricRealizationStage2G.lean HCProof.lean
          git commit -m "Remove finite-rank ceilings from transfer and Stage 2"
          git push origin HEAD:sol/limitless-cosmology-bursts
