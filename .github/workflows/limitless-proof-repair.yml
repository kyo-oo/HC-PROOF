name: Limitless Universalization Burst

on:
  push:
    branches:
      - sol/limitless-cosmology-bursts
    paths:
      - '.github/workflows/limitless-proof-repair.yml'

permissions:
  contents: write

jobs:
  universalize-and-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sol/limitless-cosmology-bursts
          fetch-depth: 1

      - name: Apply limitless transfer and Stage-2 burst
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"block not unique in {path}")
              p.write_text(text.replace(old, new))

          def insert_before(path, marker, block, sentinel):
              p = Path(path)
              text = p.read_text()
              if sentinel in text:
                  raise SystemExit(f"sentinel already present in {path}: {sentinel}")
              if marker not in text:
                  raise SystemExit(f"marker not found in {path}: {marker}")
              p.write_text(text.replace(marker, block + "\n\n" + marker, 1))

          replace_once(
              'GSTTransferBridgeV2.lean',
              'import GSTClayOfficialV2\n',
              'import GSTClayOfficialV2\nimport GSTUniversalAddressBridge\nimport GSTDimensionFreeHodgeDiagonal\n')

          transfer = r'''
/-! ## Limitless compact address classification

The historical `Fin 12` address ring remains an exact finite chart.  The
stronger carrier below is countable and finitely supported, so no global
address rank or terminal Hodge weight is built into the transfer layer.
-/

abbrev CompactClRing : Type := ℕ →₀ ℤ

def compactClCode (p : Nat) : Nat := Nat.pair p p

def compactClMono (p : Nat) : CompactClRing :=
  Finsupp.single (compactClCode p) 1

/-- Weight-p compact address classes are supported only at the unique
unbounded diagonal code attached to p. -/
def isCompactClHodge (p : Nat) (φ : CompactClRing) : Prop :=
  ∀ i : Nat, i ≠ compactClCode p → φ i = 0

/-- Every natural weight has a nonzero compact-address Hodge generator. -/
theorem compactClMono_isHodge (p : Nat) :
    isCompactClHodge p (compactClMono p) := by
  intro i hi
  simp [compactClMono, hi]

/-- **RANK-FREE COMPACT ADDRESS CLASSIFICATION.**  At every natural weight,
the compact Hodge sector is rank one, with no `Fin 12` or `p < 3` ceiling. -/
theorem compactClHodge_rank_one (p : Nat) (φ : CompactClRing) :
    isCompactClHodge p φ ↔
      ∃! z : ℤ, φ = z • compactClMono p := by
  constructor
  · intro hφ
    refine ⟨φ (compactClCode p), ?_, ?_⟩
    · ext i
      by_cases hi : i = compactClCode p
      · subst i
        simp [compactClMono]
      · simp [compactClMono, hi, hφ i hi]
    · intro z hz
      have hread := congrArg
        (fun ψ : CompactClRing => ψ (compactClCode p)) hz
      simpa [compactClMono] using hread.symm
  · rintro ⟨z, hz, _⟩
    intro i hi
    rw [hz]
    simp [compactClMono, hi]

/-- The unique scalar is read directly at the unbounded diagonal code. -/
theorem compactClHodge_coefficient_exact
    (p : Nat) (φ : CompactClRing)
    (hφ : isCompactClHodge p φ) :
    φ = (φ (compactClCode p)) • compactClMono p := by
  rcases (compactClHodge_rank_one p φ).1 hφ with ⟨z, hz, _⟩
  have hread := congrArg
    (fun ψ : CompactClRing => ψ (compactClCode p)) hz
  have hzread : z = φ (compactClCode p) := by
    simpa [compactClMono] using hread.symm
  simpa [hzread] using hz

/-- Limitless transfer crown: the finite twelve-coordinate theorem survives
as a specialization, while the strongest address classification is now
countable, finitely supported, and valid at every natural weight. -/
theorem transfer_v2_limitless_crown :
    (∀ p : Nat, isCompactClHodge p (compactClMono p))
    ∧ (∀ p : Nat, ∀ φ : CompactClRing,
      isCompactClHodge p φ ↔
        ∃! z : ℤ, φ = z • compactClMono p)
    ∧ (∀ p : Nat, ∀ φ : CompactClRing,
      isCompactClHodge p φ →
        φ = (φ (compactClCode p)) • compactClMono p) := by
  exact ⟨compactClMono_isHodge,
    compactClHodge_rank_one,
    compactClHodge_coefficient_exact⟩
'''
          insert_before(
              'GSTTransferBridgeV2.lean',
              '#check addr_zero',
              transfer,
              'theorem transfer_v2_limitless_crown')

          stage2e = r'''
/-! ## Rank-free compact Stage-2E route

The finite-rank certificate remains available for compatibility.  This
route instead uses `CompactHodgeRealization ℕ`: each encoded class is
finitely supported, but there is no globally fixed address dimension `N`.
The basis-cycle data remains an explicit geometric obligation.
-/

structure Stage2ECompactRealization
    (V : SmoothProjectiveComplexScheme)
    (H : ClassicalHodgeData V)
    (p : Nat) where
  realization :
    CompactHodgeRealization ℕ (H.cohomology p) (codimensionCycles V.X p)
  hodge_iff :
    ∀ alpha : H.cohomology p,
      realization.isHodge alpha ↔ alpha ∈ H.hodgePP p
  cycleClass_eq :
    realization.cycleClass = H.cycleClass p

/-- A rank-free compact realization produces an actual codimension-p cycle
for every intended classical Hodge class. -/
theorem hodge_class_has_classical_cycle_compact
    (V : SmoothProjectiveComplexScheme)
    (H : ClassicalHodgeData V)
    {p : Nat}
    (R : Stage2ECompactRealization V H p)
    (alpha : H.cohomology p)
    (halpha : alpha ∈ H.hodgePP p) :
    ∃ Z : codimensionCycles V.X p,
      H.cycleClass p Z = alpha := by
  have hr : R.realization.isHodge alpha :=
    (R.hodge_iff alpha).2 halpha
  obtain ⟨Z, hZ⟩ :=
    compact_realization_surjectivity R.realization alpha hr
  refine ⟨Z, ?_⟩
  rw [← R.cycleClass_eq]
  exact hZ

/-- **RANK-FREE STAGE-2E LANDING.**  No address-rank function occurs. -/
theorem classical_hodge_of_stage2e_compact_family
    (V : SmoothProjectiveComplexScheme)
    (H : ClassicalHodgeData V)
    (R : ∀ p : Nat, Stage2ECompactRealization V H p) :
    ClassicalHodgeStatement V H := by
  intro p alpha halpha
  exact hodge_class_has_classical_cycle_compact
    V H (R p) alpha halpha

/-- Exact remaining compact geometric obligation.  It is rank-free but does
not assume the Hodge conclusion or cycle-class surjectivity. -/
def Stage2ECompactRealizationObligation
    (V : SmoothProjectiveComplexScheme)
    (H : ClassicalHodgeData V) : Prop :=
  ∀ p : Nat, Nonempty (Stage2ECompactRealization V H p)

theorem classical_hodge_of_stage2e_compact_obligation
    (V : SmoothProjectiveComplexScheme)
    (H : ClassicalHodgeData V)
    (hR : Stage2ECompactRealizationObligation V H) :
    ClassicalHodgeStatement V H := by
  exact classical_hodge_of_stage2e_compact_family
    V H (fun p => (hR p).some)
'''
          insert_before(
              'GSTGeometricRealizationStage2E.lean',
              '#check RationalVectorSpace',
              stage2e,
              'structure Stage2ECompactRealization')

          stage2f = r'''
/-! ## Rank-free compact Stage-2F route -/

abbrev Stage2FCompactRealization
    (V : SmoothProjectiveComplexScheme)
    (H : BettiHodgeData V)
    (p : Nat) :=
  Stage2ECompactRealization V H.toClassicalHodgeData p

/-- Native Betti cohomology now inherits the same countable finite-support
realization route, with no global coordinate rank. -/
theorem hodge_class_has_betti_cycle_compact
    (V : SmoothProjectiveComplexScheme)
    (H : BettiHodgeData V)
    {p : Nat}
    (R : Stage2FCompactRealization V H p)
    (alpha : RationalSingularCohomology H.analytification (2 * p))
    (halpha : alpha ∈ H.hodgePP p) :
    ∃ Z : codimensionCycles V.X p,
      H.cycleClass p Z = alpha := by
  exact hodge_class_has_classical_cycle_compact
    V H.toClassicalHodgeData R alpha halpha

/-- **RANK-FREE STAGE-2F BETTI LANDING.** -/
theorem betti_hodge_of_stage2f_compact_family
    (V : SmoothProjectiveComplexScheme)
    (H : BettiHodgeData V)
    (R : ∀ p : Nat, Stage2FCompactRealization V H p) :
    BettiHodgeStatement V H := by
  intro p alpha halpha
  exact hodge_class_has_betti_cycle_compact
    V H (R p) alpha halpha

def Stage2FCompactRealizationObligation
    (V : SmoothProjectiveComplexScheme)
    (H : BettiHodgeData V) : Prop :=
  ∀ p : Nat, Nonempty (Stage2FCompactRealization V H p)

theorem stage2F_compact_obligation_iff_stage2E_compact
    (V : SmoothProjectiveComplexScheme)
    (H : BettiHodgeData V) :
    Stage2FCompactRealizationObligation V H ↔
      Stage2ECompactRealizationObligation V H.toClassicalHodgeData :=
  Iff.rfl

theorem betti_hodge_of_stage2f_compact_obligation
    (V : SmoothProjectiveComplexScheme)
    (H : BettiHodgeData V)
    (hR : Stage2FCompactRealizationObligation V H) :
    BettiHodgeStatement V H := by
  exact betti_hodge_of_stage2f_compact_family
    V H (fun p => (hR p).some)
'''
          insert_before(
              'GSTGeometricRealizationStage2F.lean',
              '#check ComplexPoint',
              stage2f,
              'abbrev Stage2FCompactRealization')

          stage2g = r'''
/-! ## Rank-free compact Stage-2G route -/

abbrev Stage2GCompactRealization
    (V : SmoothProjectiveComplexScheme)
    (H : HodgeBigradedBettiData V)
    (p : Nat) :=
  Stage2FCompactRealization V H.toBettiHodgeData p

/-- Every derived rational (p,p)-class obtains a codimension-p cycle from
the compact countable realization, with no finite-rank parameter. -/
theorem hodge_class_has_bigraded_cycle_compact
    (V : SmoothProjectiveComplexScheme)
    (H : HodgeBigradedBettiData V)
    {p : Nat}
    (R : Stage2GCompactRealization V H p)
    (alpha : RationalSingularCohomology H.analytification (2 * p))
    (halpha :
      complexificationMapQ
          (RationalSingularCohomology H.analytification (2 * p)) alpha
        ∈ (H.hodgeBigrading p).ppComponent) :
    ∃ Z : codimensionCycles V.X p,
      H.cycleClass p Z = alpha := by
  apply hodge_class_has_betti_cycle_compact
    V H.toBettiHodgeData R alpha
  exact (mem_rationalHodgeSubspace_iff
    (H.hodgeBigrading p) alpha).2 halpha

/-- **RANK-FREE STAGE-2G LANDING.**  The strongest reduction no longer
contains `N : Nat → Nat`; only the explicit compact geometric realization
family remains. -/
theorem bigraded_betti_hodge_of_stage2g_compact_family
    (V : SmoothProjectiveComplexScheme)
    (H : HodgeBigradedBettiData V)
    (R : ∀ p : Nat, Stage2GCompactRealization V H p) :
    BigradedBettiHodgeStatement V H := by
  intro p alpha halpha
  exact hodge_class_has_betti_cycle_compact
    V H.toBettiHodgeData (R p) alpha halpha

def Stage2GCompactRealizationObligation
    (V : SmoothProjectiveComplexScheme)
    (H : HodgeBigradedBettiData V) : Prop :=
  ∀ p : Nat, Nonempty (Stage2GCompactRealization V H p)

theorem stage2G_compact_obligation_iff_stage2F_compact
    (V : SmoothProjectiveComplexScheme)
    (H : HodgeBigradedBettiData V) :
    Stage2GCompactRealizationObligation V H ↔
      Stage2FCompactRealizationObligation V H.toBettiHodgeData :=
  Iff.rfl

theorem stage2G_compact_obligation_iff_stage2E_compact
    (V : SmoothProjectiveComplexScheme)
    (H : HodgeBigradedBettiData V) :
    Stage2GCompactRealizationObligation V H ↔
      Stage2ECompactRealizationObligation
        V H.toBettiHodgeData.toClassicalHodgeData := by
  exact (stage2G_compact_obligation_iff_stage2F_compact V H).trans
    (stage2F_compact_obligation_iff_stage2E_compact V H.toBettiHodgeData)

theorem bigraded_betti_hodge_of_stage2g_compact_obligation
    (V : SmoothProjectiveComplexScheme)
    (H : HodgeBigradedBettiData V)
    (hR : Stage2GCompactRealizationObligation V H) :
    BigradedBettiHodgeStatement V H := by
  exact bigraded_betti_hodge_of_stage2g_compact_family
    V H (fun p => (hR p).some)
'''
          insert_before(
              'GSTGeometricRealizationStage2G.lean',
              '#check Complexification',
              stage2g,
              'abbrev Stage2GCompactRealization')

          replace_once(
              'HCProof.lean',
              '#check GSTTransferBridgeV2.transfer_v2_crown\n',
              '#check GSTTransferBridgeV2.transfer_v2_crown\n#check GSTTransferBridgeV2.transfer_v2_limitless_crown\n')
          replace_once(
              'HCProof.lean',
              '#check GSTGeometricRealizationStage2E.Stage2ERealizationObligation\n',
              '#check GSTGeometricRealizationStage2E.Stage2ERealizationObligation\n#check GSTGeometricRealizationStage2E.Stage2ECompactRealization\n#check GSTGeometricRealizationStage2E.classical_hodge_of_stage2e_compact_family\n#check GSTGeometricRealizationStage2E.Stage2ECompactRealizationObligation\n')
          replace_once(
              'HCProof.lean',
              '#check GSTGeometricRealizationStage2F.Stage2FRealizationObligation\n',
              '#check GSTGeometricRealizationStage2F.Stage2FRealizationObligation\n#check GSTGeometricRealizationStage2F.Stage2FCompactRealization\n#check GSTGeometricRealizationStage2F.betti_hodge_of_stage2f_compact_family\n#check GSTGeometricRealizationStage2F.Stage2FCompactRealizationObligation\n')
          replace_once(
              'HCProof.lean',
              '#check GSTGeometricRealizationStage2G.bigraded_betti_hodge_of_stage2g_family\n',
              '#check GSTGeometricRealizationStage2G.bigraded_betti_hodge_of_stage2g_family\n#check GSTGeometricRealizationStage2G.Stage2GCompactRealization\n#check GSTGeometricRealizationStage2G.bigraded_betti_hodge_of_stage2g_compact_family\n#check GSTGeometricRealizationStage2G.Stage2GCompactRealizationObligation\n')
          PY

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Reject proof escapes in universalization burst
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' \
            GSTTransferBridgeV2.lean \
            GSTGeometricRealizationStage2E.lean \
            GSTGeometricRealizationStage2F.lean \
            GSTGeometricRealizationStage2G.lean; then
            exit 1
          fi

      - name: Compile full universalization burst
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            GSTTransferBridgeV2 \
            GSTGeometricRealizationStage2E \
            GSTGeometricRealizationStage2F \
            GSTGeometricRealizationStage2G \
            HCProof

      - name: Commit green universalization burst
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            GSTTransferBridgeV2.lean \
            GSTGeometricRealizationStage2E.lean \
            GSTGeometricRealizationStage2F.lean \
            GSTGeometricRealizationStage2G.lean \
            HCProof.lean
          git commit -m "Remove finite-rank ceilings from transfer and Stage 2"
          git push origin HEAD:sol/limitless-cosmology-bursts
