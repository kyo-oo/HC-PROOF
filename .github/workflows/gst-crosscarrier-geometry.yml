name: GST Cross-Carrier Geometry Verification

# NEEDS CI RUN LATER: manual dispatch only during the Lean-writing phase.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-crosscarrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-carrier-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and retrieve Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled dependency objects
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Kernel-check cross-carrier geometric transfer and imports
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClassicalHodgeCrossCarrierGeometricTransfer 2>&1 | tee crosscarrier-lean.log
      - name: Reject sorry-based compilation
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "declaration uses 'sorry'|sorryAx" crosscarrier-lean.log; then exit 1; fi
      - name: Save compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosscarrier-geometry-lean-log
          path: crosscarrier-lean.log
          if-no-files-found: warn
