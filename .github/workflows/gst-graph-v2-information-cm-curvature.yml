name: GST Graph V2 - Information Recovery and CM Infinite Curvature

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTGraphV2InformationRecovery.lean'
      - 'GSTGraphV2GeneralRadixConservation.lean'
      - 'GSTGraphV2CMInfiniteCurvatureBridge.lean'
      - '.github/workflows/gst-graph-v2-information-cm-curvature.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-graph-v2-information-cm-curvature
  cancel-in-progress: false

jobs:
  verify:
    name: Kernel check infinite information recovery and CM curvature
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-information-cm-curvature
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-information-cm-curvature
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Kernel compile exact graph information theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTGraphInfoCMCurvatureLib GSTGraphV2InformationRecovery
          if timeout 9900 lake build GSTGraphV2InformationRecovery > gst-graph-information.log 2>&1; then
            echo "LEAN PASSED: GSTGraphV2InformationRecovery"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-graph-information.log | tail -n 100 || true
            tail -n 75 gst-graph-information.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-graph-information.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Kernel compile generalized radix conservation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTGraphRadixLib GSTGraphV2GeneralRadixConservation
          if timeout 9900 lake build GSTGraphV2GeneralRadixConservation > gst-general-radix.log 2>&1; then
            echo "LEAN PASSED: GSTGraphV2GeneralRadixConservation"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-general-radix.log | tail -n 100 || true
            tail -n 75 gst-general-radix.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-general-radix.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Kernel compile integrated CM curvature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f GSTGraphV2CMInfiniteCurvatureBridge.lean ]; then
            echo "Integrated module not yet present; information verification only"
            exit 0
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTCMCurvatureLib GSTGraphV2CMInfiniteCurvatureBridge
          if timeout 9900 lake build GSTGraphV2CMInfiniteCurvatureBridge > gst-cm-curvature.log 2>&1; then
            echo "LEAN PASSED: GSTGraphV2CMInfiniteCurvatureBridge"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-cm-curvature.log | tail -n 100 || true
            tail -n 75 gst-cm-curvature.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-cm-curvature.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-graph-information-cm-curvature
          path: |
            gst-graph-information.log
            gst-general-radix.log
            gst-cm-curvature.log
          if-no-files-found: warn
