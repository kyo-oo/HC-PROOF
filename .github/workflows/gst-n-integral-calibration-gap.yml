name: Mathbox N Integral Fixed Homology Calibration Gap
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - GSTNIntegralCalibrationGap.lean
      - .github/workflows/gst-n-integral-calibration-gap.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-n-integral-calibration-gap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-check fixed integer homology rational positivity gap
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTNCalibrationIntegralGap"
          roots = ["waves.GSTNCohomologyV3", "GSTNIntegralCalibrationGap"]
          EOF
          if lake build GSTNCalibrationIntegralGap > gst-n-integrality.log 2>&1; then
            echo "LEAN PASSED: arithmetic integrality gap for fixed-class currents; not a geometric Hodge counterexample"
          else
            grep -nE 'error:|sorryAx|✖' gst-n-integrality.log | tail -n 130 || true
            tail -n 120 gst-n-integrality.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-n-integrality.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-n-integral-gap-log
          path: gst-n-integrality.log
          if-no-files-found: warn
