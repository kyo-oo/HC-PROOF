name: GST Arbitrary Rank Primitive Geometry Detector
on:
  push:
    branches: [research/gpt6-gst-blowup-transfer-20261015]
    paths:
      - GSTBlowupArbitraryRankDetector.lean
      - .github/workflows/gst-blowup-arbitrary-rank-detector.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-blowup-detector-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-detector
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Prove arbitrary finite rational Hodge rank detector
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTBlowupRankDetector"
          roots = ["GSTBlowupArbitraryRankDetector"]
          EOF
          if lake build GSTBlowupRankDetector > gst-rank-detector.log 2>&1; then
            echo "LEAN PASSED: exact independent arbitrary-rank geometry"
          else
            grep -nE 'error:|sorryAx|✖' gst-rank-detector.log | tail -n 150 || true
            tail -n 110 gst-rank-detector.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-rank-detector.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-blowup-arbitrary-rank-detector-log
          path: gst-rank-detector.log
          if-no-files-found: warn
