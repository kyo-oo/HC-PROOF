name: GST Graph V2 CM NM Geometry Upgrade
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - 'GSTGraphV2CMNMPrimitiveUpgrade.lean'
      - 'GSTGraphV2SelfExpandingCosmology.lean'
      - '.github/workflows/gst-graph-v2-cmnm-geometry-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-graph-v2-cmnm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compatible dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-graph-cmnm
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify graph upgrade actual cycle class soundness
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTGraphV2CMNMGeometry"
          roots = ["GSTGraphV2CMNMPrimitiveUpgrade", "GSTGraphV2SelfExpandingCosmology"]
          EOF
          if lake build GSTGraphV2CMNMGeometry > graph-v2-cmnm-lean.log 2>&1; then
            echo "LEAN PASSED: old graph embedded, CM-NM native cycle proved and indexed closure sound"
          else
            grep -nE 'error:|sorryAx|✖' graph-v2-cmnm-lean.log | tail -n 140 || true
            tail -n 95 graph-v2-cmnm-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" graph-v2-cmnm-lean.log; then
            echo "Trust audit failed"
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-graph-v2-cmnm-lean-log
          path: graph-v2-cmnm-lean.log
          if-no-files-found: warn
