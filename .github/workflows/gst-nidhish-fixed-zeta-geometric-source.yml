name: GST Nidhish Fixed Zeta Geometric Source
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTNidhishFixedZetaGeometricSource.lean'
      - '.github/workflows/gst-nidhish-fixed-zeta-geometric-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-nidhish-fixed-zeta-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-native-fixed-zeta
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify fixed zeta native source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "NidhishFixedZetaSource"
          roots = [
            "GSTMathboxCorrectedZetaGeometry",
            "GSTMathboxCorrectedZetaInfinite",
            "GSTNidhishFixedZetaGeometricSource"
          ]
          EOF
          if lake build NidhishFixedZetaSource > fixed-zeta-source-lean.log 2>&1; then
            echo "LEAN PASSED: canonical weight-zero geometric source with fixed analytic coefficient"
          else
            grep -nE 'error:|sorryAx|✖' fixed-zeta-source-lean.log | tail -n 130 || true
            tail -n 95 fixed-zeta-source-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" fixed-zeta-source-lean.log; then
            echo 'Trust audit failed'
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nidhish-fixed-zeta-source-kernel-log
          path: fixed-zeta-source-lean.log
          if-no-files-found: warn
