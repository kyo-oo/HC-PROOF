name: GST Mathbox Corrected Zeta Actual Hodge
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTMathboxCorrectedZetaActualHodge.lean'
      - '.github/workflows/gst-mathbox-corrected-zeta-actual-hodge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-zeta-actual-hodge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-zeta-actual-hodge
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Verify corrected infinite zeta actual geometric Hodge landing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "MathboxZetaActualHodge"
          roots = [
            "GSTMathboxCorrectedZetaGeometry",
            "GSTMathboxCorrectedZetaInfinite",
            "GSTMathboxCorrectedZetaActualHodge"
          ]
          EOF
          if lake build MathboxZetaActualHodge > zeta-actual-hodge-lean.log 2>&1; then
            echo 'LEAN PASSED: corrected infinite zeta and actual geometric Hodge landing'
          else
            grep -nE 'error:|sorryAx|✖' zeta-actual-hodge-lean.log | tail -n 150 || true
            tail -n 100 zeta-actual-hodge-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" zeta-actual-hodge-lean.log; then
            echo "Sorry axiom detected"
            exit 1
          fi
      - name: Upload Lean diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-corrected-zeta-actual-hodge-lean
          path: zeta-actual-hodge-lean.log
          if-no-files-found: warn
