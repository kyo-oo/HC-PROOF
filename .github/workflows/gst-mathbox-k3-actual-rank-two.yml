name: Mathbox Actual K3 Primitive Rank Two Stage2G
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTK3ActualPrimitiveRankTwo.lean
      - .github/workflows/gst-mathbox-k3-actual-rank-two.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-k3-actual-rank-two-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Compile true Stage2G independent primitive cycles
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTK3ActualRankTwo"
          roots = [
            "GSTK3DiagonalPrimitive",
            "GSTK3PrimitiveGram",
            "GSTK3DiagonalActualStage2G",
            "GSTK3ActualPrimitiveRankTwo"
          ]
          EOF
          if lake build GSTK3ActualRankTwo > k3-rank-two-stage2g.log 2>&1; then
            echo 'LEAN PASSED: actual native K3 two independent primitive cycles'
          else
            grep -nE 'error:|sorryAx|✖' k3-rank-two-stage2g.log | tail -n 180 || true
            tail -n 130 k3-rank-two-stage2g.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" k3-rank-two-stage2g.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-mathbox-k3-actual-rank-two-log
          path: k3-rank-two-stage2g.log
          if-no-files-found: warn
