name: GST Hodge - Fold Gauge Moment Rigidity

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTHodgeFoldGaugeMomentRigidity.lean'
      - '.github/workflows/gst-hodge-fold-gauge-moment-rigidity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-hodge-fold-gauge-moment-rigidity
  cancel-in-progress: false

jobs:
  verify:
    name: Kernel check fold gauge and eigen-detector obstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-fold-gauge-unseen
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-fold-gauge-unseen
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Kernel compile GST fold gauge theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTFoldGaugeRigidityLib GSTHodgeFoldGaugeMomentRigidity
          if timeout 9900 lake build GSTHodgeFoldGaugeMomentRigidity > gst-fold-gauge-rigidity.log 2>&1; then
            echo "LEAN PASSED: GSTHodgeFoldGaugeMomentRigidity"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-fold-gauge-rigidity.log | tail -n 100 || true
            tail -n 75 gst-fold-gauge-rigidity.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-fold-gauge-rigidity.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-hodge-fold-gauge-rigidity-lean
          path: gst-fold-gauge-rigidity.log
          if-no-files-found: warn
