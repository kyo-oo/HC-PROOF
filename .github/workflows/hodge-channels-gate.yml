name: Hodge Channels Gate

# Fast verification gate for the multi-channel Hodge architecture integration
# branch.  Builds ONLY the channel architecture modules (and their receipt
# face) so the repair loop never pays for the classical arsenal line.

on:
  push:
    branches:
      - glm53/hodge-clean-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hodge-channels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channels:
    name: Multi-channel Hodge architecture (0 errors)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Restore repository build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hodge-channels-build-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            hodge-channels-build-

      - name: Compile the multi-channel Hodge architecture
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            GSTMultiChannelHodgeCosmology \
            GSTHodgeChannelAddressBridge \
            GSTHodgeChannelMaterialization \
            GSTHodgeChannelRetract \
            GSTHodgeChannelQuotient \
            GSTMathlibFiniteBasis \
            GSTHodgeChannelFiniteBasis \
            GSTHodgeChannelFinale \
            HCProofHodgeChannels 2>&1 | tee hodge-channels.log

      - name: Save repository build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hodge-channels-build-run-${{ github.run_id }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-channels-diagnostics
          path: hodge-channels.log
          if-no-files-found: ignore
