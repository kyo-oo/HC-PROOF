name: GST Universal CM Arithmetic No-Go
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - 'GSTUniversalCMArithmeticObstruction.lean'
      - '.github/workflows/gst-universal-cm-arithmetic-obstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-universal-cm-no-go-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore Lean incremental cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-universal-cm-nogo
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify universal CM and transfer no-go
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTUniversalCMObstruction"
          roots = ["GSTUniversalCMArithmeticObstruction"]
          EOF
          if lake build GSTUniversalCMObstruction > cm-nogo-lean.log 2>&1; then
            echo "LEAN PASSED: CM cannot universally act on Q-line and algebraic transfers preserve cycle-class image"
          else
            grep -nE 'error:|sorryAx|✖' cm-nogo-lean.log | tail -n 130 || true
            tail -n 100 cm-nogo-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" cm-nogo-lean.log; then
            exit 1
          fi
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-cm-obstruction-kernel-log
          path: cm-nogo-lean.log
          if-no-files-found: warn
