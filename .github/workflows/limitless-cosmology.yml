name: Limitless Cosmology Compiler Gate

on:
  push:
    branches:
      - sol/limitless-cosmology
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limitless-cosmology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Lean compile limitless cosmology
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Reject proof escapes in limitless modules
        shell: bash
        run: |
          set -euo pipefail
          files=(LimitlessCosmologySmoke.lean GSTLimitlessCosmology.lean)
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "${files[@]}"; then
            echo LIMITLESS_FORBIDDEN_PROOF_ESCAPE=1
            exit 1
          fi
          echo LIMITLESS_PROOF_ESCAPE_CHECK=PASS

      - name: Apply exact Wave I associativity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('waves/GSTWaveCohomology.lean')
          s = p.read_text()
          old = '      simp [Nat.add_assoc]\n'
          new = '      abel\n'
          count = s.count(old)
          if count == 1:
              p.write_text(s.replace(old, new, 1))
              print('WAVE_I_PATCH=APPLIED')
          elif count == 0 and new in s:
              print('WAVE_I_PATCH=ALREADY_PRESENT')
          else:
              raise SystemExit(f'unexpected Wave I patch state: old_count={count}')
          PY
          git diff --check

      - name: Compile repaired Wave I
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build waves.GSTWaveCohomology 2>&1 | tee limitless-cosmology.log

      - name: Persist verified Wave I repair
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- waves/GSTWaveCohomology.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add waves/GSTWaveCohomology.lean
            git commit -m "fix: make Wave I cocycle associativity type-correct"
            git push origin HEAD:sol/limitless-cosmology
          else
            echo WAVE_I_SOURCE_ALREADY_VERIFIED=1
          fi

      - name: Compile limitless module
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTLimitlessCosmology 2>&1 | tee -a limitless-cosmology.log

      - name: Compile limitless smoke
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean LimitlessCosmologySmoke.lean 2>&1 | tee -a limitless-cosmology.log

      - name: Compile migrated core modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTWorldCosmology GSTCoherentCosmology GSTInfiniteWorldClassification 2>&1 | tee -a limitless-cosmology.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-cosmology-diagnostics
          path: limitless-cosmology.log
          if-no-files-found: ignore
