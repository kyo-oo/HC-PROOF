name: GST limitless cosmos compact-window topology

on:
  push:
    branches:
      - research/gpt6-gst-cardinal-intent-reconstruction-20261110
    paths:
      - 'GSTCardinalTopologicalFiniteWindowLanding.lean'
      - '.github/workflows/gst-cardinal-compact-window-topology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-compact-topology
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Setup Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel check original limitless GST finite-window source density
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTCardinalCompactWindowLib GSTCardinalTopologicalFiniteWindowLanding
          if timeout 6500 lake build GSTCardinalTopologicalFiniteWindowLanding > gst-compact-topology.log 2>&1; then
            echo "LEAN PASSED: GSTCardinalTopologicalFiniteWindowLanding"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-compact-topology.log | tail -n 120 || true
            tail -n 100 gst-compact-topology.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-compact-topology.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Save kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-compact-topology-lean
          path: gst-compact-topology.log
          if-no-files-found: warn
