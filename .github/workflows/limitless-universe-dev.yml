name: Limitless Universe Dev Gate

on:
  push:
    branches:
      - sol/limitless-universe-repo-upgrade
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - '.github/workflows/limitless-universe-dev.yml'

permissions:
  contents: read

concurrency:
  group: limitless-universe-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-dev:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Reject proof escapes in limitless foundations
        shell: bash
        run: |
          set -euo pipefail
          files=(GSTLimitlessWorld.lean GSTWorldCosmology.lean)
          existing=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] && existing+=("$f")
          done
          if ((${#existing[@]})) && grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "${existing[@]}"; then
            exit 1
          fi
      - name: Compile limitless foundation probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTWorldCosmology
          if [[ -f GSTLimitlessWorld.lean ]]; then
            lake env lean GSTLimitlessWorld.lean
          fi
