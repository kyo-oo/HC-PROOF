name: GST Geometric Orbit Synthesis
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTResearchGeometricOrbitSynthesis.lean'
      - '.github/workflows/gst-research-geometric-orbit-synthesis.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-research-native-orbit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore Lean incremental cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-research-orbit
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Verify native geometric orbit synthesis
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "ResearchGeometricOrbit"
          roots = ["GSTResearchGeometricOrbitSynthesis"]
          EOF
          if lake build ResearchGeometricOrbit > research-orbit-lean.log 2>&1; then
            echo "LEAN PASSED: inductive native correspondence-word orbit and Hodge generation"
          else
            grep -nE 'error:|sorryAx|✖' research-orbit-lean.log | tail -n 130 || true
            tail -n 105 research-orbit-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" research-orbit-lean.log; then
            echo "Trust audit failure"
            exit 1
          fi
      - name: Upload Lean compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-geometric-orbit-kernel-log
          path: research-orbit-lean.log
          if-no-files-found: warn
