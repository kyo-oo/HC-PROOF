name: Mathbox GST All N Channel Integer Calibration
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
    paths:
      - GSTNAllChannelAmpleSaturation.lean
      - .github/workflows/gst-n-all-channel-integral-calibration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-n-all-channel-saturation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify explicit all-N integral shifted sequence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTAllNCalibratedIntegers"
          roots = [
            "waves.GSTNCohomologyV3",
            "GSTNAllChannelAmpleSaturation"
          ]
          EOF
          if lake build GSTAllNCalibratedIntegers > gst-n-all-channel.log 2>&1; then
            echo "LEAN PASSED: all-N integer shifted calibrated sequence IN THE CHANNEL MODEL ONLY"
          else
            grep -nE 'error:|sorryAx|✖' gst-n-all-channel.log | tail -n 150 || true
            tail -n 180 gst-n-all-channel.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-n-all-channel.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-all-n-integral-calibration-log
          path: gst-n-all-channel.log
          if-no-files-found: warn
