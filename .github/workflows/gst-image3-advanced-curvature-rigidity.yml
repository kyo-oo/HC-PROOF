name: GST Image3 advanced CM curvature rigidity, resonance and geometric gates
on:
  push:
    branches:
      - research/gpt6-image3-advanced-curvature-rigidity-20261111
    paths:
      - 'GSTImageThreeCurvatureResonance.lean'
      - 'GSTImageThreeOriginalXCurvatureLanding.lean'
      - 'GSTImageThreeAdvancedGeometricSource.lean'
      - 'GSTImageThreeFiniteFieldSourceCertificates.lean'
      - 'GSTImageThreeNavigationOffSourceCertificates.lean'
      - 'GSTImageThreeIndependentNCohoSource.lean'
      - 'GSTImageThreePhysicalNavigationControl.lean'
      - 'GSTImageThreePhysicalNCohoFusion.lean'
      - 'GSTImageThreeAdvancedResearchKernel.lean'
      - '.github/workflows/gst-image3-advanced-curvature-rigidity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Prepare pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-check advanced original Image3 CM curvature and original-X source algebra
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          # One dependency root: the advanced source imports the original-X
          # curvature landing, which imports the native resonance module.
          # Running the root generator repeatedly appends duplicate lake_lib
          # targets to lakefile.toml and causes an unrelated CI failure.
          python3 scripts/gst_lean_dependency_roots.py GSTCMResonanceLib GSTImageThreeAdvancedResearchKernel
          lake build GSTImageThreeAdvancedResearchKernel > gst-advanced-curvature.log 2>&1 || { tail -n 180 gst-advanced-curvature.log; exit 1; }
          if grep -E "declaration uses 'sorry'|sorryAx" gst-advanced-curvature.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
          echo "LEAN PASSED: advanced GST Image3 CM native source + actual geometric source algebra"
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-image3-advanced-curvature-lean
          path: gst-advanced-curvature.log
          if-no-files-found: warn
