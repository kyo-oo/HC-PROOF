name: GST Geometric Spine Semantic Countermodel

on:
  push:
    branches:
      - research/gpt6-gst-native-rank-one-realization-20261014
    paths:
      - 'GSTClassicalHodgeGeometricSpineSemanticCountermodel.lean'
      - '.github/workflows/gst-geometric-spine-semantic-countermodel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-spine-semantic-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-semantic-audit
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify geometric semantic consistency countermodel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "GSTGeometricSpineCountermodelVerification"
          roots = ["GSTClassicalHodgeGeometricSpineSemanticCountermodel"]
          EOF
          if lake build GSTGeometricSpineCountermodelVerification > countermodel-lean.log 2>&1; then
            echo 'LEAN PASSED: strict GST geometric spine semantic countermodel'
          else
            echo 'LEAN FAILED: strict GST geometric spine semantic countermodel'
            grep -nE 'error:|sorryAx|✖' countermodel-lean.log | tail -n 100 || true
            tail -n 60 countermodel-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" countermodel-lean.log; then
            echo 'Trust audit failure'
            exit 1
          fi
      - name: Save compiled GST dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-semantic-audit
      - name: Upload proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-geometric-spine-semantic-countermodel-log
          path: countermodel-lean.log
          if-no-files-found: warn
