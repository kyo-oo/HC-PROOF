name: Universal Limitless Cycle Geometry Gate

on:
  push:
    branches:
      - sol/hodge-single-separator-successor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-limitless-cycle-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-limitless-cycle-geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Restore compiled project modules
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: universal-cycle-lean433-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            universal-cycle-lean433-${{ runner.os }}-

      - name: Build theorem dependency closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClassicalHodgeGeometricCycleClassSpine GSTClassicalHodgeProjectiveDegreeSemantics GSTClassicalHodgeUniversalTwoSlotNativeClosure 2>&1 | tee universal-limitless-cycle-geometry.log

      - name: Compile universal limitless cycle geometry theorem
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClassicalHodgeUniversalLimitlessCycleGeometry 2>&1 | tee -a universal-limitless-cycle-geometry.log

      - name: Compile universal limitless cycle geometry finale
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClassicalHodgeUniversalLimitlessCycleGeometryFinale 2>&1 | tee -a universal-limitless-cycle-geometry.log

      - name: Build first-ghost transpose dependency closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClassicalHodgeFirstGhostTransposeModAtomicClosure GSTClassicalHodgeFirstGhostCorrespondenceFrontier 2>&1 | tee -a universal-limitless-cycle-geometry.log

      - name: Compile universal first-ghost transpose closure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeUniversalFirstGhostTransposeClosure.lean 2>&1 | tee -a universal-limitless-cycle-geometry.log

      - name: Trust audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "declaration uses 'sorry'|sorryAx" universal-limitless-cycle-geometry.log; then
            echo "UNIVERSAL LIMITLESS CYCLE GEOMETRY GATE FAILED: unresolved sorry/sorryAx detected"
            exit 1
          fi
          echo "UNIVERSAL LIMITLESS CYCLE GEOMETRY GATE: no sorry/sorryAx detected"

      - name: Save compiled project modules
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: universal-cycle-lean433-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-limitless-cycle-geometry-diagnostics
          path: universal-limitless-cycle-geometry.log
          if-no-files-found: ignore
