name: GST Weil Fourfold Extraction Arithmetic
on:
  push:
    branches:
      - mathbox/residual-zero-direct-audit-20261015
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - GSTWeilFourfoldAuxiliaryExtraction.lean
      - .github/workflows/gst-weil-fourfold-extraction.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-weil-fourfold-extraction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel check exact extraction and fourth-power arithmetic
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake env lean GSTWeilFourfoldAuxiliaryExtraction.lean > gst-weil-fourfold-extraction.log 2>&1; then
            echo "LEAN PASSED: arithmetic only; sixfold geometry remains an external input"
          else
            cat gst-weil-fourfold-extraction.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-weil-fourfold-extraction.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-weil-fourfold-extraction-arithmetic
          path: gst-weil-fourfold-extraction.log
          if-no-files-found: warn
