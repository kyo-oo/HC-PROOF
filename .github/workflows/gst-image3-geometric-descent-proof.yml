name: GST Image 3 geometric descent and two-mode original-X detector audit

on:
  push:
    branches:
      - research/gpt6-gst-image3-geometric-descent-20261111
    paths:
      - 'GSTImageThreeCMDescentFirewall.lean'
      - 'GSTImageThreeAllRectangularCMStar.lean'
      - 'GSTImageThreeOwnerPolynomialFold.lean'
      - 'GSTImageThreeRealizedWordGeometry.lean'
      - 'GSTImageThreeTwoModeGeometricBirth.lean'
      - '.github/workflows/gst-image3-geometric-descent-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore installed Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-image3-desc
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Setup pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-check original CM rank-one no-go, true closed-correspondence F and two-birth determinant
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTImage3GeomDescentLib \
            GSTImageThreeCMDescentFirewall \
            GSTImageThreeAllRectangularCMStar \
            GSTImageThreeOwnerPolynomialFold \
            GSTImageThreeRealizedWordGeometry \
            GSTImageThreeTwoModeGeometricBirth
          if timeout 6800 lake build GSTImageThreeCMDescentFirewall \
              GSTImageThreeAllRectangularCMStar \
              GSTImageThreeOwnerPolynomialFold \
              GSTImageThreeRealizedWordGeometry \
              GSTImageThreeTwoModeGeometricBirth \
              > gst-image3-geometric-descent.log 2>&1; then
            echo "LEAN PASSED: GST Image-3 geometric descent, genuine Chow correspondence word, two-mode birth"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-image3-geometric-descent.log | tail -n 120 || true
            tail -n 170 gst-image3-geometric-descent.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-image3-geometric-descent.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-image3-geometric-descent-lean
          path: gst-image3-geometric-descent.log
          if-no-files-found: warn
