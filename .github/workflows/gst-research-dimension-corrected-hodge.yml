name: GST Dimension-Corrected Hodge Synthesis
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTResearchDimensionCorrectedHodgeSynthesis.lean'
      - 'GSTResearchFiniteWeightGeometricDegree.lean'
      - 'GSTResearchUniversalOrbitClosureLaw.lean'
      - '.github/workflows/gst-research-dimension-corrected-hodge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-research-dimension-hodge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-dim-corrected
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify dimension-corrected geometric Hodge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "ResearchDimensionCorrectedHodge"
          roots = [
            "GSTResearchGeometricOrbitSynthesis",
            "GSTResearchUniversalOrbitClosureLaw",
            "GSTResearchFiniteWeightGeometricDegree",
            "GSTResearchDimensionCorrectedHodgeSynthesis"
          ]
          EOF
          if lake build ResearchDimensionCorrectedHodge > dimension-corrected-hodge-lean.log 2>&1; then
            echo "LEAN PASSED: dimension-bounded actual geometric native orbit Hodge theorem"
          else
            grep -nE 'error:|sorryAx|✖' dimension-corrected-hodge-lean.log | tail -n 120 || true
            tail -n 100 dimension-corrected-hodge-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" dimension-corrected-hodge-lean.log; then
            echo "Trust audit failure"
            exit 1
          fi
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-dimension-corrected-hodge-kernel-log
          path: dimension-corrected-hodge-lean.log
          if-no-files-found: warn
