name: SOL Cohomology Faithfulness Gate

on:
  push:
    branches:
      - 'sol/cohomology-faithfulness'
    paths:
      - 'GSTTruncatedWorldCohomologyFaithful.lean'
      - '.github/workflows/sol-cohomology-faithfulness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-cohomology-faithfulness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  faithful-normal-form:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' GSTTruncatedWorldCohomologyFaithful.lean; then
            exit 1
          fi
      - name: Compile faithfulness normal form
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTTruncatedWorldCohomologyFaithful.lean 2>&1 | tee sol-cohomology-faithfulness.log
          if grep -Fq 'sorryAx' sol-cohomology-faithfulness.log; then
            exit 1
          fi
