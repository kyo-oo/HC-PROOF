name: GST Native K0 Original X Extraction
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTUniversalResolvedSupportHodge.lean'
      - '.github/workflows/gst-native-k0-original-x-extraction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-native-k0-original-x-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-native-k0
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel compile universal finite flat algebraic K0 primitive source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTOriginalXK0Source GSTUniversalResolvedSupportHodge
          if lake build GSTOriginalXK0Source > native-k0-original-x-lean.log 2>&1; then
            echo "LEAN PASSED: normalized actual-original-X K0 trace kernel source extraction"
          else
            grep -nE 'error:|sorryAx|✖' native-k0-original-x-lean.log | tail -n 140 || true
            tail -n 100 native-k0-original-x-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" native-k0-original-x-lean.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-native-k0-original-x-lean
          path: native-k0-original-x-lean.log
          if-no-files-found: warn
