name: GST Noncellular Blowup Hodge Transfer
on:
  push:
    branches:
      - research/gpt6-gst-blowup-transfer-20261015
    paths:
      - 'GSTBlowupHodgeTransfer.lean'
      - 'GSTBlowupHodgeAllCodimension.lean'
      - '.github/workflows/gst-blowup-hodge-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-blowup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and retrieve Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore incremental build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-blowup
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel-check codimension-three noncellular blow-up construction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTBlowupTransfer"
          roots = ["GSTBlowupHodgeTransfer", "GSTBlowupHodgeAllCodimension"]
          EOF
          if lake build GSTBlowupTransfer > gst-blowup-lean.log 2>&1; then
            echo "LEAN PASSED: all-codimension finite-summand and three-source Hodge blow-up transfer"
          else
            grep -nE 'error:|sorryAx|✖' gst-blowup-lean.log | tail -n 130 || true
            tail -n 110 gst-blowup-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-blowup-lean.log; then
            exit 1
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-blowup-hodge-transfer-lean-log
          path: gst-blowup-lean.log
          if-no-files-found: warn
