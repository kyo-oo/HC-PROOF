name: Hodge Upgraded-History Focused Gate

on:
  push:
    branches:
      - clean/upgraded-advanced-only-20261009
    paths:
      - '.github/workflows/hodge-upgraded-history-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hodge-upgraded-history-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-upgraded-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard: 0
            targets: |
              GSTClassicalHodgeCanonicalCutSpineNormalization
              GSTClassicalHodgeGhostIndexedCriterionCircularity
              GSTClassicalHodgeHandwrittenPiExplicitNativeCollapse
          - shard: 1
            targets: |
              GSTClassicalHodgeHandwrittenPiProgramLanding
              GSTClassicalHodgeOmniversePointStrictRelationFinale
              GSTClassicalHodgePiOneObservableOmniverseFinale
          - shard: 2
            targets: |
              GSTClassicalHodgePiPointFiniteCorrespondenceUltimateFinale
              GSTClassicalHodgePiPointRationalCorrespondenceUnboundedFinale
              GSTClassicalHodgePiPointTwoGeneratorUnboundedFinale
          - shard: 3
            targets: |
              GSTClassicalHodgePiSpineMassUnboundedFinale
              GSTClassicalHodgePiSpineTwoGeneratorUnboundedFinale
              GSTClassicalHodgePiStrictKernelCyclicOmniverseFinale
          - shard: 4
            targets: |
              GSTClassicalHodgePiStrictTraceCyclicOmniverseFinale
              GSTClassicalHodgePointClosureIntegral
              GSTClassicalHodgeRadicalPrincipalCutDimension
          - shard: 5
            targets: |
              GSTClassicalHodgeSheetSiegeRoute
              GSTClassicalHodgeStrictBettiApexL2Fusion
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile upgraded-history root shard
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build $TARGETS 2>&1 | tee "hodge-upgraded-history-${{ matrix.shard }}.log"
      - name: Publish upgraded-history diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-upgraded-history-${{ matrix.shard }}
          path: hodge-upgraded-history-${{ matrix.shard }}.log
          if-no-files-found: warn
