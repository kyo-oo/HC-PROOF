name: GST Universal Fourfold Primitive Extraction
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTUniversalFourfoldPrimitiveExtraction.lean'
      - 'GSTUniversalPrimitiveDivisorConstruction.lean'
      - '.github/workflows/gst-universal-fourfold-primitive-extraction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-fourfold-primitive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-fourfold-primitive
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify native fourfold primitive projector and algebraic correction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTUniversalFourfoldPrimitive"
          roots = [
            "GSTUniversalLefschetzCurveCycles",
            "GSTClassicalHodgeGeometricMatrixRankLanding",
            "GSTUniversalPrimitiveDivisorConstruction",
            "GSTUniversalFourfoldPrimitiveExtraction"
          ]
          EOF
          if lake build GSTUniversalFourfoldPrimitive > fourfold-primitive-lean.log 2>&1; then
            echo "LEAN PASSED: constructive native primitive projector and exact algebraic Lefschetz correction"
          else
            grep -nE 'error:|sorryAx|✖' fourfold-primitive-lean.log | tail -n 140 || true
            tail -n 105 fourfold-primitive-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" fourfold-primitive-lean.log; then
            echo "Trust audit failed"
            exit 1
          fi
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-universal-fourfold-primitive-log
          path: fourfold-primitive-lean.log
          if-no-files-found: warn
