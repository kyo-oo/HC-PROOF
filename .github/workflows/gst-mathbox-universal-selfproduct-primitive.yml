name: Mathbox Universal Self Product Primitive Every Variety
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTUniversalSelfProductPrimitive.lean
      - .github/workflows/gst-mathbox-universal-selfproduct-primitive.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-selfproduct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-check uniform all-dimension geometric selfproduct identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTAllVarietySelfProductPrimitive"
          roots = ["GSTUniversalSelfProductPrimitive"]
          EOF
          if lake build GSTAllVarietySelfProductPrimitive > gst-selfproduct.log 2>&1; then
            echo 'LEAN PASSED: arbitrary dimension universal algebraic selfproduct primitive'
          else
            grep -nE 'error:|sorryAx|✖' gst-selfproduct.log | tail -n 140 || true
            tail -n 125 gst-selfproduct.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-selfproduct.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-all-variety-selfproduct-primitive-log
          path: gst-selfproduct.log
          if-no-files-found: warn
