name: Mathbox Universal Hodge Residual Projection
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTUniversalHodgeResidualProjection.lean
      - .github/workflows/gst-mathbox-universal-hodge-projection.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-hodge-residual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean with Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Prove target Hodge native projection plus residual
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTHodgeResidualProjection"
          roots = ["GSTUniversalHodgeResidualProjection"]
          EOF
          if lake build GSTHodgeResidualProjection > gst-residual.log 2>&1; then
            echo "LEAN PASSED: genuine cycle projection and exact residual"
          else
            grep -nE 'error:|sorryAx|✖' gst-residual.log | tail -n 110 || true
            tail -n 120 gst-residual.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-residual.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-all-hodge-residual-projection-lean
          path: gst-residual.log
          if-no-files-found: warn
