name: Mathbox Residual Zero Logical Countermodel
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTResidualZeroLogicalCountermodel.lean
      - .github/workflows/gst-residual-zero-model.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-residual-zero-model-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify exact rational linear-algebra model
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTResidualZeroModel"
          roots = [
            "GSTUniversalHodgeResidualProjection",
            "GSTResidualZeroLogicalCountermodel"
          ]
          EOF
          if lake build GSTResidualZeroModel > gst-residual-model.log 2>&1; then
            echo "LEAN PASSED: dual-cycle projection admits positive nonzero residual without actual X geometry"
          else
            grep -nE 'error:|sorryAx|✖' gst-residual-model.log | tail -n 150 || true
            tail -n 140 gst-residual-model.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-residual-model.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-residual-zero-logical-countermodel-log
          path: gst-residual-model.log
          if-no-files-found: warn
