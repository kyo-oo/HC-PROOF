name: GST Exact X and Self Product Hodge Equivalence
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTUniversalSelfProductHodgeEquivalence.lean
      - .github/workflows/gst-x-selfproduct-hodge-equivalence.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-x-selfproduct-equivalence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel verify exact target X self-product Hodge cycle equivalence
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTExactXProductEquivalence"
          roots = [
            "GSTUniversalChowRetractToTarget",
            "GSTUniversalSelfProductHodgeEquivalence"
          ]
          EOF
          if lake build GSTExactXProductEquivalence > gst-product-equiv.log 2>&1; then
            echo "LEAN PASSED: genuine rational cycle on X iff marked section on X product algebraic"
          else
            grep -nE 'error:|sorryAx|✖' gst-product-equiv.log | tail -n 145 || true
            tail -n 130 gst-product-equiv.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-product-equiv.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-x-selfproduct-hodge-equivalence-log
          path: gst-product-equiv.log
          if-no-files-found: warn
