name: GST Number Manipulation Exact Kernel
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTNumberManipulationExactKernel.lean'
      - '.github/workflows/gst-number-manipulation-exact-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-number-manipulation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore incremental cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-number-manipulation
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify exact Number Manipulation law
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTNumberManipulation"
          roots = [
            "GSTMathboxCorrectedZetaGeometry",
            "GSTMathboxCorrectedZetaSafeDomain",
            "GSTNumberManipulationExactKernel"
          ]
          EOF
          if lake build GSTNumberManipulation > nm-exact-kernel-lean.log 2>&1; then
            echo "LEAN PASSED: exact all-index rational manipulation and finite corrected zeta sum"
          else
            grep -nE 'error:|sorryAx|✖' nm-exact-kernel-lean.log | tail -n 130 || true
            tail -n 90 nm-exact-kernel-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" nm-exact-kernel-lean.log; then
            echo "Lean trust audit failure"
            exit 1
          fi
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-number-manipulation-kernel-log
          path: nm-exact-kernel-lean.log
          if-no-files-found: warn
