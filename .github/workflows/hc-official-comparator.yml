name: HC Official Comparator and Absorption Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hc-universe-v5-comparator:
    name: The universe comparator (0 errors, 0 sorries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify committed tree hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo 'HC_FULL_WORKFLOW_COMMITTED_TREE_CLEAN=1'

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Run the official V5 comparator on the HC universe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/comparator.sh | tee hc-v5-comparator.log
          grep -Fq 'Your solution is okay!' hc-v5-comparator.log
          grep -Fq '=== COMPARATOR RESULT: PASS ===' hc-v5-comparator.log
          echo HC_V5_LITERAL_PASS_CONFIRMED=1

      - name: Upload comparator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-v5-comparator-diagnostics
          path: hc-v5-comparator.log
          if-no-files-found: ignore

  problem406-challenge-solution-harness:
    name: Problem 406 harness (challenge, solution, axioms)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Validate DeepMind Problem 406 challenge and solution files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          challenge = Path('questions/deepmind_problem_406/Challenge.lean').read_text(encoding='utf-8')
          solution = Path('questions/deepmind_problem_406/Solution.lean').read_text(encoding='utf-8')

          if 'theorem erdos_ternary_2' not in challenge:
              raise SystemExit('challenge is not the DeepMind/Erdos 406 theorem surface')
          if re.search(r'^\s*sorry\s*$', challenge, re.M) is None:
              raise SystemExit('challenge must keep exactly the intentional question-side sorry')
          if 'import MonolithBoundary' not in solution:
              raise SystemExit('solution does not import the HC universe boundary')
          forbidden_solution = []
          for i, line in enumerate(solution.splitlines(), 1):
              if line.lstrip().startswith('--'):
                  continue
              if re.search(r'\bsorry\b|\badmit\b|\baxiom\b|\bnative_decide\b', line):
                  forbidden_solution.append(f'{i}:{line}')
          if forbidden_solution:
              print('\n'.join(forbidden_solution))
              raise SystemExit('solution contains forbidden proof escape')
          print('PROBLEM406_CHALLENGE_AND_SOLUTION_SURFACE_VALID=1')
          PY

      - name: Build universe and Problem 406 solution file
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
          lake env lean questions/deepmind_problem_406/Solution.lean
          echo PROBLEM406_CHALLENGE_SOLUTION_BUILD_GREEN=1

      - name: Kernel axiom report for the universe crown objects
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > Problem406SolutionAxiomReport.lean <<'EOF'
          import MonolithBoundary
          import CardinalWorlds
          set_option maxHeartbeats 0
          set_option maxRecDepth 1000000
          #print axioms noTernaryDigitTwo_eq_noTernaryTwo
          #print axioms erdos_ternary_2_of_boundaries
          #print axioms CardinalWorlds.d_identity
          #print axioms CardinalWorlds.bridge_sig_even
          #print axioms CardinalWorlds.modular_check_base
          EOF
          lake env lean Problem406SolutionAxiomReport.lean 2>&1 | tee problem406-solution-axioms.log
          if grep -Fq 'sorryAx' problem406-solution-axioms.log; then
            echo PROBLEM406_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo PROBLEM406_AXIOM_REPORT_COMPLETED=1

      - name: Upload harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem406-challenge-solution-diagnostics
          path: |
            Problem406SolutionAxiomReport.lean
            problem406-solution-axioms.log
          if-no-files-found: ignore

  hc-absorption-gate:
    name: The absorption gate (HodgeDeRhamBridge)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install exact Lean RC2 and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Build the absorption layer
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build HodgeDeRhamBridge
          echo HC_ABSORPTION_BUILD_GREEN=1

      - name: Kernel axiom report for the absorption theorems
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > HCAbsorptionAxiomReport.lean <<'EOF'
          import HodgeDeRhamBridge
          set_option maxHeartbeats 0
          set_option maxRecDepth 1000000
          #print axioms HodgeDeRhamBridge.mixed_period_exact
          #print axioms HodgeDeRhamBridge.deRham_betti_comparison_finite
          #print axioms HodgeDeRhamBridge.finite_twist_skew
          #print axioms HodgeDeRhamBridge.finite_twist_skew_truncated
          #print axioms HodgeDeRhamBridge.deRham_twist_isometry
          #print axioms HodgeDeRhamBridge.signature_sector_exact
          #print axioms HodgeDeRhamBridge.finite_hodge_characterization
          #print axioms HodgeDeRhamBridge.signature_sector_injects_current
          #print axioms HodgeDeRhamBridge.the_finite_hodge_table
          #print axioms HodgeDeRhamBridge.period_ladder_base
          #print axioms HodgeDeRhamBridge.period_rebase
          #print axioms HodgeDeRhamBridge.forward_window_of_happy_source
          EOF
          lake env lean HCAbsorptionAxiomReport.lean 2>&1 | tee hc-absorption-axioms.log
          if grep -Fq 'sorryAx' hc-absorption-axioms.log; then
            echo HC_ABSORPTION_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo HC_ABSORPTION_AXIOM_REPORT_COMPLETED=1

      - name: Upload absorption diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-absorption-axiom-diagnostics
          path: |
            HCAbsorptionAxiomReport.lean
            hc-absorption-axioms.log
          if-no-files-found: ignore
