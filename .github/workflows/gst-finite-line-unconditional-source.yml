name: GST Finite Line Unconditional Source

on:
  push:
    branches:
      - main
      - research/gpt6-gst-hypothesis-part1-chow-square-20261110
    paths:
      - 'GSTFiniteLineWorldDischarge.lean'
      - 'GSTFiniteLineOverBase.lean'
      - 'GSTFiniteLineSmoothness.lean'
      - 'GSTFiniteLineClosedImmersion.lean'
      - 'GSTFiniteLineWorldCarrier.lean'
      - 'GSTFiniteLineRing.lean'
      - 'GSTProjectiveOverC.lean'
      - 'GSTFiniteLineUnconditionalSource.lean'
      - 'GSTFiniteLineCycleCorrespondence.lean'
      - 'GSTFiniteLineHonestHodgeData.lean'
      - 'GSTFiniteLinePointAlgebra.lean'
      - 'GSTFiniteLineAnalytification.lean'
      - 'GSTFiniteLineRiemann.lean'
      - 'GSTGeometricRealizationStage2F.lean'
      - 'GSTCompleteSingleFoldOrbitLaw.lean'
      - 'GSTHodgeSingleHypothesisConditional.lean'
      - 'GSTFiniteLineGeneralMLaw.lean'
      - 'GSTFiniteLineCycleCorrespondenceBasic.lean'
      - 'GSTFiniteLineCycleCorrespondenceAction.lean'
      - 'GSTFiniteLineCycleCorrespondenceOperators.lean'
      - 'GSTFiniteLinePointsGateCoreBasic.lean'
      - 'GSTFiniteLinePointsGateCoreTransport.lean'
      - 'GSTFiniteLinePointsGateDischargeBridges.lean'
      - 'GSTFiniteLinePointsGateDischargeInverseA.lean'
      - 'GSTFiniteLinePointsGateDischargeInverseB.lean'
      - 'GSTFiniteLinePrimitiveXSourceFamilies.lean'
      - '.github/workflows/gst-finite-line-unconditional-source.yml'
      - 'lakefile.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-finite-line-unconditional-source
  cancel-in-progress: false

jobs:
  verify:
    name: "Kernel check the unconditional-source module (THE UNCONDITIONAL LAW + universal primitive-X source)"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-finite-line-closed-immersion
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            ELAN_TAG="v4.2.4"
            ELAN_ASSET="elan-x86_64-unknown-linux-gnu.tar.gz"
            ELAN_TMP="$(mktemp -d)"
            ELAN_SRC=""
            for url in \
              "https://github.com/leanprover/elan/releases/download/${ELAN_TAG}/${ELAN_ASSET}" \
              "https://github.com/leanprover/elan/releases/latest/download/${ELAN_ASSET}"; do
              for attempt in 1 2 3; do
                echo "elan fetch: attempt ${attempt}/3 via ${url}"
                if curl -sSfL --connect-timeout 30 -o "${ELAN_TMP}/${ELAN_ASSET}" "$url"; then
                  ELAN_SRC="$url"
                  break 2
                fi
                echo "elan fetch failed via ${url}; sleeping 10s before retry" >&2
                sleep 10
              done
            done
            if [ -z "$ELAN_SRC" ]; then
              echo "FATAL: elan installer download failed on every mirror and attempt" >&2
              exit 1
            fi
            echo "elan installer fetched from ${ELAN_SRC}"
            tar -xzf "${ELAN_TMP}/${ELAN_ASSET}" -C "${ELAN_TMP}"
            chmod u+x "${ELAN_TMP}/elan-init"
            "${ELAN_TMP}/elan-init" -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-general-M-law
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: "Ladder 0: the replay warmup (pay the corpus-validation tax in its own window)"
        id: p0
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineRing >> gst-finite-line-unconditional-source.log 2>&1; then
            if [ -f ".lake/build/lib/GSTFiniteLineRing.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineRing.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "WARMUP compiled Ring fresh — banking"
            else
              echo "WARMUP replayed the universe clean — the piece steps get warm windows"
            fi
          else
            rc=$?
            pkill -KILL -x lean 2>/dev/null || true
            if [ "$rc" -eq 124 ]; then
            touch .ladder-stop
            echo "WARMUP timed out (the corpus re-validation on a slow runner) — ladder stopped; the rider re-dispatches"
            else
            touch .ladder-stop .ladder-error
            echo "::error::COMPILE ERROR (exit $rc) — deterministic; the rider must NOT re-dispatch without a fix"
            echo "--- the Lean error tail (grep) ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" gst-finite-line-unconditional-source.log | tail -n 25 || true
            exit 1
            fi
          fi
      - name: "Bank after warmup"
        if: always() && steps.p0.outputs.dirty == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p0
      - name: "Ladder 1/5: GSTFiniteLineCycleCorrespondenceBasic"
        id: p1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f .ladder-stop ]; then echo "LADDER 1: stopped (an earlier piece timed out) — skip"; exit 0; fi
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineCycleCorrespondenceBasic >> gst-finite-line-unconditional-source.log 2>&1; then
            if [ -f ".lake/build/lib/GSTFiniteLineCycleCorrespondenceBasic.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineCycleCorrespondenceBasic.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "LADDER PIECE 1 COMPILED FRESH — banking"
            else
              echo "LADDER PIECE 1 already banked — replay only"
            fi
          else
            rc=$?
            pkill -KILL -x lean 2>/dev/null || true
            if [ "$rc" -eq 124 ]; then
            touch .ladder-stop
            echo "LADDER PIECE 1 timed out — orphans killed, ladder stopped (the rider re-dispatches; the bank keeps every earlier piece)"
            else
            touch .ladder-stop .ladder-error
