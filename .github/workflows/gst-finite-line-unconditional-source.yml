            if [ -f ".lake/build/lib/GSTFiniteLineCycleCorrespondenceOperators.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineCycleCorrespondenceOperators.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "LADDER PIECE 3 COMPILED FRESH — banking"
            else
              echo "LADDER PIECE 3 already banked — replay only"
            fi
          else
            rc=$?
            pkill -KILL -x lean 2>/dev/null || true
            if [ "$rc" -eq 124 ]; then
            touch .ladder-stop
            echo "LADDER PIECE 3 timed out — orphans killed, ladder stopped (the rider re-dispatches; the bank keeps every earlier piece)"
            else
            touch .ladder-stop .ladder-error
            echo "::error::COMPILE ERROR (exit $rc) — deterministic; the rider must NOT re-dispatch without a fix"
            echo "--- the Lean error tail (grep) ---"
            grep -nE "error:|unknown identifier|unknown constant|declaration uses" gst-finite-line-unconditional-source.log | tail -n 25 || true
            exit 1
            fi
          fi
      - name: "Bank after ladder 3"
        if: always() && steps.p3.outputs.dirty == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p3
      - name: "Ladder 4/5: GSTFiniteLineCycleCorrespondence"
        id: p4
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f .ladder-stop ]; then echo "LADDER 4: stopped (an earlier piece timed out) — skip"; exit 0; fi
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineCycleCorrespondence >> gst-finite-line-unconditional-source.log 2>&1; then
            if [ -f ".lake/build/lib/GSTFiniteLineCycleCorrespondence.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineCycleCorrespondence.olean)" -ge "$BEFORE" ]; then
