        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f .ladder-stop ]; then echo "LADDER 5: stopped (an earlier piece timed out) — skip"; exit 0; fi
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineUnconditionalSource >> gst-finite-line-unconditional-source.log 2>&1; then
            if [ -f ".lake/build/lib/GSTFiniteLineUnconditionalSource.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineUnconditionalSource.olean)" -ge "$BEFORE" ]; then
