        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p1
      - name: "Ladder 2/5: GSTFiniteLineCycleCorrespondenceAction"
