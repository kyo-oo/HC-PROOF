name: GST Finite Line Unconditional Source

on:
  push:
    branches:
      - main
      - research/gpt6-gst-hypothesis-part1-chow-square-20261110
    paths:
      - 'GSTFiniteLineWorldDischarge.lean'
      - 'GSTFiniteLineOverBase.lean'
      - 'GSTFiniteLineSmoothness.lean'
      - 'GSTFiniteLineClosedImmersion.lean'
      - 'GSTFiniteLineWorldCarrier.lean'
      - 'GSTFiniteLineRing.lean'
      - 'GSTProjectiveOverC.lean'
      - 'GSTFiniteLineUnconditionalSource.lean'
      - 'GSTFiniteLineCycleCorrespondence.lean'
      - 'GSTFiniteLineHonestHodgeData.lean'
      - 'GSTFiniteLinePointAlgebra.lean'
      - 'GSTFiniteLineAnalytification.lean'
      - 'GSTFiniteLineRiemann.lean'
      - 'GSTGeometricRealizationStage2F.lean'
      - 'GSTCompleteSingleFoldOrbitLaw.lean'
      - 'GSTHodgeSingleHypothesisConditional.lean'
      - 'GSTFiniteLineGeneralMLaw.lean'
      - 'GSTFiniteLineCycleCorrespondenceBasic.lean'
      - 'GSTFiniteLineCycleCorrespondenceAction.lean'
      - 'GSTFiniteLineCycleCorrespondenceOperators.lean'
      - 'GSTFiniteLinePointsGateCoreBasic.lean'
      - 'GSTFiniteLinePointsGateCoreTransport.lean'
      - 'GSTFiniteLinePointsGateDischargeBridges.lean'
      - 'GSTFiniteLinePointsGateDischargeInverseA.lean'
      - 'GSTFiniteLinePointsGateDischargeInverseB.lean'
      - 'GSTFiniteLinePrimitiveXSourceFamilies.lean'
      - '.github/workflows/gst-finite-line-unconditional-source.yml'
      - 'lakefile.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-finite-line-unconditional-source
  cancel-in-progress: false

jobs:
  verify:
    name: "Kernel check the unconditional-source module (THE UNCONDITIONAL LAW + universal primitive-X source)"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-finite-line-closed-immersion
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            ELAN_TAG="v4.2.4"
            ELAN_ASSET="elan-x86_64-unknown-linux-gnu.tar.gz"
            ELAN_TMP="$(mktemp -d)"
            ELAN_SRC=""
            for url in \
              "https://github.com/leanprover/elan/releases/download/${ELAN_TAG}/${ELAN_ASSET}" \
              "https://github.com/leanprover/elan/releases/latest/download/${ELAN_ASSET}"; do
              for attempt in 1 2 3; do
                echo "elan fetch: attempt ${attempt}/3 via ${url}"
                if curl -sSfL --connect-timeout 30 -o "${ELAN_TMP}/${ELAN_ASSET}" "$url"; then
                  ELAN_SRC="$url"
                  break 2
                fi
                echo "elan fetch failed via ${url}; sleeping 10s before retry" >&2
                sleep 10
              done
            done
            if [ -z "$ELAN_SRC" ]; then
              echo "FATAL: elan installer download failed on every mirror and attempt" >&2
              exit 1
            fi
            echo "elan installer fetched from ${ELAN_SRC}"
            tar -xzf "${ELAN_TMP}/${ELAN_ASSET}" -C "${ELAN_TMP}"
            chmod u+x "${ELAN_TMP}/elan-init"
            "${ELAN_TMP}/elan-init" -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled GST corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-general-M-law
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: "Ladder 1/5: CycleCorrespondenceBasic"
        id: p1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineCycleCorrespondenceBasic 2>&1 | tee -a gst-finite-line-unconditional-source.log; then
            if [ -f ".lake/build/lib/GSTFiniteLineCycleCorrespondenceBasic.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineCycleCorrespondenceBasic.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "LADDER PIECE 1 COMPILED FRESH — banking"
            else
              echo "LADDER PIECE 1 already banked — replay only"
            fi
          else
            echo "LADDER PIECE 1 timeout/failure — continuing ladder (bank unchanged)"
          fi
      - name: "Bank after ladder 1"
        if: always() && steps.p1.outputs.dirty == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p1
      - name: "Ladder 2/5: CycleCorrespondenceAction"
        id: p2
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineCycleCorrespondenceAction 2>&1 | tee -a gst-finite-line-unconditional-source.log; then
            if [ -f ".lake/build/lib/GSTFiniteLineCycleCorrespondenceAction.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineCycleCorrespondenceAction.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "LADDER PIECE 2 COMPILED FRESH — banking"
            else
              echo "LADDER PIECE 2 already banked — replay only"
            fi
          else
            echo "LADDER PIECE 2 timeout/failure — continuing ladder (bank unchanged)"
          fi
      - name: "Bank after ladder 2"
        if: always() && steps.p2.outputs.dirty == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p2
      - name: "Ladder 3/5: CycleCorrespondenceOperators"
        id: p3
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineCycleCorrespondenceOperators 2>&1 | tee -a gst-finite-line-unconditional-source.log; then
            if [ -f ".lake/build/lib/GSTFiniteLineCycleCorrespondenceOperators.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineCycleCorrespondenceOperators.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "LADDER PIECE 3 COMPILED FRESH — banking"
            else
              echo "LADDER PIECE 3 already banked — replay only"
            fi
          else
            echo "LADDER PIECE 3 timeout/failure — continuing ladder (bank unchanged)"
          fi
      - name: "Bank after ladder 3"
        if: always() && steps.p3.outputs.dirty == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p3
      - name: "Ladder 4/5: CycleCorrespondence"
        id: p4
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineCycleCorrespondence 2>&1 | tee -a gst-finite-line-unconditional-source.log; then
            if [ -f ".lake/build/lib/GSTFiniteLineCycleCorrespondence.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineCycleCorrespondence.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "LADDER PIECE 4 COMPILED FRESH — banking"
            else
              echo "LADDER PIECE 4 already banked — replay only"
            fi
          else
            echo "LADDER PIECE 4 timeout/failure — continuing ladder (bank unchanged)"
          fi
      - name: "Bank after ladder 4"
        if: always() && steps.p4.outputs.dirty == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p4
      - name: "Ladder 5/5: UnconditionalSource (the verdict piece)"
        id: p5
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BEFORE=$(date +%s)
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineUnconditionalSource 2>&1 | tee -a gst-finite-line-unconditional-source.log; then
            if [ -f ".lake/build/lib/GSTFiniteLineUnconditionalSource.olean" ] && [ "$(stat -c %Y .lake/build/lib/GSTFiniteLineUnconditionalSource.olean)" -ge "$BEFORE" ]; then
              echo "dirty=true" >> "$GITHUB_OUTPUT"
              echo "LADDER PIECE 5 COMPILED FRESH — banking"
            else
              echo "LADDER PIECE 5 already banked — replay only"
            fi
          else
            echo "LADDER PIECE 5 timeout/failure — continuing ladder (bank unchanged)"
          fi
      - name: "Bank after ladder 5"
        if: always() && steps.p5.outputs.dirty == 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-p5
      - name: Verdict (full-target rebuild + the sorryAx hard-fail)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout --kill-after=30s 1500 lake build GSTFiniteLineUnconditionalSource 2>&1 | tee -a gst-finite-line-unconditional-source.log; then
            echo "LEAN PASSED: Kernel check the unconditional-source module (THE UNCONDITIONAL LAW + universal primitive-X source)"
          else
            pkill -KILL -x lean 2>/dev/null || true
            sleep 1
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-finite-line-unconditional-source.log | tail -n 100 || true
            tail -n 75 gst-finite-line-unconditional-source.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-finite-line-unconditional-source.log; then
            echo "Unexpected axiom or sorry found" && exit 1
          fi
      - name: Save reusable compiled GST dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-finite-line-unconditional-source-${{ github.run_id }}-final
      - name: Upload exact Lean compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-finite-line-unconditional-source-lean
          path: gst-finite-line-unconditional-source.log
          if-no-files-found: warn
