name: Mathbox Polarized Hodge Residual Energy
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTPolarizedHodgeResidualEnergy.lean
      - .github/workflows/gst-polarized-hodge-residual-energy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-residual-energy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel verify Hodge Riemann polarized residual identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTHodgeResidualEnergy"
          roots = [
            "GSTUniversalHodgeResidualProjection",
            "GSTPolarizedHodgeResidualEnergy"
          ]
          EOF
          if lake build GSTHodgeResidualEnergy > gst-residual-energy.log 2>&1; then
            echo "LEAN PASSED: exact polarized primitive Hodge residual Pythagoras"
          else
            grep -nE 'error:|sorryAx|✖' gst-residual-energy.log | tail -n 130 || true
            tail -n 145 gst-residual-energy.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-residual-energy.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-polarized-residual-energy-log
          path: gst-residual-energy.log
          if-no-files-found: warn
