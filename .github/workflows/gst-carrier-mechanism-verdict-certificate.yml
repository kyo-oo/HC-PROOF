name: GST Carrier Mechanism Verdict Certificate

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTCarrierMechanismVerdictCertificate.lean'
      - '.github/workflows/gst-carrier-mechanism-verdict-certificate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-carrier-mechanism-verdict-certificate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean installation
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        id: lean-install
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Save cached Lean toolchain
        if: steps.lean-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.run_id }}
      - name: Kernel verify carrier-mechanism verdict certificate
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTCarrierMechanismVerdictCertificate"
          roots = ["GSTCarrierMechanismVerdictCertificate"]
          EOF
          if lake build GSTCarrierMechanismVerdictCertificate > carrier-mechanism-verdict.log 2>&1; then
            echo "LEAN PASSED: index-collision certificate INT W_R theta^2 = 0, theta^4 surjection count, single-band kill, and twist-chi (RR-invisibility) arithmetic kernel-verified"
          else
            grep -nE 'error:|sorryAx|✖' carrier-mechanism-verdict.log | tail -n 140 || true
            tail -n 120 carrier-mechanism-verdict.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" carrier-mechanism-verdict.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-carrier-mechanism-verdict-certificate-log
          path: carrier-mechanism-verdict.log
          if-no-files-found: warn
