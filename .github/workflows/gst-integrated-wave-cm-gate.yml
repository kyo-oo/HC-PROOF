name: GST Integrated Wave CM Hodge Gate

on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTGraphV2IntegratedWaveCMGate.lean'
      - '.github/workflows/gst-integrated-wave-cm-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gst-integrated-wave-cm-gate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-wave-cm-gate
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Install Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled corpus
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-Linux-wave-cm-gate
          restore-keys: |
            hc-lean-incremental-Linux-
      - name: Lean kernel compile integrated wave and CM operator calculus
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTIntegratedWaveCMGateLib GSTGraphV2IntegratedWaveCMGate
          if timeout 9900 lake build GSTGraphV2IntegratedWaveCMGate > gst-integrated-wave-cm.log 2>&1; then
            echo "LEAN PASSED: GSTGraphV2IntegratedWaveCMGate"
          else
            grep -nE 'error:|sorryAx|unknown constant|unknown identifier' gst-integrated-wave-cm.log | tail -n 120 || true
            tail -n 90 gst-integrated-wave-cm.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-integrated-wave-cm.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-integrated-wave-cm-gate-lean
          path: gst-integrated-wave-cm.log
          if-no-files-found: warn
