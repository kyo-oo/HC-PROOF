name: GST Image3 Pure CM curvature-only all-N original-X landing

on:
  push:
    branches:
      - research/gpt6-image3-cm-curvature-only-ranked-source-20261111
    paths:
      - 'GSTImageThreePureCMCurvatureNative.lean'
      - 'GSTImageThreePureCMOriginalXLanding.lean'
      - 'GSTImageThreeCMGeometricLandingCriterion.lean'
      - '.github/workflows/gst-image3-pure-cmcurvature-originalx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-gst-image3-originalx
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Prepare pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel-check native curvature and all-N ORIGINAL-X Chow-Betti compiler
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTPureCMCurvatureOriginalX GSTImageThreeCMGeometricLandingCriterion
          if timeout 6700 lake build GSTImageThreeCMGeometricLandingCriterion > gst-image3-purecm-geometry.log 2>&1; then
            echo "LEAN PASSED: original true CM-only native source, geometric all-N class square, and exact surjective cyclic landing criterion"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-image3-purecm-geometry.log | tail -n 120 || true
            tail -n 140 gst-image3-purecm-geometry.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-image3-purecm-geometry.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-image3-purecm-original-X
          path: gst-image3-purecm-geometry.log
          if-no-files-found: warn
