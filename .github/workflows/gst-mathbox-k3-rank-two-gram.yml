name: Mathbox K3 Rank Two Primitive Intersection Gram
on:
  push:
    branches: [research/mathbox-k3-diagonal-primitive-20261015]
    paths:
      - GSTK3PrimitiveGram.lean
      - .github/workflows/gst-mathbox-k3-rank-two-gram.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-mathbox-k3-gram-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Lean kernel-check full K3 primitive intersection Gram
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTK3RankTwoGram"
          roots = ["GSTK3PrimitiveGram"]
          EOF
          if lake build GSTK3RankTwoGram > k3-gram.log 2>&1; then
            echo 'LEAN PASSED: rank two genuine K3 intersection Gram'
          else
            grep -nE 'error:|sorryAx|✖' k3-gram.log | tail -n 180 || true
            tail -n 150 k3-gram.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" k3-gram.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-mathbox-k3-rank-two-gram-log
          path: k3-gram.log
          if-no-files-found: warn
