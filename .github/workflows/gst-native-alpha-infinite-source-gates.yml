name: GST native prescribed-alpha infinite source gates
on:
  push:
    branches:
      - research/gpt6-native-point-primitive-span-20261017
    paths:
      - 'GSTNativeAlphaMarkedInfiniteSourceGate.lean'
      - '.github/workflows/gst-native-alpha-infinite-source-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Prepare pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Verify true alpha-period, conic deformation and generic Chow source gates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTNativeAlphaSourceGateLib GSTNativeAlphaMarkedInfiniteSourceGate
          if lake build GSTNativeAlphaMarkedInfiniteSourceGate > gst-native-alpha-source-gates.log 2>&1; then
            echo "LEAN PASSED: prescribed-alpha Hodge preservation and Chow source geometry gates"
          else
            tail -n 180 gst-native-alpha-source-gates.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-native-alpha-source-gates.log; then
            echo "forbidden sorryAx" && exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-native-alpha-infinite-source-gates
          path: gst-native-alpha-source-gates.log
          if-no-files-found: warn
