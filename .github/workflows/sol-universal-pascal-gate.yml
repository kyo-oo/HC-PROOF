name: Sol Universal Pascal Lefschetz Gate

on:
  push:
    branches:
      - sol/universal-pascal-lefschetz
    paths:
      - 'GSTUniversalLefschetzBasisPaths.lean'
      - 'GSTUniversalPascalLefschetzBlocks.lean'
      - 'GSTUniversalLefschetzPathFormula.lean'
      - 'GSTUniversalLefschetzCosmology.lean'
      - 'lakefile.toml'
      - '.github/workflows/sol-universal-pascal-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-universal-pascal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pascal-lefschetz:
    name: Universal Pascal Lefschetz branch gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            GSTUniversalLefschetzBasisPaths.lean
            GSTUniversalPascalLefschetzBlocks.lean
          )
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "${files[@]}"; then
            echo SOL_PASCAL_FORBIDDEN_PROOF_ESCAPE=1
            exit 1
          fi
          echo SOL_PASCAL_PROOF_ESCAPE_CHECK=PASS

      - name: Compile Pascal Lefschetz layers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            GSTUniversalLefschetzBasisPaths \
            GSTUniversalPascalLefschetzBlocks 2>&1 | tee sol-pascal.log
          echo SOL_PASCAL_BUILD_GREEN=1

      - name: Verify no sorryAx
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sorryAx' sol-pascal.log; then
            echo SOL_PASCAL_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo SOL_PASCAL_AXIOM_AUDIT=PASS

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-universal-pascal-diagnostics
          path: sol-pascal.log
          if-no-files-found: ignore
