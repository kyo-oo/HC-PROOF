name: GST Actual Noncellular Primitive Curve Formula
on:
  push:
    branches: [research/gpt6-gst-blowup-transfer-20261015]
    paths:
      - GSTBlowupNoncellularPrimitiveCurve.lean
      - .github/workflows/gst-blowup-primitive-curve.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-blowup-primitive-curve-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-primitive
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Compile all-genus polarized primitive algebraic cycle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTBlowupCurvePrimitive"
          roots = ["GSTBlowupNoncellularPrimitiveCurve"]
          EOF
          if lake build GSTBlowupCurvePrimitive > gst-primitive-curve.log 2>&1; then
            echo "LEAN PASSED: explicit all-genus nonzero primitive native cycle"
          else
            grep -nE 'error:|sorryAx|✖' gst-primitive-curve.log | tail -n 150 || true
            tail -n 120 gst-primitive-curve.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-primitive-curve.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-noncellular-primitive-curve-lean-log
          path: gst-primitive-curve.log
          if-no-files-found: warn
