name: Hodge Conjecture Final Integration Gate

on:
  push:
    branches:
      - sol/hodge-conjecture-final-integration
      - sol/hodge-single-separator-successor
      - sol/hodge-math-frontier-closure-20261002
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hodge-conjecture-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-hodge-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Pre-build stale-ilean import-edge dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTClassicalHodgeLocalSeedBareLefschetzExtinction GSTClassicalHodgeRelativeSuccessorExactStratum GSTClassicalHodgeConcreteFailureDichotomy GSTGeometricRealizationStage2D 2>&1 | tee -a hodge-final.log

      - name: Compile complete classical Hodge mathematics lane
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build HodgePureMath 2>&1 | tee hodge-final.log

      - name: Compile degree-rigid cycle-class upgrade
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeDegreeRigidCycleClassUpgrade.lean 2>&1 | tee -a hodge-final.log

      - name: Compile tomography defect splice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeTomographyDefectSplice.lean 2>&1 | tee -a hodge-final.log

      - name: Compile atomic-defect tomography ghost
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeAtomicDefectTomographyGhost.lean 2>&1 | tee -a hodge-final.log

      - name: Compile atomic-defect tomography synchronization
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeAtomicDefectTomographySynchronization.lean 2>&1 | tee -a hodge-final.log

      - name: Compile atomic-defect operator descent
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeAtomicDefectOperatorDescent.lean 2>&1 | tee -a hodge-final.log

      - name: Compile atomic-defect equivariant irreducibility
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeAtomicDefectEquivariantIrreducibility.lean 2>&1 | tee -a hodge-final.log

      - name: Compile multiplicity-forgetting kernel audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeMultiplicityForgettingKernel.lean 2>&1 | tee -a hodge-final.log

      - name: Compile cohomological pairing frontier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeCohomologicalPairingFrontier.lean 2>&1 | tee -a hodge-final.log

      - name: Compile polarized Hodge ghost
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgePolarizedHodgeGhost.lean 2>&1 | tee -a hodge-final.log

      - name: Compile polarized orthogonal extinction audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgePolarizedOrthogonalExtinctionAudit.lean 2>&1 | tee -a hodge-final.log

      - name: Compile projective detector-moment collision
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeProjectiveDetectorMomentCollision.lean 2>&1 | tee -a hodge-final.log

      - name: Compile projective detector visibility
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeProjectiveDetectorVisibility.lean 2>&1 | tee -a hodge-final.log

      - name: Compile two-burst cycle-class tomography receipt
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeTwoBurstClosureReceipt.lean 2>&1 | tee -a hodge-final.log

      - name: Compile degree-rigid tomographic blackout synthesis
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeDegreeRigidTomographicBlackout.lean 2>&1 | tee -a hodge-final.log

      - name: Compile finite-correspondence Betti naturality
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeFiniteCorrespondenceCohomologyNaturality.lean 2>&1 | tee -a hodge-final.log

      - name: Compile visibility equivalence audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeVisibilityEquivalenceAudit.lean 2>&1 | tee -a hodge-final.log

      - name: Compile universal cycle-naturality barrier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeUniversalNaturalityBarrier.lean 2>&1 | tee -a hodge-final.log

      - name: Compile direct orbit-word saturation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean GSTClassicalHodgeDirectOrbitWordSaturation.lean 2>&1 | tee -a hodge-final.log

      - name: Compile unified HodgeConjecture landing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean HodgeConjecture.lean 2>&1 | tee -a hodge-final.log

      - name: Final trust audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "declaration uses 'sorry'|sorryAx" hodge-final.log; then
            echo "FINAL HODGE GATE FAILED: unresolved sorry/sorryAx detected"
            exit 1
          fi
          echo "FINAL HODGE GATE: no sorry/sorryAx detected in compiled receipts"

      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-conjecture-final-integration-diagnostics
          path: hodge-final.log
          if-no-files-found: error
