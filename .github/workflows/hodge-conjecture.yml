name: Hodge Conjecture Final Integration Gate

on:
  push:
    branches:
      - sol/hodge-conjecture-final-integration
      - sol/hodge-strict-betti-correspondence-fusion-20261003
      - sol/gst-plane-completeness-8408fd0
      - clean/upgraded-advanced-only-20261009
    paths:
      - '**/*.lean'
      - 'lakefile.toml'
      - '.github/workflows/hodge-conjecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hodge-conjecture-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-math:
    name: Complete Hodge mathematics
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Restore cached Lean toolchain
        id: lean-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Save cached Lean toolchain
        if: steps.lean-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore incremental Lean compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-complete-math
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Compile entire classical Hodge lane
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build HodgePureMath 2>&1 | tee hodge-complete-math.log
      - name: Check finale Lean files in bounded parallelism
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          modules=(
            GSTClassicalHodgeVerticalRayProjectiveApexFinale
            GSTClassicalHodgeStrictBettiApexL2Fusion
            GSTClassicalHodgeCommonClassPlaneReduction
            GSTClassicalHodgeNativePointSeedDegreeUpgrade
            GSTClassicalHodgeGSTProjectiveWordExactFinale
            GSTClassicalHodgeGSTRationalCorrespondenceExactFinale
            GSTClassicalHodgeDirectOrbitWordSaturation
            HodgeConjecture
            GSTClassicalHodgeNativeWordFromArbitrarySeed
            GSTClassicalHodgeBranchPacketPlaneRealization
            GSTClassicalHodgeNativeMassBridgeAudit
            GSTClassicalHodgeNativePointSeedSaturation
            GSTClassicalHodgeGeometryFirstGlobalPropagation
          )
          printf '%s\n' "${modules[@]}" | xargs -P 3 -n 1 bash -c '
            set -euo pipefail
            mod="$1"
            if lake env lean "$mod.lean" > "diag-$mod.log" 2>&1; then
              echo "PASS: $mod"
            else
              echo "FAIL: $mod"
              cat "diag-$mod.log"
              exit 1
            fi
          ' _ 2>&1 | tee hodge-direct-finale.log

      - name: 'Trust audit - reject sorry/sorryAx receipts'
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f hodge-complete-math.log
          if grep -E "declaration uses 'sorry'|sorryAx" hodge-complete-math.log hodge-direct-finale.log 2>/dev/null; then
            echo "Proof trust audit failed: sorry/sorryAx in compiler receipts"
            exit 1
          fi
      - name: Save successful partial Lean compilation products
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-complete-math
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-complete-math-diagnostics
          path: |
            hodge-complete-math.log
            hodge-direct-finale.log
            diag-*.log
          if-no-files-found: warn
  integration-frontier:
    name: Integration frontier (parallel)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Restore cached Lean toolchain
        id: lean-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Save cached Lean toolchain
        if: steps.lean-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore incremental Lean compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-integration-frontier
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Compile all final-integration roots in one parallel Lake graph
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            GSTClassicalHodgeOmniversalSeparatorGhostCrown \
            GSTClassicalHodgeCanonicalPointIncidenceTransfer \
            GSTClassicalHodgeStrictCorrespondenceChainTransfer \
            GSTClassicalHodgeStrictGraphBettiTrace \
            GSTClassicalHodgeFullCorrespondenceGSTPlaneCompletion \
            GSTClassicalHodgeClosedCorrespondenceCosmicRealization \
            GSTClassicalHodgeIncidenceRealizationEquivalence 2>&1 | tee hodge-integration-frontier.log
      - name: 'Trust audit - reject sorry/sorryAx receipts'
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f hodge-integration-frontier.log
          if grep -E "declaration uses 'sorry'|sorryAx" hodge-integration-frontier.log; then
            echo "Proof trust audit failed: sorry/sorryAx in compiler receipts"
            exit 1
          fi
      - name: Save successful partial Lean compilation products
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-integration-frontier
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-integration-frontier-diagnostics
          path: hodge-integration-frontier.log
          if-no-files-found: warn
