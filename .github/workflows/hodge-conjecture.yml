name: Compact Native Cycle Probe

on:
  push:
    branches:
      - probe/hodge-compact-cycle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-cycle-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile compact native cycle probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build GSTNativeCodimensionCyclePresentation GSTProjectiveOverC 2>&1 | tee compact-cycle.log
          lake env lean GSTCompactNativeCyclePresentation.lean 2>&1 | tee -a compact-cycle.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-cycle-probe-diagnostics
          path: compact-cycle.log
          if-no-files-found: ignore