name: GST Unbounded-Dimension Codimension-Two Primitive Extraction
on:
  push:
    branches:
      - mathbox/bd23-single-operator-charge-wedge
    paths:
      - 'GSTUniversalCodimensionTwoPrimitiveExtraction.lean'
      - '.github/workflows/gst-universal-codimension-two-primitive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gst-codimension-two-primitive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore pinned Lean
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Restore compiled dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hc-lean-incremental-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-all-dimensional-codim2
          restore-keys: |
            hc-lean-incremental-${{ runner.os }}-
      - name: Kernel verify all-dimensional codimension-two primitive construction
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >> lakefile.toml <<'EOF'
          [[lean_lib]]
          name = "GSTAllDimensionalCodimTwoPrimitive"
          roots = [
            "GSTUniversalLefschetzCurveCycles",
            "GSTClassicalHodgeGeometricMatrixRankLanding",
            "GSTUniversalPrimitiveDivisorConstruction",
            "GSTUniversalCodimensionTwoPrimitiveExtraction"
          ]
          EOF
          if lake build GSTAllDimensionalCodimTwoPrimitive > codim2-primitive-lean.log 2>&1; then
            echo "LEAN PASSED: all-dimensional algebraic correction and native primitive middle extraction"
          else
            grep -nE 'error:|sorryAx|✖' codim2-primitive-lean.log | tail -n 140 || true
            tail -n 100 codim2-primitive-lean.log
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" codim2-primitive-lean.log; then
            exit 1
          fi
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-all-dimensional-codimension-two-log
          path: codim2-primitive-lean.log
          if-no-files-found: warn
