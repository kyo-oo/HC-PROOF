name: HC Hodge Core Repair Focus

on:
  push:
    branches:
      - clean/upgraded-advanced-only-20261009
    paths:
      - 'GSTClassicalHodgeSeparatorProjectiveDefectSurvival.lean'
      - 'GSTClassicalHodgeAmbientCorrespondenceKernelAction.lean'
      - '.github/workflows/hc-hodge-core-repair-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hc-hodge-core-repair-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module:
          - GSTClassicalHodgeSeparatorProjectiveDefectSurvival
          - GSTClassicalHodgeAmbientCorrespondenceKernelAction
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile targeted Hodge core module
        shell: bash
        env:
          LEAN_MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build "$LEAN_MODULE" 2>&1 | tee "hodge-core-${LEAN_MODULE}.log"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-core-${{ matrix.module }}
          path: hodge-core-*.log
          if-no-files-found: warn
