name: GST simultaneous cardinal-native original-X compiler

on:
  push:
    branches:
      - research/gpt6-gst-cardinal-intent-reconstruction-20261110
    paths:
      - 'GSTCardinalSimultaneousOriginalXCompiler.lean'
      - '.github/workflows/gst-cardinal-original-x-compiler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Restore Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: hc-lean-toolchain-Linux-cardinal-compiler
          restore-keys: |
            hc-lean-toolchain-Linux-
      - name: Setup pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Kernel check original-X native word/packet/curvature compiler
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/gst_lean_dependency_roots.py GSTCardinalOriginalXLib GSTCardinalSimultaneousOriginalXCompiler
          if timeout 6500 lake build GSTCardinalSimultaneousOriginalXCompiler > gst-cardinal-compiler.log 2>&1; then
            echo "LEAN PASSED: GSTCardinalSimultaneousOriginalXCompiler"
          else
            grep -nE 'error:|sorryAx|unknown identifier|unsolved goals|failed to synthesize' gst-cardinal-compiler.log | tail -n 110 || true
            tail -n 110 gst-cardinal-compiler.log || true
            exit 1
          fi
          if grep -E "declaration uses 'sorry'|sorryAx" gst-cardinal-compiler.log; then
            echo "Unexpected sorry axiom" && exit 1
          fi
      - name: Save compile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gst-cardinal-original-x-compiler-log
          path: gst-cardinal-compiler.log
          if-no-files-found: warn
