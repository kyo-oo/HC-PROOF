name: General Space Hodge Gate

on:
  push:
    branches:
      - sol/hodge-general-space-cosmology-20261003
    paths:
      - 'GSTGeneralSpace*.lean'
      - 'GSTGraphV2GeneralSpaceRealization.lean'
      - 'GSTWorldCosmologyGeneralSpaceRealization.lean'
      - 'GSTClassicalHodgeGeneralSpace*.lean'
      - '.github/workflows/general-space-hodge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: general-space-hodge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  general-space-hodge:
    name: General Space ontology and Hodge synchronization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            GSTGeneralSpace.lean
            GSTGeneralSpaceTransport.lean
            GSTGeneralSpaceRecoordination.lean
            GSTGeneralSpaceRealization.lean
            GSTGeneralSpaceDuality.lean
            GSTGeneralSpaceCohomology.lean
            GSTGraphV2GeneralSpaceRealization.lean
            GSTWorldCosmologyGeneralSpaceRealization.lean
            GSTClassicalHodgeGeneralSpaceRealization.lean
            GSTClassicalHodgeGeneralSpaceSynchronization.lean
            GSTClassicalHodgeGeneralSpaceDefectExtinction.lean
            GSTGeneralSpaceIntegrationSmoke.lean
          )
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "${files[@]}"; then
            echo GENERAL_SPACE_FORBIDDEN_PROOF_ESCAPE=1
            exit 1
          fi
          echo GENERAL_SPACE_PROOF_ESCAPE_CHECK=PASS

      - name: Compile General Space stack
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          exec > >(tee general-space-hodge.log) 2>&1

          out=.lake/build/lib/lean
          mkdir -p "$out"

          compile () {
            local mod="$1"
            echo "=== COMPILE $mod ==="
            lake env lean -o "$out/$mod.olean" "$mod.lean"
          }

          # Fail fast on the carrier-independent ontology before building the
          # heavier historical GST/Hodge closure.
          compile GSTGeneralSpace
          compile GSTGeneralSpaceTransport
          compile GSTGeneralSpaceRecoordination
          compile GSTGeneralSpaceRealization
          compile GSTGeneralSpaceDuality
          compile GSTGeneralSpaceCohomology

          # Build already-registered roots used by the realization adapters.
          lake build \
            GSTClassicalHodgePointNormalForm \
            GSTCompactNativeCyclePresentation \
            GSTClassicalHodgeLimitlessSpinePropagation \
            GSTClassicalHodgeProjectiveCorrespondenceCosmicRealization \
            GSTClassicalHodgeSynchronizedDefectOrbit \
            GSTClassicalHodgeKernelStableOperatorAlgebra \
            GSTClassicalHodgePrimitivePushforwardNaturality \
            GSTGraphV2NonEuclidean \
            GSTGraphV2ScaleEquivariance \
            GSTWorldCosmology

          # Recent Hodge bridge modules predate this registry pass.
          compile GSTClassicalHodgeFiniteSpineMomentOrbit
          compile GSTClassicalHodgeProjectiveWordOrbit
          compile GSTClassicalHodgeGradedGeometricProgramOrbit
          compile GSTClassicalHodgeGeometricCycleClassPointRigidity
          compile GSTClassicalHodgeExactClayStatement

          # Existing GST universes as General Space realizations.
          compile GSTGraphV2GeneralSpaceRealization
          compile GSTWorldCosmologyGeneralSpaceRealization

          # Native / Betti / Hodge realization and synchronization.
          compile GSTClassicalHodgeGeneralSpaceRealization
          compile GSTClassicalHodgeGeneralSpaceSynchronization
          compile GSTClassicalHodgeGeneralSpaceDefectExtinction

          compile GSTGeneralSpaceIntegrationSmoke
          echo GENERAL_SPACE_BUILD_GREEN=1

      - name: Verify no sorryAx
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sorryAx' general-space-hodge.log; then
            echo GENERAL_SPACE_FORBIDDEN_SORRYAX=1
            exit 1
          fi
          echo GENERAL_SPACE_AXIOM_AUDIT=PASS

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-space-hodge-diagnostics
          path: general-space-hodge.log
          if-no-files-found: ignore
